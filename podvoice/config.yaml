# PodVoice Home Assistant add-on manifest.
# Production behavior follows docs/INVARIANTER.md; tunable defaults live in
# gatekeeper/settings.py and operational constants in gatekeeper/constants.py.
name: PodVoice
version: "2.0.36"
slug: podvoice
description: GPT-Live full-duplex voice assistant for custom-firmware Voice PE
arch:
  - aarch64
image: ghcr.io/bixelventures/{arch}-addon-podvoice
startup: application
init: false
host_network: true
homeassistant_api: true   # SUPERVISOR_TOKEN for the HA tool bridge
hassio_api: true          # lets the panel "Save & restart" the add-on itself
# Sidebar panel served on :8098 (PodConnect owns :8099) behind HA Ingress.
ingress: true
ingress_port: 8098
panel_icon: mdi:microphone-message
panel_title: PodVoice
# Configuration holds the API key and explicit one-use PodView pairing authority.
# Everything else (model, PodConnect
# URL/token, Voice-PE PSK, rooms and tuning) is edited in the panel's
# Settings page and stored in the add-on's /data (see settings.py).
options:
  openai_api_key: ""
  podview_visual_policy: ""
  podview_mood_policy: ""
  podview_mood_setup_policy: ""
  podview_weather_city: ""
  podview_robot_read_policy: ""
  podview_research_visual_policy: ""
  podview_control_policy: ""
  podview_controller_enabled: false
  podview_controller_days: 30
  podview_controller_pairing_seconds: 600
  podview_controller_generation: ""
  podview_pairing_room: ""
  podview_pairing_sha256: ""
schema:
  openai_api_key: "password?"
  podview_visual_policy: "str?"
  podview_mood_policy: "str?"
  podview_mood_setup_policy: "str?"
  podview_weather_city: "str?"
  podview_robot_read_policy: "str?"
  podview_research_visual_policy: "str?"
  podview_control_policy: "str?"
  podview_controller_enabled: "bool?"
  podview_controller_days: "int(1,30)?"
  podview_controller_pairing_seconds: "int(600,86400)?"
  podview_controller_generation: "password?"
  podview_pairing_room: "str?"
  podview_pairing_sha256: "password?"
