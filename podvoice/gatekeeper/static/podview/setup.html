<!doctype html>
<html lang="da">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>PodView · Forbind denne enhed</title>
 <link rel="stylesheet" href="ui/components.css">
 <link rel="stylesheet" href="setup.css">
 <script type="module" src="setup.js"></script>
</head>
<body>
 <main>
  <a href="./">← Til PodView</a>
  <h1>Forbind PodView</h1>
  <p>Godkend denne enhed én gang i Home Assistant. Så husker PodView den.</p>
  <form id="pair-form">
   <label for="device-name">Enhedens navn</label>
   <input id="device-name" name="name" type="text" autocomplete="off" maxlength="48" required>
   <button id="pair-submit" type="submit" disabled>Bed om adgang</button>
  </form>
  <p id="pair-status" role="status" aria-live="polite"></p>
  <span id="approval-actions" hidden><a href="/config/integrations/integration/podvoice" target="_blank" rel="noopener">Åbn Home Assistant</a></span>
 </main>
</body>
</html>
