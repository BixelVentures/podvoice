# Experimental codec extension. OFF's default configuration remains podvoice.yaml.
# Compile and verify this distinct artifact before either mode uses it physically.
packages:
  podvoice: !include podvoice.yaml

substitutions:
  podvoice_build_marker: podvoice_build_11397_diagnostics1

esphome:
  build_path: .esphome/build/podvoice-pe-live-alpha

# ESPHome 2026.6.2 supports WAV through the existing audio_http source/mixer.
# YAML framework components run at final codegen priority and pin dependencies.
esp32:
  framework:
    components:
      - name: esphome/micro-decoder
        ref: "0.2.0"
      - name: esphome/micro-wav
        ref: "0.1.0"

audio:
  codecs:
    wav: {}

event:
  - id: !extend podvoice_event
    event_types:
      - podvoice_live_wav_v1
      # Revision identity only; actual audible output still requires a physical test.
      - podvoice_amp_boot_v1
      - podvoice_activity_observer_v1
      - live_semantic_stop_v1
      - wake_reference_v1

# Observer-only telemetry. This does not enable idle control or change VAD/gain.
text_sensor:
  - platform: template
    id: podvoice_activity_status
    name: "PodVoice Activity Status"
    entity_category: diagnostic
    disabled_by_default: true

  # No publish_state: PCM travels only to the current VA subscriber after request.
  - platform: template
    id: podvoice_wake_reference
    name: "PodVoice Wake Reference"
    entity_category: diagnostic
    disabled_by_default: true

podvoice_audio:
  wake_reference_sensor: podvoice_wake_reference
  wake_reference_mute: master_mute_switch
  wake_reference_guard: !lambda |-
    return id(pv_reply).wake_reference_generation(session, require_ack);

podvoice_reply:
  activity_status: podvoice_activity_status

# Live keeps natural speech with the provider. Only the physical/panel Stop closes.
api:
  actions:
    - action: podvoice_wake_snapshot
      variables:
        session: string
        generation: int
      then:
        - lambda: "id(pv_audio).request_wake_snapshot(session, generation);"
    - action: podvoice_live_context
      variables:
        session: string
        generation: int
      then:
        - lambda: "id(pv_reply).set_live_context(session, generation);"
