# Experimental codec extension. OFF's default configuration remains podvoice.yaml.
# Compile and verify this distinct artifact before either mode uses it physically.
packages:
  podvoice: !include podvoice.yaml

substitutions:
  podvoice_build_marker: podvoice_build_113112_liveclosing1

esphome:
  on_boot:
    - priority: -99
      then:
        - lambda: |-
            id(pv_audio).set_closing_led_cancel([]() { id(pv_closing_strip).cancel_closing_tx(); });
            id(pv_audio).set_closing_led_request([](uint32_t token) -> bool {
              if (id(pv_reply).button_stop_latched() || id(master_mute_switch).state ||
                  id(voice_kit_component).is_failed()) return false;
              auto internal = id(voice_assistant_leds).turn_off();
              internal.set_effect("None"); internal.set_transition_length(0); internal.perform();
              auto closing = id(led_ring).turn_on();
              closing.set_effect("None"); closing.set_transition_length(0);
              closing.set_rgb(1.0f, 1.0f, 0.0f); closing.set_brightness(1.0f); closing.perform();
              // Rendering/command admission is NOT the electrical completion ACK.
              auto *partition = static_cast<light::AddressableLight *>(id(led_ring).get_output());
              partition->update_state(id(led_ring));
              auto pixel = (*id(pv_closing_strip))[0];
              Color raw(pixel.get_red_raw(), pixel.get_green_raw(), pixel.get_blue_raw(), pixel.get_white_raw());
              if (!id(pv_audio).closing_yellow_raw(raw.r, raw.g, raw.b, raw.w)) return false;
              return id(pv_closing_strip).arm_closing_tx(token, raw);
            });
            id(pv_closing_strip).set_closing_tx_callback([](uint32_t token, uint32_t sequence, uint32_t tx_us) {
              if (id(pv_reply).button_stop_latched() || id(master_mute_switch).state ||
                  id(voice_kit_component).is_failed()) { id(pv_audio).abort_live_closing(); return; }
              id(pv_audio).closing_led_tx_done(token, sequence, tx_us);
            });
  build_path: .esphome/build/podvoice-pe-live-alpha

# ESPHome 2026.6.2 supports WAV through the existing audio_http source/mixer.
# YAML framework components run at final codegen priority and pin dependencies.
esp32:
  framework:
    components:
      - name: esphome/micro-decoder
        ref: "0.2.0"
      - name: esphome/micro-wav
        ref: "0.1.0"

audio:
  codecs:
    wav: {}

event:
  - id: !extend podvoice_event
    event_types:
      - podvoice_live_wav_v1
      # Revision identity only; actual audible output still requires a physical test.
      - podvoice_amp_boot_v1
      - podvoice_activity_observer_v1
      - live_semantic_stop_v1
      - wake_reference_v1
      # Private opt-in ABI: callback-source ledger, NOT physical F approval.
      - callback_source_pcm_v1
      - closing_led_tx_v1

# Observer-only telemetry. This does not enable idle control or change VAD/gain.
text_sensor:
  - platform: template
    id: podvoice_closing_status
    name: "PodVoice Closing Status"
    entity_category: diagnostic
    disabled_by_default: true
    # Source sends directly to its current sole native subscriber; no publish_state.
  - platform: template
    id: podvoice_activity_status
    name: "PodVoice Activity Status"
    entity_category: diagnostic
    disabled_by_default: true

  # No publish_state: PCM travels only to the current VA subscriber after request.
  - platform: template
    id: podvoice_wake_reference
    name: "PodVoice Wake Reference"
    entity_category: diagnostic
    disabled_by_default: true

podvoice_audio:
  closing_status_sensor: podvoice_closing_status
  wake_reference_sensor: podvoice_wake_reference
  wake_reference_mute: master_mute_switch
  wake_reference_guard: !lambda |-
    return id(pv_reply).wake_reference_generation(session, require_ack);

podvoice_reply:
  activity_status: podvoice_activity_status

# The exposed ring is the native adapter's target. Reuse the base's two-tail
# clockwise pattern; its internal "Thinking" effect only pulses in place.
light:
  - id: !extend leds_internal
    output_id: pv_closing_strip
    closing_tx_observer: true
  - id: !extend led_ring
    effects:
      - addressable_lambda:
          name: "Thinking"
          update_interval: 100ms
          lambda: |-
            // Both partitions drive the same pixels. Stop our effect before the
            // local safety display, including a work command already in flight.
            if (id(pv_reply).button_stop_latched() || id(master_mute_switch).state ||
                id(voice_kit_component).is_failed()) {
              auto work = id(led_ring).turn_off();
              work.set_effect("None"); work.perform();
              id(control_leds).execute();
              return;
            }
            static uint8_t index = 0;
            if (initial_run) index = 0;
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == index || i == (index + 6) % 12) {
                it[i] = color;
              } else if (i == (index + 11) % 12 || i == (index + 5) % 12) {
                it[i] = color * 192;
              } else if (i == (index + 10) % 12 || i == (index + 4) % 12) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
            index = (index + 1) % 12;

# Live keeps natural speech with the provider. Only the physical/panel Stop closes.
api:
  actions:
    - action: podvoice_live_closing
      variables:
        nonce: int
        token: int
      then:
        - lambda: |-
            if (nonce > 0 && token > 0) id(pv_audio).begin_live_closing(nonce, token);
    - action: podvoice_live_closing_cancel
      variables:
        nonce: int
        token: int
      then:
        - lambda: |-
            if (nonce > 0 && token > 0) id(pv_audio).cancel_live_closing(nonce, token);
    - action: podvoice_source_provenance
      variables:
        nonce: int
      then:
        - lambda: |-
            if (nonce > 0) id(pv_audio).enable_source_provenance(nonce);
    - action: podvoice_callback_fence
      variables:
        nonce: int
        token: int
      then:
        - lambda: |-
            if (nonce > 0 && token > 0) id(pv_audio).request_callback_fence(nonce, token);
    - action: podvoice_wake_snapshot
      variables:
        session: string
        generation: int
      then:
        - lambda: "id(pv_audio).request_wake_snapshot(session, generation);"
    - action: podvoice_live_context
      variables:
        session: string
        generation: int
      then:
        - lambda: "id(pv_reply).set_live_context(session, generation);"
