# =============================================================================
# podvoice.yaml — PodVoice Voice PE firmware (SINGLE PODVOICE CHANNEL)
# =============================================================================
#
# This firmware deliberately vendors the pinned Voice PE base. ESPHome concatenates
# trigger lists from packages, so a thin remote overlay cannot replace upstream's
# voice_assistant.start wake automation; it can only add a second wake path. Vendoring
# makes the two intentional lifecycle edits reviewable and removes that ambiguity.
#
# GATE before flashing (do this once): `esphome config podvoice.yaml` must render clean.
#   The rendered-config DIFF vs upstream is your early warning if an upstream id was
#   renamed (which would make an !extend/!remove silently no-op).
# =============================================================================

substitutions:
  name: podvoice-pe
  friendly_name: PodVoice PE
  # The hardware base is vendored from upstream 26.6.0 with an auditable two-block
  # delta: wake word and center button emit PodVoice events and never start HA Assist.

# Inherit the vendored official firmware (board, PSRAM, i2s pins, mic, speaker+mixer+
# resampler, AIC3204 DAC, LEDs, rotary, button, mute, micro_wake_word, voice_kit/XMOS,
# sdkconfig, on_boot). Only the two lifecycle blocks documented in the base differ.
packages:
  ha_voice: !include voice-pe-podvoice-base.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

# --- PodVoice overrides (kept tiny so upstream updates re-merge cheaply) -------------

# API encryption with the PodVoice Noise PSK. The SAME value goes in the add-on's
# Settings -> Voice PE PSK. (A local !secret works here; this file is not a remote pkg.)
api:
  encryption:
    key: !secret podvoice_api_key # VERIFY: define podvoice_api_key in ESPHome secrets
  # Wake-gating control plane: PodVoice flips forwarding on/off over the native API.
  # start doubles as the dead-man keepalive (PodVoice re-asserts it while a session
  # is active; the device force-stops if it goes quiet — see podvoice_audio SAFETY_MS).
  # NOTE: ESPHome 2026.x renamed `api: services:` -> `api: actions:` (confirmed on 2026.6.2).
  actions:
    - action: podvoice_stream_start
      then:
        - lambda: "id(pv_audio).start_streaming();"
    - action: podvoice_stream_stop
      then:
        - script.stop: podvoice_finish_reply
        - lambda: "id(podvoice_reply_phase) = 0;"
        - lambda: "id(pv_audio).stop_streaming();"
    # One wake opens one conversation. The wake engine deliberately stops after that
    # detection and PodVoice rearms it only after Realtime, mic forwarding, playback,
    # and music ducking are all closed. This makes the return to wakeword explicit.
    - action: podvoice_rearm_wake_word
      then:
        - script.stop: podvoice_finish_reply
        - lambda: "id(podvoice_reply_phase) = 0;"
        - lambda: "id(podvoice_conversation_active) = false;"
        - if:
            condition:
              not:
                micro_wake_word.is_running:
            then:
              - micro_wake_word.start:
    # Arm playback telemetry for exactly the next PodVoice reply. Other announcements
    # (timer, HA, test tone) use the same media player and must never close a Realtime
    # conversation or move its LED/echo gate.
    - action: podvoice_reply_expect
      then:
        - lambda: "id(podvoice_reply_phase) = 1;"
    - action: podvoice_reply_cancel
      then:
        - script.stop: podvoice_finish_reply
        - lambda: "id(podvoice_reply_phase) = 0;"
    # RUNTIME audio tuning — no reflash. PodVoice's panel calls these.
    - action: podvoice_set_mic_channel
      variables:
        channel: int
      then:
        - lambda: "id(pv_audio).set_mic_channel(channel);"
    - action: podvoice_set_mic_gain
      variables:
        gain: int
      then:
        - lambda: "id(pv_audio).set_mic_gain(gain);"
    # WAKE WORD, switchable at runtime. The upstream package already ships three trained
    # models (okay_nabu, hey_jarvis, hey_mycroft) — this exposes the choice instead of
    # making it a 25-minute reflash. Exactly ONE is enabled at a time.
    #
    # A lambda, not micro_wake_word.enable_model:, because that action binds a model at
    # COMPILE time (EnableModelAction holds a WakeWordModel*), so it cannot take a name
    # chosen at runtime. `id(x)` expands to (*x) in ESPHome lambdas, hence the dot.
    #
    # The "stop" model is deliberately NOT touched here: upstream's activate_stop_word_once
    # arms and disarms it around each reply, and stomping on it would break stop-while-
    # talking (measured at ~51 ms — the fastest thing this device does).
    - action: podvoice_set_wake_word
      variables:
        name: string
      then:
        - lambda: |-
            const bool nabu    = (name == "okay_nabu");
            const bool jarvis  = (name == "hey_jarvis");
            const bool mycroft = (name == "hey_mycroft");
            if (!nabu && !jarvis && !mycroft) {
              ESP_LOGW("podvoice", "unknown wake word '%s' — keeping the current one",
                       name.c_str());
              return;
            }
            nabu    ? id(okay_nabu).enable()   : id(okay_nabu).disable();
            jarvis  ? id(hey_jarvis).enable()  : id(hey_jarvis).disable();
            mycroft ? id(hey_mycroft).enable() : id(hey_mycroft).disable();
            ESP_LOGI("podvoice", "wake word set to %s", name.c_str());

# PodVoice's first reliable channel uses the upstream external_media_player only for
# assistant RESPONSE audio. The stock voice_assistant component remains dormant as the
# native-API audio subscription endpoint; no VA run is ever started. The former direct
# PCM experiment required a synthetic stock run and is intentionally absent here.

# Snappy default: the cyan ring is the wake/listening acknowledgement.  The stock
# chime adds a speaker event at the most timing-sensitive point and upstream waits
# 300 ms after it before starting VA. ALWAYS_OFF initializes it off after every boot;
# it remains an exposed switch and can still be enabled live for accessibility.
switch:
  - id: !extend wake_sound
    restore_mode: ALWAYS_OFF

# Upstream provisions Wi-Fi through Improv and stores it in NVS. An OTA update keeps
# that network state, so this overlay must not bake a second SSID/password into firmware.
wifi:
  ap: {}

# Firmware-owned single-wake latch. microWakeWord must keep running because its
# microphone lifecycle also drives podvoice_audio's passive tap. A detection sets the
# latch; only PodVoice's post-teardown service clears it.
globals:
  - id: podvoice_conversation_active
    type: bool
    restore_value: false
    initial_value: "false"
  # 0=none, 1=PodVoice reply armed, 2=ANNOUNCING observed, 3=draining the dedicated
  # announcement resampler. Requiring phase 2 prevents an early state callback from
  # fabricating a finish before playback actually began.
  - id: podvoice_reply_phase
    type: uint8_t
    restore_value: false
    initial_value: "0"

# Publish the physical announcement lifecycle explicitly.  Relying on native-API
# MediaPlayerEntityState proved insufficient in the room: audio played, but no
# ANNOUNCING edge reached the add-on.  ESPHome's own on_announcement/on_state triggers
# run at the source and therefore remain authoritative even when music resumes.
media_player:
  - id: !extend external_media_player
    on_state:
      - if:
          condition:
            and:
              - lambda: "return id(podvoice_reply_phase) == 1;"
              - media_player.is_announcing: external_media_player
          then:
            - lambda: "id(podvoice_reply_phase) = 2;"
            - event.trigger:
                id: podvoice_event
                event_type: podvoice_playback_started
      - if:
          condition:
            and:
              - lambda: "return id(podvoice_reply_phase) == 2;"
              - not:
                  media_player.is_announcing: external_media_player
          then:
            - lambda: "id(podvoice_reply_phase) = 3;"
            - script.execute: podvoice_finish_reply
      # !extend replaces the base trigger list on this ESPHome version. Preserve the
      # upstream music-unduck callback explicitly; rendered-config validation locks
      # this beside both PodVoice telemetry callbacks.
      - if:
          condition:
            and:
              - switch.is_off: timer_ringing
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_announcing: external_media_player
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 1.0s

script:
  - id: podvoice_finish_reply
    mode: restart
    then:
      # Media-player IDLE means the source is done; the dedicated announcement
      # resampler may still hold the final samples.  Do not call it physically
      # finished until that private speaker is drained and stopped.
      - wait_until:
          condition:
            lambda: |-
              return !id(announcement_resampling_speaker).has_buffered_data()
                     && !id(announcement_resampling_speaker).is_running();
          timeout: 3s
      - if:
          condition:
            lambda: |-
              return !id(announcement_resampling_speaker).has_buffered_data()
                     && !id(announcement_resampling_speaker).is_running();
          then:
            - event.trigger:
                id: podvoice_event
                event_type: podvoice_playback_finished
          else:
            - event.trigger:
                id: podvoice_event
                event_type: podvoice_playback_fault
      - lambda: "id(podvoice_reply_phase) = 0;"

# --- Phase 2: custom wake-word model (docs/wake-word.md) -----------------------------
# When the custom-trained microWakeWord model is ready, uncomment to load it. NOTE on
# package-merge semantics: LISTS are appended, so this ADDS the model alongside the
# stock okay_nabu (both wake words active — fine for side-by-side wake validation). GATE before flashing:
# `esphome config podvoice.yaml` and check the rendered micro_wake_word.models list;
# fully REPLACING okay_nabu needs the upstream entry removed (verify !remove behaviour
# on the pinned ESPHome — !extend/!remove on single-instance components has burned us).
# micro_wake_word:
#   models:
#     - model: https://github.com/BixelVentures/podvoice/releases/download/wake-v1/podvoice_wake.json
#       id: podvoice_wake

# Redirect on-device wake-word + center single-press to a PodVoice event the add-on
# subscribes to, instead of starting the HA Assist pipeline.
event:
  - platform: template
    id: podvoice_event
    name: "PodVoice event"
    device_class: button
    # podvoice_channel_v1 is a capability marker (not emitted). It proves this firmware
    # owns wake and microphone gating without starting a stock HA Assist run.
    event_types:
      [
        single_press,
        double_press,
        triple_press,
        long_press,
        wake_okay_nabu,
        wake_stop,
        podvoice_channel_v1,
        same_breath_v1,
        wake_audio_boundary_v1,
        deterministic_rearm_v1,
        podvoice_playback_events_v1,
        podvoice_playback_started,
        podvoice_playback_finished,
        podvoice_playback_fault,
      ]

# The vendored base owns micro_wake_word.on_wake_word_detected. It emits exactly one
# wake_okay_nabu event and opens pv_audio; package-list concatenation is deliberately
# avoided because it was the source of the parallel stock-Assist run.

# --- Phase 1a: the continuous-audio shim (the ONE custom C++ piece) ------------------
#   Taps the already-free-running mic (micro_wake_word keeps i2s_mics running with
#   while the local wake engine is running) via a *passive* MicrophoneSource -> PSRAM
#   ring buffer
#   -> drains from loop() as VoiceAssistantAudio over the native API connection PodVoice
#   already holds (it subscribed via subscribe_voice_assistant). NOT start_continuous,
#   NOT a voice_assistant.cpp fork. Same wire message: diag.py run_s1 needs NO change;
#   voicepe.py's _handle_audio was fixed to the real (data, data2) callback shape.
#
#   DURING DEVELOPMENT this points at the in-repo component (local path). Once S1/S2/AEC
#   pass on hardware, move it to its OWN pinned repo (BixelVentures/podvoice-esphome) and
#   switch `source` to the git form below; bump that ref deliberately with the ESPHome +
#   package refs (the update ritual).
#
external_components:
  # GIT (default — so you only need THIS one file in ESPHome; the component is fetched
  # automatically from the PodVoice repo under esphome/components/podvoice_audio/).
  # During the S1 hardware-iteration loop we point at `main` with refresh:0s so a
  # re-Install always pulls the latest fix — you change nothing on your side.
  # NOTE: builds MUST run outside iCloud (see docs) — /private/tmp/pv-esphome.
  # Use the LOCAL form while iterating on the component; the git form is what a
  # fresh machine should use once the change is pushed.
  - source: { type: local, path: components }
    components: [podvoice_audio]
  # - source: { type: git, url: https://github.com/BixelVentures/podvoice, ref: main }
  #   components: [podvoice_audio]
  #   refresh: 0s
  # Local alternative (only if you copied the repo's esphome/ folder into /config/esphome):
  # - source: { type: local, path: components }
  #   components: [podvoice_audio]

podvoice_audio:
  id: pv_audio  # referenced by the api: services above (start/stop forwarding)
  # The `microphone:` sub-block IS the ESPHome microphone_source schema (same shape
  # voice_assistant uses). Short form `microphone: i2s_mics` also works.
  microphone:
    microphone: i2s_mics   # upstream Voice PE mic id (i2s_audio, 16 kHz, 32-bit stereo)
    channels: [0, 1]       # BOTH XMOS channels — the component de-interleaves and
                           # picks one at RUNTIME (services below), so trying the
                           # other channel is a 5-second service call, never a
                           # 25-minute rebuild. ch0 = enhanced (AEC+NS+AGC),
                           # ch1 = AGC-less (what HA core feeds STT engines that prefer
                           # no auto-gain; PodVoice keeps this already-NS-processed
                           # source free of a second provider noise filter).
    gain_factor: 4         # +12 dB start value, also runtime-settable below.
  default_channel: 1       # AGC-less audio by default (evidence in podvoice_audio.h):
                           # HA core feeds non-auto-gained audio to STT engines that ask for it,
                           # and PodVoice does not need ch0's extra AGC pass, which
                           # pumped room reverb and made
                           # far-field Danish unintelligible (field 2026-08-06).
                           # Switch live with podvoice_set_mic_channel if the room says otherwise.
  # Local rolling capacity for decoupling the audio task from the API task. At the
  # physical wake edge begin_conversation() resets it, so "Okay Nabu" and pre-wake
  # room sound never reach Realtime. Audio produced after that edge is retained by
  # the add-on's separate preconnect buffer while the provider socket opens.
  ring_ms: 1500
