# =============================================================================
# podvoice.yaml — PodVoice Voice PE firmware (THIN OVERLAY)
# =============================================================================
#
# This is the MAINTAINABLE replacement for the old copy-pasted voice-pe.yaml sketch.
# Per the engineering review (4-expert synthesis): inherit the official firmware as a
# pinned remote `packages:` include and express PodVoice's changes as small overrides,
# so board/pin/audio-graph drift is absorbed automatically on the next ref bump.
#
# WHAT THIS FILE DOES NOT DO YET:
#   The continuous-audio mechanism (Spike S1) is the `podvoice_audio` external_component
#   — added in Phase 1a, ONLY after run_s1/run_s2/AEC pass on real hardware. It is
#   commented out below. This overlay alone flashes a stock-equivalent device plus the
#   PSK + wake->event redirect, which is enough to run the Connection check.
#
# GATE before flashing (do this once): `esphome config podvoice.yaml` must render clean.
#   The rendered-config DIFF vs upstream is your early warning if an upstream id was
#   renamed (which would make an !extend/!remove silently no-op).
# =============================================================================

substitutions:
  name: podvoice-pe
  friendly_name: PodVoice PE
  # Pin the upstream firmware ref here; bump deliberately (see the update ritual in DOCS).
  ha_voice_ref: "26.6.0" # pin to the upstream release matching your ESPHome (2026.6.x)

# Inherit the ENTIRE official firmware (board, PSRAM, i2s pins, mic, speaker+mixer+
# resampler, AIC3204 DAC, LEDs, rotary, button, mute, micro_wake_word, voice_kit/XMOS,
# sdkconfig, on_boot). We never copy these — they ride the ref.
packages:
  ha_voice:
    url: https://github.com/esphome/home-assistant-voice-pe
    files: [home-assistant-voice.yaml]
    ref: ${ha_voice_ref}
    # NOT `never`: refresh:never serves a STALE cached base even when ha_voice_ref
    # changes (this caused the 26.4.0 esphome-const clash on a 26.6.x host). 1d picks
    # up a ref bump within a day; do "Clean Build Files" once after changing the ref.
    refresh: 0s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

# --- PodVoice overrides (kept tiny so upstream updates re-merge cheaply) -------------

# API encryption with the PodVoice Noise PSK. The SAME value goes in the add-on's
# Settings -> Voice PE PSK. (A local !secret works here; this file is not a remote pkg.)
api:
  encryption:
    key: !secret podvoice_api_key # VERIFY: define podvoice_api_key in ESPHome secrets
  # Wake-gating control plane: PodVoice flips forwarding on/off over the native API.
  # start doubles as the dead-man keepalive (PodVoice re-asserts it while a session
  # is active; the device force-stops if it goes quiet — see podvoice_audio SAFETY_MS).
  # NOTE: ESPHome 2026.x renamed `api: services:` -> `api: actions:` (confirmed on 2026.6.2).
  actions:
    - action: podvoice_stream_start
      then:
        - lambda: "id(pv_audio).start_streaming();"
    - action: podvoice_stream_stop
      then:
        - lambda: "id(pv_audio).stop_streaming();"
    # Prime ESPHome's Voice Assistant for native-API audio before a direct reply.
    # VoiceAssistant defaults to legacy UDP mode after every reboot. Merely subscribing
    # with API_AUDIO does not change that mode; a start/request/port=0 handshake does.
    # Without this explicit preparation, a direct speaker test before the first wake
    # dereferences the unopened UDP socket and reboots the puck (hardware-proven).
    - action: podvoice_direct_prepare
      then:
        - voice_assistant.start:
    # RUNTIME audio tuning — no reflash. PodVoice's panel calls these.
    - action: podvoice_set_mic_channel
      variables:
        channel: int
      then:
        - lambda: "id(pv_audio).set_mic_channel(channel);"
    - action: podvoice_set_mic_gain
      variables:
        gain: int
      then:
        - lambda: "id(pv_audio).set_mic_gain(gain);"
    # WAKE WORD, switchable at runtime. The upstream package already ships three trained
    # models (okay_nabu, hey_jarvis, hey_mycroft) — this exposes the choice instead of
    # making it a 25-minute reflash. Exactly ONE is enabled at a time.
    #
    # A lambda, not micro_wake_word.enable_model:, because that action binds a model at
    # COMPILE time (EnableModelAction holds a WakeWordModel*), so it cannot take a name
    # chosen at runtime. `id(x)` expands to (*x) in ESPHome lambdas, hence the dot.
    #
    # The "stop" model is deliberately NOT touched here: upstream's activate_stop_word_once
    # arms and disarms it around each reply, and stomping on it would break stop-while-
    # talking (measured at ~51 ms — the fastest thing this device does).
    - action: podvoice_set_wake_word
      variables:
        name: string
      then:
        - lambda: |-
            const bool nabu    = (name == "okay_nabu");
            const bool jarvis  = (name == "hey_jarvis");
            const bool mycroft = (name == "hey_mycroft");
            if (!nabu && !jarvis && !mycroft) {
              ESP_LOGW("podvoice", "unknown wake word '%s' — keeping the current one",
                       name.c_str());
              return;
            }
            nabu    ? id(okay_nabu).enable()   : id(okay_nabu).disable();
            jarvis  ? id(hey_jarvis).enable()  : id(hey_jarvis).disable();
            mycroft ? id(hey_mycroft).enable() : id(hey_mycroft).disable();
            ESP_LOGI("podvoice", "wake word set to %s", name.c_str());

# B1 step 2a — the ISOLATED VA-output swap (and NOTHING else; the 0.67 firmware bundled
# this with a mww automation + a stream-info lambda and broke wake — this flash isolates
# which change was the culprit). Package maps merge key-by-key: `!remove` deletes the
# upstream `media_player:` key (cv.Exclusive with `speaker:`), and the VA's output
# becomes its own resampler + mixer source. Effects:
#   - wake path UNCHANGED (mww -> voice_assistant.start -> handle_start -> add-on),
#   - the announce/FLAC reply path UNCHANGED (the external_media_player ENTITY remains;
#     only VA-internal announce requests go away, which we never used),
#   - the direct PCM path becomes POSSIBLE (client-driven TTS events + audio frames),
#     but the add-on keeps it disabled until this flash is wake-validated.
#
# Both nodes below MUST be private to Voice Assistant. A private resampler pointed at
# the old announcement_mixing_input is not enough: ResamplerSpeaker::has_buffered_data()
# delegates to its output speaker, and upstream deliberately gives that source
# `timeout: never`. In 1.11.0 the external media player therefore kept VA's shared
# resampler running forever after RESPONSE_FINISHED. This finite-timeout source stops
# itself only after its own ring buffer and pending DAC frames are empty; the private
# resampler then stops, so VA can emit on_tts_stream_end / reply_played.
speaker:
  - id: !extend mixing_speaker
    source_speakers:
      - id: voice_assistant_mixing_input
        # ESPHome's mixer-source default. It starts counting only once both its
        # buffer and pending DAC frames are empty, so it terminates VA ownership
        # without making a normal short network gap restart the audio graph.
        timeout: 500ms
        buffer_duration: 100ms
  - platform: resampler
    id: voice_assistant_resampling_speaker
    output_speaker: voice_assistant_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
    buffer_duration: 100ms
    filters: 16
    taps: 16

voice_assistant:
  media_player: !remove
  speaker: voice_assistant_resampling_speaker
  # B1 step 2b — THE DIRECT PCM PATH. Two triggers, both verified against the pinned
  # upstream C++ (2026.6.x, src/esphome/components/voice_assistant/voice_assistant.cpp).
  #
  # 1) RATE PIN. The VA never sets the speaker's stream info itself — it only calls
  #    speaker_->start() and speaker_->play(). Pin the private resampler explicitly so a
  #    future graph change cannot leave an old stream format latched: our PCM is 24 kHz,
  #    while its output is fixed at the mixer's 48 kHz. TTS_START's handler fires this
  #    trigger and THEN
  #    calls speaker_->start(), which is exactly the order speaker.h documents
  #    ("should be called after calling set_audio_stream_info"). So pin it here, per reply.
  #
  #    0.67 ALSO had this lambda and still chipmunked — because the add-on sent TTS_START
  #    with an EMPTY data map, and the handler bails out before the trigger:
  #      if (text.empty()) { ESP_LOGW("No text in TTS_START event"); return; }
  #    i.e. the lambda never ran AND speaker_->start() was never called. The add-on now
  #    always sends a non-empty text (voicepe.begin_direct_reply) — that is the real fix.
  on_tts_start:
    - lambda: |-
        id(voice_assistant_resampling_speaker).set_audio_stream_info(
            esphome::audio::AudioStreamInfo(16, 1, 24000));
  # 2) BYTE-EXACT PLAYBACK ACK. State::RESPONSE_FINISHED only advances once
  #    speaker_buffer_size_ == 0 AND !has_buffered_data() AND !is_running() — i.e. the
  #    last byte has physically left the DAC — and then fires this trigger. Surfacing it
  #    as an event gives the add-on GROUND TRUTH for "the reply is audible until now",
  #    replacing the 1.8.0 byte-duration ESTIMATE that the echo shield had to guess with.
  on_tts_stream_end:
    - event.trigger:
        id: podvoice_event
        event_type: reply_played

# Upstream provisions Wi-Fi through Improv and stores it in NVS. An OTA update keeps
# that network state, so this overlay must not bake a second SSID/password into firmware.
wifi:
  ap: {}

# --- Phase 2: custom wake-word model (docs/wake-word.md) -----------------------------
# When the custom-trained microWakeWord model is ready, uncomment to load it. NOTE on
# package-merge semantics: LISTS are appended, so this ADDS the model alongside the
# stock okay_nabu (both wake words active — fine for side-by-side wake validation). GATE before flashing:
# `esphome config podvoice.yaml` and check the rendered micro_wake_word.models list;
# fully REPLACING okay_nabu needs the upstream entry removed (verify !remove behaviour
# on the pinned ESPHome — !extend/!remove on single-instance components has burned us).
# micro_wake_word:
#   models:
#     - model: https://github.com/BixelVentures/podvoice/releases/download/wake-v1/podvoice_wake.json
#       id: podvoice_wake

# Redirect on-device wake-word + center single-press to a PodVoice event the add-on
# subscribes to, instead of starting the HA Assist pipeline.
event:
  - platform: template
    id: podvoice_event
    name: "PodVoice event"
    device_class: button
    # direct_speaker_v3 is a capability marker (not emitted). V2 fixed the shared
    # speaker graph, but still crashed if direct audio was tested before the first wake
    # had switched ESPHome from legacy UDP to API audio. V3 also publishes the explicit
    # podvoice_direct_prepare handshake above. reply_played is emitted only after the
    # private path has physically drained.
    event_types:
      [
        single_press,
        double_press,
        triple_press,
        long_press,
        wake_okay_nabu,
        wake_stop,
        same_breath_v1,
        direct_speaker_v3,
        reply_played,
      ]

# Capture from the LOCAL wake edge, before the stock firmware plays its cue and waits
# 300 ms.  The upstream automation still owns mute/timer/announcement handling and the
# audible cue; this appended automation only handles the normal Okay-Nabu path.  It
# opens PodVoice's privacy-gated stream and emits the wake immediately, so the provider
# connects while the user naturally continues with "hvad er klokken?".  The later
# voice_assistant.start callback is intentionally idempotent in the add-on.
#
# Package merge semantics append trigger automations here; they do not replace the
# pinned upstream handler.  `same_breath_v1` is an advertised capability marker so the
# add-on/panel can distinguish this firmware from the old pause-required generation.
micro_wake_word:
  on_wake_word_detected:
    - if:
        condition:
          lambda: |-
            return wake_word == "Okay Nabu" || wake_word == "okay nabu" ||
                   wake_word == "okay_nabu";
        then:
          - lambda: "id(pv_audio).start_streaming();"
          - event.trigger:
              id: podvoice_event
              event_type: wake_okay_nabu

# --- Phase 1a: the continuous-audio shim (the ONE custom C++ piece) ------------------
#   Taps the already-free-running mic (micro_wake_word keeps i2s_mics running with
#   stop_after_detection:false) via a *passive* MicrophoneSource -> PSRAM ring buffer
#   -> drains from loop() as VoiceAssistantAudio over the native API connection PodVoice
#   already holds (it subscribed via subscribe_voice_assistant). NOT start_continuous,
#   NOT a voice_assistant.cpp fork. Same wire message: diag.py run_s1 needs NO change;
#   voicepe.py's _handle_audio was fixed to the real (data, data2) callback shape.
#
#   DURING DEVELOPMENT this points at the in-repo component (local path). Once S1/S2/AEC
#   pass on hardware, move it to its OWN pinned repo (BixelVentures/podvoice-esphome) and
#   switch `source` to the git form below; bump that ref deliberately with the ESPHome +
#   package refs (the update ritual).
#
external_components:
  # GIT (default — so you only need THIS one file in ESPHome; the component is fetched
  # automatically from the PodVoice repo under esphome/components/podvoice_audio/).
  # During the S1 hardware-iteration loop we point at `main` with refresh:0s so a
  # re-Install always pulls the latest fix — you change nothing on your side.
  # NOTE: builds MUST run outside iCloud (see docs) — /private/tmp/pv-esphome.
  # Use the LOCAL form while iterating on the component; the git form is what a
  # fresh machine should use once the change is pushed.
  - source: { type: local, path: components }
    components: [podvoice_audio]
  # - source: { type: git, url: https://github.com/BixelVentures/podvoice, ref: main }
  #   components: [podvoice_audio]
  #   refresh: 0s
  # Local alternative (only if you copied the repo's esphome/ folder into /config/esphome):
  # - source: { type: local, path: components }
  #   components: [podvoice_audio]

podvoice_audio:
  id: pv_audio  # referenced by the api: services above (start/stop forwarding)
  # The `microphone:` sub-block IS the ESPHome microphone_source schema (same shape
  # voice_assistant uses). Short form `microphone: i2s_mics` also works.
  microphone:
    microphone: i2s_mics   # upstream Voice PE mic id (i2s_audio, 16 kHz, 32-bit stereo)
    channels: [0, 1]       # BOTH XMOS channels — the component de-interleaves and
                           # picks one at RUNTIME (services below), so trying the
                           # other channel is a 5-second service call, never a
                           # 25-minute rebuild. ch0 = enhanced (AEC+NS+AGC),
                           # ch1 = AGC-less (what HA core feeds STT engines that prefer
                           # no auto-gain; PodVoice keeps this already-NS-processed
                           # source free of a second provider noise filter).
    gain_factor: 4         # +12 dB start value, also runtime-settable below.
  default_channel: 1       # AGC-less audio by default (evidence in podvoice_audio.h):
                           # HA core feeds non-auto-gained audio to STT engines that ask for it,
                           # and PodVoice does not need ch0's extra AGC pass, which
                           # pumped room reverb and made
                           # far-field Danish unintelligible (field 2026-08-06).
                           # Switch live with podvoice_set_mic_channel if the room says otherwise.
  ring_ms: 400             # fixed PSRAM jitter buffer (~12.8 KB @ 16 kHz/16-bit/mono)
