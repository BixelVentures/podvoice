name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: podvoice-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      tooling_only: ${{ steps.scope.outputs.tooling_only }}
      addon_changed: ${{ steps.scope.outputs.addon_changed }}
      pr_addon_changed: ${{ steps.scope.outputs.pr_addon_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: scope
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci_scope.py
      - name: Exact candidate admission (historical31/32, strict34-40, pending41)
        if: steps.scope.outputs.tooling_only != 'true'
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          candidate_base="${CI_DIFF_BASE:-729668ffa45067bfb75fd6928ccac9f9beaf5576}"
          if [ "$candidate_base" = "6799ee3d65cb67fb406346c565dc206e08cbf0da" ]; then
            python3 scripts/candidate_scope_admission41.py --base "$candidate_base"
          elif [ "$candidate_base" = "97e4b44fd5299136e562d5eebf0076c8ebf83bb2" ]; then
            python3 scripts/candidate_scope_admission40.py --base "$candidate_base"
          elif [ "$candidate_base" = "f0e3d62a5677050d2373f691a61cd733b3dd5be6" ]; then
            python3 scripts/candidate_scope_admission39.py --base "$candidate_base"
          elif [ "$candidate_base" = "e4c2966197ac28aa6e86a0df55e7f461203df269" ]; then
            python3 scripts/candidate_scope_admission38.py --base "$candidate_base"
          elif [ "$candidate_base" = "aa49d94e588974683ad3b9ad4b6d34da81676b58" ]; then
            python3 scripts/candidate_scope_admission37.py --base "$candidate_base"
          elif [ "$candidate_base" = "ed0fbc41d9ab2a9fcdbf0648d2ee0839abd1befd" ]; then
            python3 scripts/candidate_scope_admission36.py --base "$candidate_base"
          elif [ "$candidate_base" = "e4d19282aaa18ddc2d5d1f04b6c7de84c0823d8b" ]; then
            python3 scripts/candidate_scope_admission35.py --base "$candidate_base"
          elif [ "$candidate_base" = "8e7ff9bc9aaaf298a23c93e53bed90c672558b25" ]; then
            python3 scripts/candidate_scope_admission34.py --base "$candidate_base"
          elif [ "$candidate_base" = "abe759678168ba6408e10ae0a8a3621249631d13" ]; then
            python3 scripts/candidate_scope_admission33.py --base "$candidate_base"
          elif [ "$candidate_base" = "0e56c593c6ce9a3e1666b5fd535d3424cc691b9c" ]; then
            python3 scripts/candidate_scope_admission31.py --base "$candidate_base"
          else
            python3 scripts/candidate_scope_admission32.py --base "$candidate_base"
          fi

  lint-test:
    needs: [scope]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cohort: ${{ fromJSON(needs.scope.outputs.tooling_only == 'true' && '["unit"]' || '["unit", "rest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            podvoice/requirements.txt
            podvoice/requirements-dev.txt
      - name: Install development-check dependencies
        if: needs.scope.outputs.tooling_only == 'true'
        run: pip install -r podvoice/requirements-dev.txt
      - name: Install product dependencies
        if: needs.scope.outputs.tooling_only != 'true'
        run: pip install -r podvoice/requirements.txt -r podvoice/requirements-dev.txt
      - name: Check development tools and documentation
        if: needs.scope.outputs.tooling_only == 'true'
        run: |
          ruff check scripts/dev_cycle.py scripts/ci_scope.py tests/unit/test_dev_cycle.py tests/unit/test_ci_scope.py tests/unit/test_release_contract.py
          ruff format --check scripts/dev_cycle.py scripts/ci_scope.py tests/unit/test_dev_cycle.py tests/unit/test_ci_scope.py tests/unit/test_release_contract.py
          python -m pytest -q tests/unit/test_dev_cycle.py tests/unit/test_ci_scope.py tests/unit/test_release_contract.py
      - run: ruff check .
        if: needs.scope.outputs.tooling_only != 'true' && matrix.cohort == 'unit'
      - run: ruff format --check .
        if: needs.scope.outputs.tooling_only != 'true' && matrix.cohort == 'unit'
      - run: mypy podvoice/gatekeeper
        if: needs.scope.outputs.tooling_only != 'true' && matrix.cohort == 'unit'
      - name: Unit tests
        if: needs.scope.outputs.tooling_only != 'true' && matrix.cohort == 'unit'
        run: python -m pytest -v --maxfail=1 -o faulthandler_timeout=60 tests/unit --durations=15 --durations-min=1
      - name: Remaining tests
        if: needs.scope.outputs.tooling_only != 'true' && matrix.cohort == 'rest'
        run: python -m pytest -v --maxfail=1 -o faulthandler_timeout=60 --ignore=tests/unit --ignore=tests/ha_framework --durations=15 --durations-min=1

  ui-browser:
    needs: [scope]
    if: needs.scope.outputs.tooling_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PODVOICE_DEV_CACHE: /home/runner/.cache/podvoice-dev
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/podvoice-dev/browser/ui-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Verify packaged PodView transport and owner contracts
        run: node --test tests/podview/*.test.mjs
      - name: Install pinned development browser dependencies
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify shipped UI in bounded serial browser workers
        run: python -m scripts.browser_gate --worker-timeout 240
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-browser-proof-${{ github.sha }}
          path: /home/runner/.cache/podvoice-dev/browser-proof/ui-browser
          if-no-files-found: warn

  ha-framework:
    needs: [scope]
    if: ${{ always() && !cancelled() && needs.scope.outputs.tooling_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test native admin options and services in pinned HA 2026.8.2
        run: |
          test -f tests/ha_framework/test_options_flow_http.py
          docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --user 65534:65534 \
            --pids-limit 256 --memory 2g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            --workdir /repo --entrypoint python \
            ghcr.io/home-assistant/home-assistant@sha256:56690a89c79a0de98035e1719f8324a92d5859c1192ff45adb0230ea81cb42a5 \
            -B -m unittest discover -s tests/ha_framework -p 'test_*.py' -v

  build-addon:
    needs: [scope]
    if: >-
      github.event_name == 'pull_request' &&
      needs.scope.outputs.tooling_only != 'true' &&
      needs.scope.outputs.pr_addon_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # home-assistant/builder is deprecated; build the aarch64 image with
      # docker buildx + an explicit FROM (BUILD_FROM no longer auto-injected
      # since Supervisor 2026.04.0). See PLAN.md §11 / §6 B.2.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: version
        run: |
          echo "version=$(sed -n 's/^version: \"\(.*\)\"/\1/p' podvoice/config.yaml)" >> "$GITHUB_OUTPUT"
      - id: artifact
        run: echo "context_sha=$(git ls-files -s podvoice | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: candidate-image
        uses: docker/build-push-action@v6
        with:
          context: ./podvoice
          platforms: linux/arm64
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ghcr.io/bixelventures/aarch64-addon-podvoice:build-${{ steps.artifact.outputs.context_sha }}
          labels: org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
          build-args: PODVOICE_GIT_SHA=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=podvoice-aarch64
          # Optional cache export must not hold a completed image push open.
      - name: Verify shipped admin stdin through normal entrypoint
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate-image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          image="ghcr.io/bixelventures/aarch64-addon-podvoice@$CANDIDATE_DIGEST"
          docker pull --platform linux/arm64 "$image"
          bash scripts/check_podview_admin_stdin.sh "$image"

  publish-addon:
    if: >-
      needs.scope.outputs.tooling_only != 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [scope, lint-test, ui-browser, ha-framework]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: version
        run: |
          echo "version=$(sed -n 's/^version: \"\(.*\)\"/\1/p' podvoice/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect immutable release version
        id: release
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ADDON_CHANGED: ${{ needs.scope.outputs.addon_changed }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          release_image="ghcr.io/bixelventures/aarch64-addon-podvoice:$RELEASE_VERSION"
          if inspect_output="$(docker buildx imagetools inspect "$release_image" 2>&1)"; then
            if [ "$ADDON_CHANGED" == 'true' ] || [ "$RELEASE_EVENT" == 'workflow_dispatch' ]; then
              echo "Release version already exists and is immutable." >&2
              exit 1
            fi
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            inspect_status=$?
          fi
          case "$inspect_output" in
            *"manifest unknown"*|*"$release_image: not found"*)
              echo "required=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "$inspect_output" >&2
              exit "$inspect_status"
              ;;
          esac
      - id: artifact
        if: steps.release.outputs.required == 'true'
        run: echo "context_sha=$(git ls-files -s podvoice | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Publish exact tested main image
        id: publish
        if: steps.release.outputs.required == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./podvoice
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/bixelventures/aarch64-addon-podvoice:${{ steps.version.outputs.version }}
            ghcr.io/bixelventures/aarch64-addon-podvoice:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: PODVOICE_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=podvoice-aarch64
          # Optional cache export must not hold a completed image push open.
      - name: Record published digest
        if: steps.release.outputs.required == 'true'
        run: echo "published_digest=${{ steps.publish.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
