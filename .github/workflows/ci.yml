          elif [ "$candidate_base" = "4f183f19689fcf87f90d26c6a14a8e6e153d93c1" ]; then
            python3 scripts/candidate_scope_admission43.py --base "$candidate_base"
          elif [ "$candidate_base" = "fa7a3d1d5f09d31aa04e842dbce22f8654f2eca5" ]; then
            python3 scripts/candidate_scope_admission42.py --base "$candidate_base"
          elif [ "$candidate_base" = "6799ee3d65cb67fb406346c565dc206e08cbf0da" ]; then
            python3 scripts/candidate_scope_admission41.py --base "$candidate_base"
          elif [ "$candidate_base" = "97e4b44fd5299136e562d5eebf0076c8ebf83bb2" ]; then
            python3 scripts/candidate_scope_admission40.py --base "$candidate_base"
          elif [ "$candidate_base" = "f0e3d62a5677050d2373f691a61cd733b3dd5be6" ]; then
