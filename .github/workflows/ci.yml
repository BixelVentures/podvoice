name: CI

# One simple pipeline: lint, tests, UI, HA framework, build. Main publishes the add-on.
# No candidate admission, exact-tree binding or result reuse: every run tests the code.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: podvoice-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Network flakes (npm/pip/DNS) retry instead of failing the run.
  PIP_RETRIES: "5"
  PIP_TIMEOUT: "30"
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "10000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "60000"

jobs:
  changes:
    # Pull requests run the browser journeys their files can affect; main runs all of them.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            node scripts/ci-affected-journeys.mjs "$(git merge-base "$BASE" "$HEAD")" "$HEAD"
          else
            node scripts/ci-affected-journeys.mjs
          fi

  python:
    # The server suite is split over two parallel jobs; together they run every test file.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/2", "1/2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            podvoice/requirements.txt
            podvoice/requirements-dev.txt
      - run: pip install -r podvoice/requirements.txt -r podvoice/requirements-dev.txt
      - if: matrix.shard == '0/2'
        run: ruff check .
      - if: matrix.shard == '0/2'
        run: ruff format --check .
      - if: matrix.shard == '1/2'
        run: mypy podvoice/gatekeeper
      - env:
          PYTEST_SHARD: ${{ matrix.shard }}
        run: python -m pytest -n auto tests/unit tests/integration

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - name: npm ci (retried on network flakes)
        run: |
          for attempt in 1 2 3; do npm ci --ignore-scripts && exit 0; sleep $((attempt * 15)); done
          exit 1
      - name: Committed PodView assets match their sources
        run: |
          node scripts/prepare-podview-checkout.mjs
          npm run check:components
      - name: PodView unit and component tests
        run: node --test tests/podview/*.test.mjs

  radio-contract:
    # PodConnect's /api/radio/* shape (main after podconnect#142, transcribed in the test)
    # and PodVoice's adapter, server and PodView parser must agree, without skips.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            podvoice/requirements.txt
            podvoice/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: pip install -r podvoice/requirements.txt -r podvoice/requirements-dev.txt
      - name: npm ci (retried on network flakes)
        run: |
          for attempt in 1 2 3; do npm ci --ignore-scripts && exit 0; sleep $((attempt * 15)); done
          exit 1
      - run: npm run build:assets
      - name: PodConnect, Python and PodView radio contract without skips
        env:
          PODVIEW_CANONICAL_ROOT: ${{ github.workspace }}
        run: |
          python -m pytest -o addopts="" -q -rs tests/integration/test_podview_radio.py | tee radio-contract.log
          if grep -q SKIPPED radio-contract.log; then
            echo "::error::Radio contract tests were skipped"
            exit 1
          fi

  journeys:
    # Real-browser user journeys in parallel jobs; long journeys are split into shards.
    # The list comes from `changes` (all on main, affected ones on pull requests).
    needs: changes
    if: needs.changes.outputs.any == 'true'
    name: journeys (${{ matrix.journey }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            podvoice/requirements.txt
            podvoice/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: pip install -r podvoice/requirements.txt -r podvoice/requirements-dev.txt
      - name: npm ci (retried on network flakes)
        working-directory: tests/browser
        run: |
          for attempt in 1 2 3; do npm ci --ignore-scripts && exit 0; sleep $((attempt * 15)); done
          exit 1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/browser/package-lock.json') }}
      - name: Chromium for Playwright
        # The runner image usually has Chromium's system libraries; apt (slow, DNS flakes)
        # only runs when the browser cannot start without it.
        working-directory: tests/browser
        run: |
          retry() { for attempt in 1 2 3; do timeout 300 "$@" && return 0; sleep $((attempt * 15)); done; return 1; }
          retry node node_modules/playwright/cli.js install chromium
          launch="require('playwright').chromium.launch().then(b => b.close())"
          if ! node -e "$launch"; then
            echo "::notice::Installing Chromium system libraries with apt"
            retry node node_modules/playwright/cli.js install-deps chromium
            node -e "$launch"
          fi
      - name: PodView journey
        if: matrix.journey != 'panel'
        env:
          JOURNEY_SHARD: ${{ matrix.shard }}
          JOURNEY_BASE_ALONE: ${{ matrix.base_alone }}
          PODVIEW_TEST_PYTHON: python3
          PODVIEW_TEST_ARTIFACT_DIR: ${{ runner.temp }}/browser-proof
        run: node tests/browser/podview_actual_journeys.cjs ${{ matrix.journey }}
      - name: Panel journeys
        if: matrix.journey == 'panel'
        env:
          PODVOICE_BROWSER_PROOF: "1"
          PODVOICE_UI_PROOF_DIR: ${{ runner.temp }}/browser-proof
        run: |
          mkdir -p "$PODVOICE_UI_PROOF_DIR"
          export PODVOICE_TEST_CHROMIUM="$(node -e "console.log(require('./tests/browser/node_modules/playwright').chromium.executablePath())")"
          for journey in live_status daily_ui wake_words settings_dirty setup_flow; do
            echo "::group::$journey"
            node "tests/browser/$journey.cjs"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-proof-${{ matrix.journey }}-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ runner.temp }}/browser-proof
          if-no-files-found: ignore

  ha-framework:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Native integration in pinned HA 2026.8.2
        run: |
          docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --user 65534:65534 \
            --pids-limit 256 --memory 2g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            --workdir /repo --entrypoint python \
            ghcr.io/home-assistant/home-assistant@sha256:56690a89c79a0de98035e1719f8324a92d5859c1192ff45adb0230ea81cb42a5 \
            -B -m unittest discover -s tests/ha_framework -p 'test_*.py' -v

  build-addon:
    # Only when the add-on image itself can change; code is covered by the test jobs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: packaging
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --quiet "$base" HEAD -- podvoice/Dockerfile podvoice/requirements.txt podvoice/run.sh podvoice/build.yaml podvoice/config.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Build the aarch64 image with docker buildx + an explicit FROM
      # (BUILD_FROM is no longer auto-injected since Supervisor 2026.04.0).
      - uses: docker/setup-qemu-action@v3
        if: steps.packaging.outputs.changed == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.packaging.outputs.changed == 'true'
      - id: version
        if: steps.packaging.outputs.changed == 'true'
        run: |
          echo "version=$(sed -n 's/^version: \"\(.*\)\"/\1/p' podvoice/config.yaml)" >> "$GITHUB_OUTPUT"
      - id: artifact
        if: steps.packaging.outputs.changed == 'true'
        run: echo "context_sha=$(git ls-files -s podvoice | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: >-
          steps.packaging.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: candidate-image
        if: steps.packaging.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./podvoice
          platforms: linux/arm64
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ghcr.io/bixelventures/aarch64-addon-podvoice:build-${{ steps.artifact.outputs.context_sha }}
          labels: org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
          build-args: PODVOICE_GIT_SHA=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=podvoice-aarch64
          # Optional cache export must not hold a completed image push open.
      - name: Verify shipped admin stdin through normal entrypoint
        if: steps.packaging.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate-image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          image="ghcr.io/bixelventures/aarch64-addon-podvoice@$CANDIDATE_DIGEST"
          docker pull --platform linux/arm64 "$image"
          bash scripts/check_podview_admin_stdin.sh "$image"

  publish-addon:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [python, ui, journeys, ha-framework]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: version
        run: |
          echo "version=$(sed -n 's/^version: \"\(.*\)\"/\1/p' podvoice/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: changed
        run: |
          if git diff --quiet HEAD^ HEAD -- podvoice; then echo "addon=false" >> "$GITHUB_OUTPUT"; else echo "addon=true" >> "$GITHUB_OUTPUT"; fi
      - name: Inspect immutable release version
        id: release
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ADDON_CHANGED: ${{ steps.changed.outputs.addon }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          release_image="ghcr.io/bixelventures/aarch64-addon-podvoice:$RELEASE_VERSION"
          if inspect_output="$(docker buildx imagetools inspect "$release_image" 2>&1)"; then
            if [ "$ADDON_CHANGED" == 'true' ] || [ "$RELEASE_EVENT" == 'workflow_dispatch' ]; then
              echo "Release version already exists and is immutable." >&2
              exit 1
            fi
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            inspect_status=$?
          fi
          case "$inspect_output" in
            *"manifest unknown"*|*"$release_image: not found"*)
              echo "required=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "$inspect_output" >&2
              exit "$inspect_status"
              ;;
          esac
      - id: artifact
        if: steps.release.outputs.required == 'true'
        run: echo "context_sha=$(git ls-files -s podvoice | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Publish exact tested main image
        id: publish
        if: steps.release.outputs.required == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./podvoice
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/bixelventures/aarch64-addon-podvoice:${{ steps.version.outputs.version }}
            ghcr.io/bixelventures/aarch64-addon-podvoice:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: PODVOICE_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=podvoice-aarch64
          # Optional cache export must not hold a completed image push open.
      - name: Record published digest
        if: steps.release.outputs.required == 'true'
        run: echo "published_digest=${{ steps.publish.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
