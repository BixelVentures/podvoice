name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: podvoice-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promotion:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.evaluate.outputs.reuse }}
    steps:
      - id: checkout
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: evaluate
        continue-on-error: true
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.checkout.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m scripts.ci_promotion

  scope:
    needs: [promotion]
    runs-on: ubuntu-latest
    outputs:
      tooling_only: ${{ steps.scope.outputs.tooling_only }}
      ci_control_only: ${{ steps.scope.outputs.ci_control_only }}
      addon_changed: ${{ steps.scope.outputs.addon_changed }}
      pr_addon_changed: ${{ steps.scope.outputs.pr_addon_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: scope
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci_scope.py
      - name: Exact candidate admission (historical31/32, strict34-79)
        if: >-
          steps.scope.outputs.tooling_only != 'true' &&
          steps.scope.outputs.ci_control_only != 'true' &&
          needs.promotion.outputs.reuse != 'true'
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          candidate_base="${CI_DIFF_BASE:-729668ffa45067bfb75fd6928ccac9f9beaf5576}"
          if [ "$candidate_base" = "7742699ea8ca0c9b70498a7c2f63e86b039c3eed" ]; then
            python3 scripts/candidate_scope_admission79.py --base "$candidate_base"
          elif [ "$candidate_base" = "a537077b0ecb31a9def0759cf5a5c44873f0ec85" ]; then
            python3 scripts/candidate_scope_admission78.py --base "$candidate_base"
          elif [ "$candidate_base" = "5b753604c703e90f7fd5c63ea3ccd219ab814670" ]; then
