timer_status:
  name: Timerstatus
  description: PodVoice HA-owned timer contract v1. Read exact endpoint timers and pending expiry receipts.
  fields:
    endpoint:
      required: true
      selector:
        text:
timer_command:
  name: Timer
  description: PodVoice HA-owned timer contract v1. A complete request uses the current Core epoch and an immutable caller request ID.
  fields:
    endpoint:
      required: true
      selector:
        text:
    epoch:
      required: true
      selector:
        text:
    request_id:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        select:
          options:
            - start
            - cancel
            - acknowledge_finished
            - claim_alert
            - report_alert
    seconds:
      selector:
        number:
          min: 1
          max: 86400
          mode: box
    name:
      selector:
        text:
    timer_id:
      selector:
        text:
    language:
      selector:
        text:
    alert_id:
      selector:
        text:
    phase:
      selector:
        text:
    sink_id:
      selector:
        text:
controller_list:
  name: List PodView browser requests and profiles
  description: Show bounded nonsecret pending requests and active browser profiles to a current HA administrator.
  fields:
    room:
      required: true
      selector:
        text:
controller_approve:
  name: Approve PodView browser request
  description: Explicitly approve one pending browser profile until it is removed.
  fields:
    room:
      required: true
      selector:
        text:
    request_id:
      required: true
      selector:
        text:
controller_revoke_identity:
  name: Revoke PodView browser profile
  description: Revoke only the selected browser profile.
  fields:
    room:
      required: true
      selector:
        text:
    identity:
      required: true
      selector:
        text:
controller_revoke:
  name: Revoke PodView controller
  description: Emergency close all browser profiles in the room.
  fields:
    room:
      required: true
      selector:
        text:
controller_receipt:
  name: Internal PodVoice controller receipt
  description: Private machine-authenticated completion from the fixed add-on.
  fields:
    nonce:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        text:
    room:
      required: true
      selector:
        text:
    outcome:
      required: true
      selector:
        text:
    payload:
      required: true
      selector:
        text:
    mac:
      required: true
      selector:
        text:

controller_recover:
  name: Gendan PodView-skærmadgang
  description: En aktuel HA-administrator fjerner alle tidligere skærme og binder frisk godkendelse til rummets aktuelle opsætning. Godkender ingen skærm automatisk.
  fields:
    room:
      required: true
      selector:
        text:

robot_snapshot:
  name: Robot snapshot
  description: Read-only projection of the admitted Roborock cache for the PodVoice Supervisor caller. No refresh or device commands.
  fields:
    entity_id:
      required: true
      selector:
        text:
    config_entry_id:
      required: true
      selector:
        text:
    device_id:
      required: true
      selector:
        text:
    unique_id:
      required: true
      selector:
        text:
    model:
      required: true
      selector:
        text:
robot_water_snapshot:
  name: Robot water snapshot
  description: Read-only water settings from the admitted Roborock cache for the PodVoice Supervisor caller. No refresh or device commands.
  fields:
    entity_id:
      required: true
      selector:
        text:
    config_entry_id:
      required: true
      selector:
        text:
    device_id:
      required: true
      selector:
        text:
    unique_id:
      required: true
      selector:
        text:
    model:
      required: true
      selector:
        text:
vehicle_snapshot:
  name: Vehicle snapshot
  description: Read-only timestamped Tesla snapshot through the existing HA integration. Supervisor caller only; no wake or vehicle commands.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    device_id:
      required: true
      selector:
        text:
    entities:
      required: true
      selector:
        object:
