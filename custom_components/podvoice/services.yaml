timer_status:
  name: Timerstatus
  description: PodVoice HA-owned timer contract v1. Read exact endpoint timers and pending expiry receipts.
  fields:
    endpoint:
      required: true
      selector:
        text:
timer_command:
  name: Timer
  description: PodVoice HA-owned timer contract v1. A complete request uses the current Core epoch and an immutable caller request ID.
  fields:
    endpoint:
      required: true
      selector:
        text:
    epoch:
      required: true
      selector:
        text:
    request_id:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        select:
          options:
            - start
            - cancel
            - acknowledge_finished
            - claim_alert
            - report_alert
    seconds:
      selector:
        number:
          min: 1
          max: 86400
          mode: box
    name:
      selector:
        text:
    timer_id:
      selector:
        text:
    language:
      selector:
        text:
    alert_id:
      selector:
        text:
    phase:
      selector:
        text:
    sink_id:
      selector:
        text:
timer_command_v2:
  name: Timer
  description: PodVoice HA-owned timer contract v2. A complete request uses the current Core epoch and an immutable caller request ID.
  fields:
    endpoint:
      required: true
      selector:
        text:
    epoch:
      required: true
      selector:
        text:
    request_id:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        select:
          options:
            - start
            - cancel
            - acknowledge_finished
            - claim_alert
            - report_alert
            - adjust
    seconds:
      selector:
        number:
          min: 1
          max: 86400
          mode: box
    name:
      selector:
        text:
    timer_id:
      selector:
        text:
    language:
      selector:
        text:
    alert_id:
      selector:
        text:
    phase:
      selector:
        text:
    sink_id:
      selector:
        text:
    delta_seconds:
      selector:
        number:
          min: -86400
          max: 86400
          mode: box
    expected_revision:
      selector:
        text:
    lookup_only:
      selector:
        boolean:
robot_snapshot:
  name: Robot snapshot
  description: Read-only projection of the admitted Roborock cache for the PodVoice Supervisor caller. No refresh or device commands.
  fields:
    entity_id:
      required: true
      selector:
        text:
    config_entry_id:
      required: true
      selector:
        text:
    device_id:
      required: true
      selector:
        text:
    unique_id:
      required: true
      selector:
        text:
    model:
      required: true
      selector:
        text:
robot_water_snapshot:
  name: Robot water snapshot
  description: Read-only water settings from the admitted Roborock cache for the PodVoice Supervisor caller. No refresh or device commands.
  fields:
    entity_id:
      required: true
      selector:
        text:
    config_entry_id:
      required: true
      selector:
        text:
    device_id:
      required: true
      selector:
        text:
    unique_id:
      required: true
      selector:
        text:
    model:
      required: true
      selector:
        text:
robot_observation_snapshot:
  name: Robot historical observation
  description: Read-only historical robot field observations for the PodVoice Supervisor caller. Never control authority.
  fields:
    binding:
      required: true
      selector:
        object:
vehicle_snapshot:
  name: Vehicle snapshot
  description: Read-only timestamped Tesla snapshot through the existing HA integration. Supervisor caller only; no wake or vehicle commands.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    device_id:
      required: true
      selector:
        text:
    entities:
      required: true
      selector:
        object:
    trunk_control:
      description: Read only the current native evidence for the configured rear trunk.
      selector:
        boolean:
    include_charge_eta:
      description: Include a current charging estimate from the configured Tesla Fleet source when available.
      required: false
      selector:
        boolean:
robot_panel_state:
  name: PodView robotstatus
  description: The household's vacuums from HA's registry with their admitted transport actions and Roborock telemetry. For any signed-in user.
robot_command:
  name: PodView robotbetjening
  description: One transport action (pause, resume, stop, return), sent once only if HA still shows the state and features the user saw.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: vacuum
    action:
      required: true
      selector:
        select:
          options: [resume, pause, stop, return]
    expected_state:
      required: true
      selector:
        select:
          options: [cleaning, paused, returning, idle, docked]
    expected_features:
      required: true
      selector:
        number:
          min: 0
          max: 2147483648
          mode: box
vehicle_panel_state:
  name: PodView bilstatus
  description: The household's Tesla Fleet cars from HA's registries, what each last reported with per-field timestamps, and its unresolved command risk. For any signed-in user.
vehicle_command:
  name: PodView bilbetjening
  description: One car action under PodVoice's risk model. Lock is sent at once; everything else returns a confirmation token that must be confirmed within 15 seconds.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: tesla_fleet
    action:
      required: true
      selector:
        select:
          options: [lock, unlock, climateOn, climateOff, temperature, defrostOn, defrostOff, driverSeatHeat, passengerSeatHeat, rearTrunkToggle]
    args:
      selector:
        object:
    confirmation:
      selector:
        text:
    acknowledge_prior_unresolved:
      selector:
        boolean:
robot_cleaning_state:
  name: PodView robotens rum
  description: The rooms HA maps to the vacuum's active floor, its cleaning settings, the offer revision a start must name, and the journal of recent starts (the panel's own and the add-on's). For any signed-in user.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: vacuum
robot_setting:
  name: PodView robotindstilling
  description: One cleaning setting (cleaning mode, water, route, suction or floor), sent once only if HA still shows the value the user saw. The floor changes only while the robot is idle or docked.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: vacuum
    key:
      required: true
      selector:
        select:
          options: [cleaning_mode, mop_intensity, mop_mode, suction, map]
    setting_entity_id:
      required: true
      selector:
        text:
    value:
      required: true
      selector:
        text:
    expected_current:
      selector:
        text:
robot_start:
  name: PodView robotstart
  description: A room cleaning from the offer the user saw (rooms, repeat 1-3, settings, optional recipe), only while the robot is idle or docked and no earlier start is unknown. Settings first, then one start; nothing is retried.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: vacuum
    area_ids:
      required: true
      selector:
        area:
          multiple: true
    repeat:
      selector:
        number:
          min: 1
          max: 3
    settings:
      selector:
        object:
    expected_state:
      required: true
      selector:
        select:
          options: [idle, docked]
    revision:
      required: true
      selector:
        text:
    recipe_id:
      selector:
        text:
vehicle_history:
  name: PodView bilens hændelser
  description: The car's lock, trunk, climate and charging changes over the last day from HA's recorder. For any signed-in user.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: tesla_fleet
speaker_rooms:
  name: Højttalernes rum
  description: Hvilket rum hver PodConnect-højttaler hører til efter PodConnects egne rumregler. HA's områder er kun reserve.
music_shelf:
  name: Find musik-hylde
  description: PodConnects »For dig« (top_tracks) eller »Senest« (recently_played) til Find musik.
  fields:
    shelf:
      required: true
      selector:
        select:
          options: [top_tracks, recently_played]
music_search:
  name: Find musik-søgning
  description: Søg i Spotify gennem PodConnect (højst 10 resultater), efter fritekst eller et Stemning/Humør-tema.
  fields:
    query:
      required: false
      selector:
        text:
    theme:
      required: false
      selector:
        text:
    kind:
      required: false
      selector:
        select:
          options: [track, playlist]
music_moods:
  name: Find musik-stemninger
  description: Stemning- og Humør-temaerne fra PodVoice-add-on'et til Find musik. Kalder ikke Spotify.
music_picks:
  name: Find musik AI-valgt
  description: AI-valgte playlister fra PodVoice-add-on'et (tid, ugedag, årstid, vejr, topkunstnere) via Spotify-søgning.
  fields:
    weather_entity:
      required: false
      selector:
        entity:
          domain: weather
music_queue:
  name: Rummets kø
  description: Læs PodConnects native kø for en PodConnect-rumafspiller. Spiller intet.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: media_player
          integration: podconnect
music_queue_play:
  name: Afspil fra køen
  description: Læser køen igen og afspiller præcis den viste forekomst én gang. Et ukendt udfald gentages ikke.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: media_player
          integration: podconnect
    option_id:
      required: true
      selector:
        text:
    uri:
      required: true
      selector:
        text:
music_move:
  name: Flyt musik til et andet rum
  description: Flytter kontoens musik til rummet (PodConnect move_playback). Aldrig en anden Spotify-kontos musik.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: media_player
          integration: podconnect
    target_entity_id:
      required: true
      selector:
        entity:
          domain: media_player
          integration: podconnect
radio_state:
  name: Radioens tilstand
  description: PodConnect Speakers' radio (stationer, rum, hvad der spiller), eller hvorfor den ikke kan nås.
radio_command:
  name: Radiohandling
  description: Start, flyt, stop eller lydstyrke på PodConnect Speakers' radio, sendt én gang.
  fields:
    action:
      required: true
      selector:
        select:
          options: [start, move, stop, volume]
    station_id:
      required: false
      selector:
        select:
          options: [p3, p1, p4-ostjylland, p6-beat, p8-jazz]
    target_id:
      required: false
      selector:
        text:
    volume_percent:
      required: false
      selector:
        number:
          min: 0
          max: 100
answers_snapshot:
  name: Svar fra PodVoice
  description: Læser PodVoice-add-on'ets gemte svar til PodView-panelet. Kun for en indlogget Home Assistant-bruger.
  fields:
    room:
      required: false
      selector:
        text:
recipes_snapshot:
  name: Opskrifter fra PodVoice
  description: Læser PodVoice-add-on'ets opskriftskatalog til PodView-panelet. Kun for en indlogget Home Assistant-bruger.
weather_place:
  name: Vejrets sted
  description: Stedet Vejr viser (PodVoice-add-on'ets podview_weather_city, ellers Home Assistants placering eller hjem-zonen). Kun for en indlogget Home Assistant-bruger.
weather_advice:
  name: Vejrråd fra PodVoice
  description: Læser eller starter PodVoice-add-on'ets AI-vejrråd for det aktuelle vejr til PodView-panelet (én forespørgsel pr. vejr). Kun for en indlogget Home Assistant-bruger.
  fields:
    start:
      required: false
      selector:
        boolean:
