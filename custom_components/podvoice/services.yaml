timer_status:
  name: Timerstatus
  description: PodVoice HA-owned timer contract v1. Read exact endpoint timers and pending expiry receipts.
  fields:
    endpoint:
      required: true
      selector:
        text:
timer_command:
  name: Timer
  description: PodVoice HA-owned timer contract v1. A complete request uses the current Core epoch and an immutable caller request ID.
  fields:
    endpoint:
      required: true
      selector:
        text:
    epoch:
      required: true
      selector:
        text:
    request_id:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        select:
          options:
            - start
            - cancel
            - acknowledge_finished
            - claim_alert
            - report_alert
    seconds:
      selector:
        number:
          min: 1
          max: 86400
          mode: box
    name:
      selector:
        text:
    timer_id:
      selector:
        text:
    language:
      selector:
        text:
    alert_id:
      selector:
        text:
    phase:
      selector:
        text:
    sink_id:
      selector:
        text:
timer_command_v2:
  name: Timer
  description: PodVoice HA-owned timer contract v2. A complete request uses the current Core epoch and an immutable caller request ID.
  fields:
    endpoint:
      required: true
      selector:
        text:
    epoch:
      required: true
      selector:
        text:
    request_id:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        select:
          options:
            - start
            - cancel
            - acknowledge_finished
            - claim_alert
            - report_alert
            - adjust
    seconds:
      selector:
        number:
          min: 1
          max: 86400
          mode: box
    name:
      selector:
        text:
    timer_id:
      selector:
        text:
    language:
      selector:
        text:
    alert_id:
      selector:
        text:
    phase:
      selector:
        text:
    sink_id:
      selector:
        text:
    delta_seconds:
      selector:
        number:
          min: -86400
          max: 86400
          mode: box
    expected_revision:
      selector:
        text:
    lookup_only:
      selector:
        boolean:
controller_list:
  name: List PodView browser requests and profiles
  description: Show bounded nonsecret pending requests and active browser profiles to a current HA administrator.
  fields:
    room:
      required: true
      selector:
        text:
controller_approve:
  name: Approve PodView browser request
  description: Explicitly approve one pending browser profile until it is removed.
  fields:
    room:
      required: true
      selector:
        text:
    request_id:
      required: true
      selector:
        text:
controller_revoke_identity:
  name: Revoke PodView browser profile
  description: Revoke only the selected browser profile.
  fields:
    room:
      required: true
      selector:
        text:
    identity:
      required: true
      selector:
        text:
controller_revoke:
  name: Revoke PodView controller
  description: Emergency close all browser profiles in the room.
  fields:
    room:
      required: true
      selector:
        text:
controller_receipt:
  name: Internal PodVoice controller receipt
  description: Private machine-authenticated completion from the fixed add-on.
  fields:
    nonce:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        text:
    room:
      required: true
      selector:
        text:
    outcome:
      required: true
      selector:
        text:
    payload:
      required: true
      selector:
        text:
    mac:
      required: true
      selector:
        text:

controller_recover:
  name: Gendan PodView-skærmadgang
  description: En aktuel HA-administrator fjerner alle tidligere skærme og binder frisk godkendelse til rummets aktuelle opsætning. Godkender ingen skærm automatisk.
  fields:
    room:
      required: true
      selector:
        text:

robot_snapshot:
  name: Robot snapshot
  description: Read-only projection of the admitted Roborock cache for the PodVoice Supervisor caller. No refresh or device commands.
  fields:
    entity_id:
      required: true
      selector:
        text:
    config_entry_id:
      required: true
      selector:
        text:
    device_id:
      required: true
      selector:
        text:
    unique_id:
      required: true
      selector:
        text:
    model:
      required: true
      selector:
        text:
robot_water_snapshot:
  name: Robot water snapshot
  description: Read-only water settings from the admitted Roborock cache for the PodVoice Supervisor caller. No refresh or device commands.
  fields:
    entity_id:
      required: true
      selector:
        text:
    config_entry_id:
      required: true
      selector:
        text:
    device_id:
      required: true
      selector:
        text:
    unique_id:
      required: true
      selector:
        text:
    model:
      required: true
      selector:
        text:
robot_observation_snapshot:
  name: Robot historical observation
  description: Read-only historical robot field observations for the PodVoice Supervisor caller. Never control authority.
  fields:
    binding:
      required: true
      selector:
        object:
vehicle_snapshot:
  name: Vehicle snapshot
  description: Read-only timestamped Tesla snapshot through the existing HA integration. Supervisor caller only; no wake or vehicle commands.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    device_id:
      required: true
      selector:
        text:
    entities:
      required: true
      selector:
        object:
    trunk_control:
      description: Read only the current native evidence for the configured rear trunk.
      selector:
        boolean:
    include_charge_eta:
      description: Include a current charging estimate from the configured Tesla Fleet source when available.
      required: false
      selector:
        boolean:
robot_panel_state:
  name: PodView robotstatus
  description: The household's vacuums from HA's registry with their admitted transport actions and Roborock telemetry. For any signed-in user.
robot_command:
  name: PodView robotbetjening
  description: One transport action (pause, resume, stop, return), sent once only if HA still shows the state and features the user saw.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: vacuum
    action:
      required: true
      selector:
        select:
          options: [resume, pause, stop, return]
    expected_state:
      required: true
      selector:
        select:
          options: [cleaning, paused, returning, idle, docked]
    expected_features:
      required: true
      selector:
        number:
          min: 0
          max: 2147483648
          mode: box
vehicle_panel_state:
  name: PodView bilstatus
  description: The household's Tesla Fleet cars from HA's registries, what each last reported with per-field timestamps, and its unresolved command risk. For any signed-in user.
vehicle_command:
  name: PodView bilbetjening
  description: One car action under PodVoice's risk model. Lock is sent at once; everything else returns a confirmation token that must be confirmed within 15 seconds.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: tesla_fleet
    action:
      required: true
      selector:
        select:
          options: [lock, unlock, climateOn, climateOff, temperature, defrostOn, defrostOff, driverSeatHeat, passengerSeatHeat, rearTrunkToggle]
    args:
      selector:
        object:
    confirmation:
      selector:
        text:
    acknowledge_prior_unresolved:
      selector:
        boolean:
speaker_rooms:
  name: Højttalernes rum
  description: Hvilket rum hver PodConnect-højttaler hører til efter PodConnects egne rumregler. HA's områder er kun reserve.
music_shelf:
  name: Find musik-hylde
  description: PodConnects »For dig« (top_tracks) eller »Senest« (recently_played) til Find musik.
  fields:
    shelf:
      required: true
      selector:
        select:
          options: [top_tracks, recently_played]
music_queue:
  name: Rummets kø
  description: Læs PodConnects native kø for en PodConnect-rumafspiller. Spiller intet.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: media_player
          integration: podconnect
music_queue_play:
  name: Afspil fra køen
  description: Læser køen igen og afspiller præcis den viste forekomst én gang. Et ukendt udfald gentages ikke.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: media_player
          integration: podconnect
    option_id:
      required: true
      selector:
        text:
    uri:
      required: true
      selector:
        text:
music_move:
  name: Flyt musik til et andet rum
  description: Flytter kontoens musik til rummet (PodConnect move_playback). Aldrig en anden Spotify-kontos musik.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: media_player
          integration: podconnect
    target_entity_id:
      required: true
      selector:
        entity:
          domain: media_player
          integration: podconnect
radio_state:
  name: Radioens tilstand
  description: PodConnect Speakers' radio (stationer, rum, hvad der spiller), eller hvorfor den ikke kan nås.
radio_command:
  name: Radiohandling
  description: Start, flyt, stop eller lydstyrke på PodConnect Speakers' radio, sendt én gang.
  fields:
    action:
      required: true
      selector:
        select:
          options: [start, move, stop, volume]
    station_id:
      required: false
      selector:
        select:
          options: [p3, p1, p4-ostjylland, p6-beat, p8-jazz]
    target_id:
      required: false
      selector:
        text:
    volume_percent:
      required: false
      selector:
        number:
          min: 0
          max: 100
answers_snapshot:
  name: Svar fra PodVoice
  description: Læser PodVoice-add-on'ets gemte svar til PodView-panelet. Kun for en indlogget Home Assistant-bruger.
  fields:
    room:
      required: false
      selector:
        text:
