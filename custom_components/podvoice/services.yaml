timer_status:
  name: Timerstatus
  description: PodVoice HA-owned timer contract v1. Read exact endpoint timers and pending expiry receipts.
  fields:
    endpoint:
      required: true
      selector:
        text:
timer_command:
  name: Timer
  description: PodVoice HA-owned timer contract v1. A complete request uses the current Core epoch and an immutable caller request ID.
  fields:
    endpoint:
      required: true
      selector:
        text:
    epoch:
      required: true
      selector:
        text:
    request_id:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        select:
          options:
            - start
            - cancel
            - acknowledge_finished
            - claim_alert
            - report_alert
    seconds:
      selector:
        number:
          min: 1
          max: 86400
          mode: box
    name:
      selector:
        text:
    timer_id:
      selector:
        text:
    language:
      selector:
        text:
    alert_id:
      selector:
        text:
    phase:
      selector:
        text:
    sink_id:
      selector:
        text:
controller_provision:
  name: Provision PodView controller
  description: Issue one room-bound ten-minute enrollment code to a current HA administrator.
  fields:
    room:
      required: true
      selector:
        text:
controller_revoke:
  name: Revoke PodView controller
  description: Durably revoke a room controller and its active grants.
  fields:
    room:
      required: true
      selector:
        text:
controller_receipt:
  name: Internal PodVoice controller receipt
  description: Private machine-authenticated completion from the fixed add-on.
  fields:
    nonce:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        text:
    room:
      required: true
      selector:
        text:
    outcome:
      required: true
      selector:
        text:
    mac:
      required: true
      selector:
        text:
