<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Widget</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.kw{position:relative;overflow:hidden;border-radius:24px;box-shadow:inset 0 0 0 1px rgba(23,23,26,.06);padding:24px;box-sizing:border-box;display:flex;flex-direction:column;font-family:'Schibsted Grotesk',system-ui,sans-serif;transition:transform .14s ease, background-color .6s ease}
a.kw:active{transform:scale(.985)}
.kw .head{position:relative;z-index:2;display:flex;align-items:center;gap:10px;height:26px}
.kw .head span{font-size:17px;font-weight:600}
.kw .prim{position:relative;z-index:2;line-height:1.1;font-weight:800;letter-spacing:-0.015em}
.kw .ctx{position:relative;z-index:2;font-size:15px;line-height:20px;height:20px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kw .prim{line-height:26px;height:26px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kw .btn{position:relative;z-index:3;border:0;cursor:pointer;transition:transform .12s ease, filter .12s ease}
.kw .btn:active{transform:scale(.97);filter:brightness(.92)}
.sq{position:absolute;border-radius:1px}
.dt{position:absolute;border-radius:50%}
.fade-l{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 110px);mask-image:linear-gradient(90deg,transparent 0,#000 110px)}
.fade-t{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 50px);mask-image:linear-gradient(180deg,transparent 0,#000 50px)}
.an-in{animation:inward 2.4s ease-in-out infinite}
.an-flow{animation:flow 2s linear infinite}
.an-pulse{animation:pulse 1.6s ease-in-out infinite}
.an-warm{animation:inward 2.6s ease-in-out infinite}
@keyframes inward{0%,100%{transform:scale(.3);opacity:.3}50%{transform:scale(1.1);opacity:1}}
@keyframes flow{0%{opacity:1}14%{opacity:.35}28%,100%{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){.an-in,.an-flow,.an-pulse,.an-warm{animation:none}}
</style>
</helmet>
<a href="{{v.href}}" class="kw" style="width: {{v.w}}px; height: {{v.h}}px; background: {{v.bg}}; color: {{v.fg}}" aria-label="{{v.label}}, {{v.prim}}">
  <sc-if value="{{v.cloud}}" hint-placeholder-val="{{ false }}">
    <div class="fade-l" style="position: absolute; right: 0; top: 0; width: 270px; height: 290px; opacity: {{v.matOp}}" aria-hidden="true">
      <sc-for list="{{cloud}}" as="d" hint-placeholder-count="300"><i class="sq" style="left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.w}}px; background: {{v.mat}}"></i></sc-for>
    </div>
  </sc-if>
  <sc-if value="{{v.arcs}}" hint-placeholder-val="{{ false }}">
    <div class="fade-l" style="position: absolute; right: 0; top: 0; width: 250px; height: 221px; opacity: {{v.matOp}}" aria-hidden="true">
      <sc-for list="{{arcs}}" as="d" hint-placeholder-count="200"><i class="sq {{v.anim}}" style="left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.w}}px; background: {{v.mat}}; animation-delay: {{d.dl}}ms"></i></sc-for>
    </div>
  </sc-if>
  <sc-if value="{{v.bulb}}" hint-placeholder-val="{{ false }}">
    <div class="fade-t" style="position: absolute; right: 0; top: 40px; width: 150px; height: 110px; transform: scale(.74); transform-origin: right top; opacity: {{v.matOp}}" aria-hidden="true">
      <sc-for list="{{bulb}}" as="d" hint-placeholder-count="120"><i class="sq" style="left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.w}}px; background: {{v.mat}}"></i></sc-for>
    </div>
  </sc-if>
  <sc-if value="{{v.car}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 24px; top: 70px; width: 151px; height: 52px" aria-hidden="true">
      <sc-for list="{{car}}" as="d" hint-placeholder-count="200"><i class="dt {{d.cls}}" style="left: {{d.x}}px; top: {{d.y}}px; width: 4.4px; height: 4.4px; background: {{d.c}}; animation-delay: {{d.dl}}ms"></i></sc-for>
    </div>
  </sc-if>
  <sc-if value="{{v.ring}}" hint-placeholder-val="{{ false }}">
    <svg style="position: absolute; right: 22px; top: 62px" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="26" fill="none" stroke="#2E2E33" stroke-width="7"/>
      <circle class="{{v.ringCls}}" cx="32" cy="32" r="26" fill="none" stroke="#FF7A5C" stroke-width="7" stroke-linecap="round" stroke-dasharray="{{v.dash}}" transform="rotate(-90 32 32)"/>
    </svg>
  </sc-if>
  <sc-if value="{{v.disc}}" hint-placeholder-val="{{ false }}">
    <span style="position: absolute; right: 20px; top: 60px; width: 64px; height: 64px; border-radius: 14px; background: #F6DCCB; display: flex; align-items: center; justify-content: center" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13M6.5 20.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM17.5 18.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/></svg></span>
  </sc-if>
  <sc-if value="{{v.cover}}" hint-placeholder-val="{{ false }}">
    <i style="position: absolute; right: 20px; top: 60px; width: 64px; height: 64px; border-radius: 12px; background: {{v.coverBg}}; box-shadow: 0 10px 20px -10px rgba(23,23,26,.5); display: block" aria-hidden="true"></i>
  </sc-if>
  <sc-if value="{{v.logo}}" hint-placeholder-val="{{ false }}">
    <img src="{{v.logo}}" alt="" style="position: absolute; right: 20px; top: 60px; width: 64px; height: 64px; border-radius: 14px">
  </sc-if>
  <div class="head">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{v.icon}}"/></svg>
    <span>{{v.label}}</span>
    <svg style="margin-left: auto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </div>
  <sc-if value="{{v.big}}" hint-placeholder-val="{{ false }}">
    <span style="position: relative; z-index: 2; margin-top: 22px; font-size: 120px; line-height: .85; font-weight: 500; letter-spacing: -0.06em; color: {{v.bigC}}">{{v.big}}</span>
  </sc-if>
  <div style="margin-top: {{v.primTop}}; display: flex; align-items: flex-end; gap: 16px">
    <div style="display: flex; flex-direction: column; min-width: 0; flex: 1">
      <span class="prim" style="color: {{v.primC}}; font-family: {{v.primF}}; font-size: {{v.primS}}">{{v.prim}}</span>
      <span class="ctx" style="color: {{v.ctxC}}"><sc-if value="{{v.alert}}" hint-placeholder-val="{{ false }}"><i style="display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: {{v.alert}}; vertical-align: 1px"></i></sc-if>{{v.ctx}}</span>
    </div>
    <sc-if value="{{v.action}}" hint-placeholder-val="{{ false }}">
      <span class="btn" role="button" style="height: 56px; padding: 0 24px; border-radius: 999px; background: #17171A; color: #F7F6F3; display: flex; align-items: center; font: 600 17px 'Schibsted Grotesk', sans-serif">{{v.action}}</span>
    </sc-if>
  </div>
  <sc-if value="{{v.bar}}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; z-index: 2; margin-top: 12px; display: grid; grid-template-columns: repeat({{v.barN}}, minmax(0, 1fr)); gap: {{v.barGap}}px" role="img" aria-label="{{v.barLabel}}">
      <sc-for list="{{v.bar}}" as="s" hint-placeholder-count="5"><i style="height: 6px; border-radius: 3px; background: {{s}}; display: block"></i></sc-for>
    </div>
  </sc-if>
  <sc-if value="{{v.noBar}}" hint-placeholder-val="{{ true }}"><i style="display: block; height: 18px; flex: none"></i></sc-if>
  <sc-if value="{{v.hours}}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; z-index: 2; margin-top: auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-top: 18px; border-top: 1px solid rgba(23,23,26,.08)">
      <sc-for list="{{v.hours}}" as="h" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
          <span style="font-size: 15px; color: #3E4660">{{h.t}}</span>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{h.d}}"/></svg>
          <span style="font-size: 19px; font-weight: 800; color: {{v.hourC}}">{{h.v}}</span>
        </div>
      </sc-for>
    </div>
  </sc-if>
</a>
</x-dc>

        if (d < 4) continue;
        const wd = Math.max(0, 6.4 - d * 0.045) * Math.min(1, (290 - y) / 100);
        if (wd > 0.8) out.cloud.push({ x: f(x - wd / 2), y: f(y - wd / 2), w: f(wd) });
      }
    }
    if (v.arcs) {
      for (let y = 4.5; y < 221; y += 9) for (let x = 4.5; x < 250; x += 9) {
        const rr = Math.hypot(x - 262, y - 236);
        if (rr < 26 || rr > 300) continue;
        const ph = (rr % 22) / 22;
        if (ph > 0.55) continue;
        if (st === 'fejl' && Math.sin(Math.atan2(y - 236, x - 262) * 7 + rr * 0.05) > 0.45) continue;
        const wd = (6.6 - rr * 0.015) * Math.min(1, (y + 30) / 60) * (1 - Math.abs(ph - 0.27) * 1.4);
        if (wd > 0.9) out.arcs.push({ x: f(x - wd / 2), y: f(y - wd / 2), w: f(wd), dl: Math.round(-(rr / 300) * 2400) });
      }
    }
    if (v.bulb) {
      for (let y = 4.5; y < 110; y += 9) for (let x = 4.5; x < 150; x += 9) {
        const dg = Math.hypot(x - 100, y - 50) - 26;
        if (dg < 4 || (x > 90 && x < 110 && y > 66 && y < 100)) continue;
        const wd = Math.max(0, 6 - dg * 0.045) * Math.min(1, x / 60);
        if (wd > 0.8) out.bulb.push({ x: f(x - wd / 2), y: f(y - wd / 2), w: f(wd) });
      }
    }
    if (v.car) {
      const body = [[30, 300], [44, 236], [128, 208], [300, 124], [430, 92], [612, 90], [738, 122], [878, 190], [958, 212], [988, 258], [982, 300]];
      const wheels = [[236, 300], [804, 300]];
      const k = 0.155;
      for (let y = 84; y < 362; y += 30) for (let x = 24; x < 1000; x += 30) {
        const tire = wheels.some(([a, b]) => { const rr = Math.hypot(x - a, y - b); return rr > 34 && rr < 62; });
        const near = wheels.some(([a, b]) => Math.hypot(x - a, y - b) < 70);
        const inBody = this.inPoly(x, y, body) && !near;
        let c = null, cls = '', dl = 0;
        if (tire) c = '#17171A';
        else if (inBody) { const on = (x - 30) / 958 <= v.level; c = on ? v.fill : 'rgba(23,23,26,.10)'; if (on && v.flow) { cls = 'an-flow'; dl = Math.round(x * 2); }
          // Kabinen (vinduesfeltet over bæltelinjen) gløder orange, når klimaet varmer.
          if (v.warm && y < 200 && x > 280 && x < 820) { c = '#FF7A5C'; cls = 'an-warm'; dl = Math.round(x * 3); } }
        if (c) out.car.push({ x: f((x - 24) * k - 2.2), y: f((y - 84) * k * 1.2 - 2.2), c, cls, dl });
      }
    }
    return out;
  }
}
