<!doctype html>
<html lang="da">
<head><meta charset="utf-8"><title>Afspiller · nu og kø</title><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq i{display:block;width:3px;border-radius:2px;background:#17171A;animation:eq .9s ease-in-out infinite}@keyframes eq{0%,100%{height:5px}50%{height:16px}}
.row{transition:background-color .15s ease}.row:active{background:#EFEDE8;transform:scale(.995)}
.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise .32s cubic-bezier(.2,.9,.3,1) both}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.eq i,.rise,.spin{animation:none}}</style>
</helmet>
<div style="width: 1280px; height: 800px; background: #E9E7E2; color: #17171A; font-family: 'Schibsted Grotesk', system-ui, sans-serif; position: relative; overflow: hidden">
  <dc-import name="A-Topbar" heading="Afspiller" back="{{ true }}" scenario="green" hint-size="1280px,72px"></dc-import>
  <div style="position: absolute; left: 24px; top: 88px; display: flex; gap: 16px">
    <div class="rise" style="width: 844px; height: 696px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; height: 32px"><span style="font-size: 24px; font-weight: 800">Kø</span><span style="font-size: 15px; color: #5F5E5A">20 numre · Køkkenalrum HomePod</span></div>
      <div style="flex: 1; min-height: 0; border-radius: 24px; background: #F7F6F3; padding: 8px 20px; overflow: hidden; position: relative">
        <sc-for list="{{q}}" as="r" hint-placeholder-count="6">
          <div class="row" role="button" onClick="{{r.pick}}" aria-current="{{r.cur}}" aria-label="Afspil {{r.t}}" style="height: 72px; display: grid; grid-template-columns: 32px 56px 1fr 44px; align-items: center; gap: 14px; border-top: {{r.bt}}; margin: 0 -12px; padding: 0 12px; border-radius: 14px; cursor: pointer">
            <span style="display: flex; align-items: center; justify-content: center; height: 32px">
              <sc-if value="{{r.num}}" hint-placeholder-val="{{ true }}"><span style="font: 500 15px 'IBM Plex Mono', monospace; color: #5F5E5A">{{r.i}}</span></sc-if>
              <sc-if value="{{r.playing}}" hint-placeholder-val="{{ false }}"><span class="eq" style="display: flex; gap: 3px; align-items: flex-end; height: 20px" aria-label="Spiller nu"><i style="width: 4px; background: #B4532A"></i><i style="width: 4px; background: #B4532A; animation-delay: .2s"></i><i style="width: 4px; background: #B4532A; animation-delay: .4s"></i></span></sc-if>
              <sc-if value="{{r.paused}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="#B4532A" aria-label="På pause"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></sc-if>
              <sc-if value="{{r.pending}}" hint-placeholder-val="{{ false }}"><span class="spin" style="width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid rgba(180,83,42,.25); border-top-color: #B4532A; display: block" aria-label="Starter"></span></sc-if>
            </span>
            <span style="position: relative; width: 56px; height: 56px; border-radius: 8px; overflow: hidden; background: #B98E66; box-shadow: {{r.artRing}}; transition: box-shadow .25s ease">
              <sc-if value="{{r.art}}" hint-placeholder-val="{{ true }}"><img src="{{r.art}}" alt="" style="width: 56px; height: 56px; object-fit: cover; display: block; transform: scale({{r.sc}}); transition: transform .25s ease"></sc-if>
            </span>
            <span style="display: flex; flex-direction: column; min-width: 0"><span class="one" style="font-size: 17px; font-weight: {{r.fw}}; color: {{r.tc}}; transition: color .25s ease">{{r.t}}</span><span class="one" style="font-size: 15px; color: #5F5E5A">{{r.sub}}</span></span>
            <span aria-hidden="true" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #8C8A85"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 9h14M5 15h14"/></svg></span>
          </div>
        </sc-for>
        <i style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: linear-gradient(180deg, rgba(247,246,243,0), #F7F6F3); display: block"></i>
      </div>
    </div>
    <dc-import name="A-Player" speaker="Køkkenalrum HomePod" hint-size="372px,696px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    // Tryk på omslaget eller Kø i afspilleren åbner denne side (produktets music-detail/queue). Afspilleren står fast til højre.
    // Spiller nu og køens længde (20) er fra HA Green; de næste numre er produktets fixture med ægte Spotify-omslag.
    // Ind: venstre kolonne glider 16 px op og toner ind (320 ms).
    const T = [['End of Beginning','Djo','/_blob/8a8790ee6fae7dbef7a620ae2061e220'],
      ['Cruel Summer','Taylor Swift','/_blob/593d7741d16d21440560333e0e442ad1'],
      ['Flowers','Miley Cyrus','/_blob/307bd4827a7bb0c9a91b42f220926d72'],
      ['Lost','Frank Ocean','/_blob/bf5333b381d9648daf7b38135ec1105e'],
      ['Take Five','The Dave Brubeck Quartet','/_blob/1e4b8c297f491dee57deeeace6c401c1'],
      ['Via con me','Paolo Conte','/_blob/1f75aadfd8a14f20188b4bbc205bd78f']];
    // Best practice (Spotify/Apple Music): nummeret, der spiller, markeres med titel i accentfarve og equalizer i stedet for
    // tracknummer, ingen boks. Tryk på en række afspiller den; håndtaget til højre flytter nummeret i køen.
    // Køen er én liste: det aktuelle nummer er blot række 1, markeret med equalizer og let flade, ikke et særskilt kort.
    // Tryk på en række: trykket markeres (grå flade), nummeret viser en lille spinner og "Starter…" (≈1 s), derefter
    // equalizer i accentfarve, titel i koral og en koral kant om omslaget. Pause viser et pause-symbol i stedet for equalizer.
    const rows = [{ t: 'Fast Car', a: 'Y.V.E. 48', art: '' }, ...T.map(([t, a, art]) => ({ t, a, art }))];
    // Når afspilleren bekræfter (efter "Starter…", ikke i samme splitsekund som trykket): det valgte nummer rykker op som række 1,
    // og numrene over det forlader køen (som Spotify ved spring frem). Ingen flytning under fingeren før bekræftelsen.
    const base = this.state.base || 0, cur = 0, pend = this.state.pend, playing = this.props.playing === true || this.state.playing === true;
    const q = rows.slice(base).map((r, k) => {
      const isCur = k === cur && pend == null, isPend = k === pend;
      return { ...r, i: k + 1, cur: isCur ? 'true' : 'false', num: !isCur && !isPend, playing: isCur && playing, paused: isCur && !playing, pending: isPend,
        sub: isPend ? 'Starter…' : r.a, tc: isCur || isPend ? '#B4532A' : '#17171A', fw: isCur ? 800 : 700,
        artRing: isCur ? '0 0 0 2px #F7F6F3, 0 0 0 4px #B4532A' : 'none', sc: isPend ? 0.94 : 1,
        bt: k ? '1px solid rgba(23,23,26,.07)' : 'none',
        pick: () => { if (k === cur) return; clearTimeout(this.t); this.setState({ pend: k }); this.t = setTimeout(() => this.setState({ base: base + k, pend: null, playing: true }), 1000); } };
    });
    return { q };
  }
}
</script>
</body>
</html>
