<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Find musik</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.cd{position:relative;overflow:hidden;border-radius:24px;background:#F7F6F3;box-shadow:inset 0 0 0 1px rgba(23,23,26,.06)}
.btn{border:0;cursor:pointer;transition:transform .12s ease, filter .12s ease, background-color .3s ease}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn:focus-visible{outline:2px solid #17171A;outline-offset:3px}
.btn:disabled{cursor:default;opacity:.4}
.pend{animation:pend .9s ease-in-out infinite}
@keyframes pend{0%,100%{transform:scale(.4);opacity:.4}50%{transform:scale(1);opacity:1}}
.ph{animation:ph 1.6s ease-in-out infinite}
@keyframes ph{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.pend,.ph{animation:none}}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div style="width: 1280px; height: 800px; background: #E9E7E2; color: #17171A; font-family: 'Schibsted Grotesk', system-ui, sans-serif; position: relative; overflow: hidden">
  <dc-import name="A-Topbar" heading="Find musik" back="{{ true }}" scenario="green" hint-size="1280px,72px"></dc-import>
  <div style="position: absolute; left: 24px; top: 88px; display: flex; gap: 16px">
    <div style="position: relative; width: 844px; height: 712px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">


      <div role="tablist" aria-label="Find musik" style="flex: none; display: flex; gap: 16px; align-items: center">
        <div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #DCDAD4">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
            <button class="btn" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" disabled="{{t.dis}}" style="height: 48px; border-radius: 999px; background: {{t.bg}}; color: {{t.fg}}; font: 600 17px 'Schibsted Grotesk', system-ui, sans-serif">{{t.label}}</button>
          </sc-for>
        </div>
      </div>

      <sc-if value="{{off}}" hint-placeholder-val="{{ false }}">
        <dc-import name="K-Notice" compact="true" level="info" title="Stemningsforslag er ikke tilgængelige endnu." w="844px" hint-size="844px,40px"></dc-import>
      </sc-if>
      <sc-if value="{{example}}" hint-placeholder-val="{{ true }}">
      <div style="flex: none; display: flex; justify-content: space-between; align-items: baseline; height: 32px">
        <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.015em">{{heading}}</span>
        <span style="display: flex; gap: 12px; align-items: baseline">
          <span style="font-size: 15px; color: #5F5E5A">{{count}}</span>
          
        </span>
      </div>
      </sc-if>

      <sc-if value="{{cardMode}}" hint-placeholder-val="{{ true }}"><div style="flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 16px">
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 12px; opacity: {{c.op}}">
            <div class="cd" style="height: {{artH}}px; background: {{c.ph}}">
              <sc-if value="{{c.hasArt}}" hint-placeholder-val="{{ true }}">
                <img src="{{c.art}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
              </sc-if>
              <sc-if value="{{c.isPh}}" hint-placeholder-val="{{ false }}"><i class="ph" style="position: absolute; inset: 0; background: rgba(23,23,26,.06); display: block"></i></sc-if>
              <sc-if value="{{c.hasArt}}" hint-placeholder-val="{{ true }}">
                <button class="btn" aria-label="Afspil {{c.n}}" onClick="{{c.play}}" style="position: absolute; right: 16px; bottom: 16px; width: 64px; height: 64px; border-radius: 999px; background: {{c.keyBg}}; box-shadow: 0 8px 20px -8px rgba(23,23,26,.5); display: flex; align-items: center; justify-content: center">
                  <sc-if value="{{c.idle}}" hint-placeholder-val="{{ true }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="#17171A" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg></sc-if>
                  <sc-if value="{{c.pending}}" hint-placeholder-val="{{ false }}"><span style="display: grid; grid-template-columns: repeat(3, 6px); gap: 4px"><i class="pend" style="width: 6px; height: 6px; border-radius: 50%; background: #F7F6F3"></i><i class="pend" style="width: 6px; height: 6px; border-radius: 50%; background: #F7F6F3; animation-delay: 150ms"></i><i class="pend" style="width: 6px; height: 6px; border-radius: 50%; background: #F7F6F3; animation-delay: 300ms"></i></span></sc-if>
                  <sc-if value="{{c.playing}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F7F6F3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if>
                </button>
              </sc-if>
            </div>
            <div style="display: flex; flex-direction: column; height: 46px">
              <span class="one" style="font-size: 19px; line-height: 24px; font-weight: 800">{{c.n}}</span>
              <span class="one" style="font-size: 15px; line-height: 20px; color: {{c.dc}}">{{c.d}}</span>
            </div>
          </div>
        </sc-for>
      </div></sc-if>

      <sc-if value="{{listMode}}" hint-placeholder-val="{{ false }}">
        <div class="cd" style="flex: none; padding: 8px 20px; display: flex; flex-direction: column">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
            <div style="height: 80px; display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 16px; border-top: {{r.bt}}">
              <img src="{{r.art}}" alt="" style="width: 56px; height: 56px; border-radius: 8px; object-fit: cover; box-shadow: 0 6px 14px -8px rgba(23,23,26,.5)">
              <span style="display: flex; flex-direction: column; min-width: 0"><span class="one" style="font-size: 18px; line-height: 24px; font-weight: 800">{{r.n}}</span><span class="one" style="font-size: 15px; line-height: 20px; color: #5F5E5A">{{r.d}}</span></span>
              <button class="btn" aria-label="Afspil {{r.n}}" style="width: 56px; height: 56px; border-radius: 999px; background: #EFEDE8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#17171A" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg></button>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{showMore}}" hint-placeholder-val="{{ true }}">
        <button class="btn" onClick="{{more}}" disabled="{{moreDis}}" style="flex: none; align-self: flex-start; height: 56px; padding: 0 28px; border-radius: 999px; background: #F7F6F3; color: #17171A; box-shadow: inset 0 0 0 1px rgba(23,23,26,.1); display: flex; align-items: center; gap: 10px; font: 600 17px 'Schibsted Grotesk', sans-serif">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>{{moreLabel}}
        </button>
      </sc-if>

      <i style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: linear-gradient(180deg, rgba(233,231,226,0), #E9E7E2); pointer-events: none; display: {{fadeD}}"></i>
    </div>
    <dc-import name="A-Player" mode="mine" speaker="Køkkenalrum HomePod" hint-size="372px,696px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","default":"forslag","options":["forslag","henter","ikketilg"]},"tab":{"editor":"enum","default":"mood","options":["mood","feeling","top","recent"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: null, page: 0, started: {} }; }
  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); }
  play(id) {
    this.setState({ started: { [id]: 'pending' } });
    this.timers = this.timers || [];
    this.timers.push(setTimeout(() => this.setState({ started: { [id]: 'playing' } }), 1100));
  }
  renderVals() {
    // Ingen søgefelt: Frameo har intet tastatur, og produktets søgedialog (live-music-selection-view.js openSearch)
    // har ingen kalder i dag. Søgning er en senere tilføjelse; her browses der.
    // Indhold fra produktets godkendte prototype (widget-model.js discoveryOptions, music-results.js):
    // faner Tid på dagen/Vibe/Din musik/Hør igen, periode "Til eftermiddagen" kl. 14.30, 3 forslag pr. side,
    // knapper Andre forslag/Flere vibes/Flere playlister/Se tidligere, omslag music-editorial-1..3.svg.
    const st = this.props.state || 'forslag', off = st === 'ikketilg', loading = st === 'henter';
    const tab = this.state.tab || (off && (!this.props.tab || this.props.tab === 'mood') ? 'recent' : this.props.tab || 'mood'), page = this.state.page;
    const P = [['jazz','Jazz in the Background'],['slow','Summer Slowdown, No. 16'],['lounge','LOUNGE MUSIC 2026'],['pop','Pop Remix'],
      ['house','Deep House 2026'],['hiphop','Kanye West Mix'],['techno','Techno 90s (Top 100)'],['fest','Fest'],['classic','The Jazz 100'],['kids','Bedste Børnehits']];
    const ART = ['/_blob/94d92eb49e6195e3f0c19e1412a84a7a', '/_blob/0240efba3427697e45508328ae0ccb43', '/_blob/89accc68234e0dd1eb36aca40f3bf37f'];
    const vibes = [[0,'Jazz & lounge'],[5,'Hiphop & R&B'],[3,'Pop & dance'],[1,'Afslappet pop'],[4,'Deep house'],[8,'Jazzklassikere'],[2,'Lounge'],[6,'90’er-techno'],[7,'Festmusik']];
    // Omslag: produktets ægte Spotify-omslag (music-fixture.js, Spotify oEmbed). Hver prototype-playliste peger på et nummer
    // (discoveryPlaylists[i][2]) og bruger dets omslag. Kvadratisk 1:1 som Spotify.
    const TR = [['Heartless','Kanye West','/_blob/3a77a7e93e4962cf9f954c5bcbb2d090'],
      ['End of Beginning','Djo','/_blob/8a8790ee6fae7dbef7a620ae2061e220'],
      ['Cruel Summer','Taylor Swift','/_blob/593d7741d16d21440560333e0e442ad1'],
      ['Flowers','Miley Cyrus','/_blob/307bd4827a7bb0c9a91b42f220926d72'],
      ['Without Me','Eminem','/_blob/66361fbdf18628d75aff854df85e0455'],
      ['Lost','Frank Ocean','/_blob/bf5333b381d9648daf7b38135ec1105e'],
      ['Get Lucky','Daft Punk, Pharrell Williams, Nile Rodgers','/_blob/05de09df447e4c8202de3fc8da7bd55e'],
      ['Take Five','The Dave Brubeck Quartet','/_blob/1e4b8c297f491dee57deeeace6c401c1']];
    const PT = [7, 1, 7, 2, 6, 0, 6, 3, 7, 3];
    const mk = (i, d) => ({ id: P[i][0], n: P[i][1], d, art: TR[PT[i]][2] });
    let items = [];
    if (tab === 'mood') items = [[3,4,5],[7,6,2]][page % 2].map((i) => mk(i, 'Spotify-playliste'));
    if (tab === 'feeling') { const s = ((1 + page) % 3) * 3; items = vibes.slice(s, s + 3).map(([i, d]) => mk(i, d)); }
    if (tab === 'top') items = [5,3,0,6,4,8,2,1,7,9].slice(0, (page + 1) * 5).map((i) => mk(i, 'Spotify-playliste'));
    const waiting = loading;
    const listMode = !loading && (tab === 'top' || tab === 'recent');
    const rows = (tab === 'recent' ? [1,3,5,0,2,4].map((i) => ({ n: TR[i][0], d: TR[i][1], art: TR[i][2] })) : items.map((c) => ({ n: c.n, d: 'Spotify-playliste', art: c.art }))).map((r, k) => ({ ...r, bt: k ? '1px solid rgba(23,23,26,.07)' : 'none' }));
    const cards = (off || listMode ? [] : waiting ? [0,1,2].map((i) => ({ id: 'ph' + i, n: '', d: i === 0 ? 'Afventer data' : '', isPh: true })) : items).map((c) => {
      const s = this.state.started[c.id] || 'idle';
      return { ...c, hasArt: !c.isPh, isPh: !!c.isPh, op: 1, ph: c.isPh ? '#F7F6F3' : '#F6DCCB',
        idle: s === 'idle', pending: s === 'pending', playing: s === 'playing', keyBg: s === 'idle' ? '#F7F6F3' : '#17171A',
        d: s === 'pending' ? 'Starter…' : s === 'playing' ? 'Afspiller' : c.d, dc: s === 'idle' ? '#5F5E5A' : '#17171A',
        play: () => this.play(c.id) };
    });
    const tabDefs = [['mood','Tid på dagen'],['feeling','Vibe'],['top','Din musik'],['recent','Hør igen']];
    const tabs = tabDefs.map(([id, label]) => { const on = tab === id;
      return { label, on: on ? 'true' : 'false', bg: on ? '#17171A' : 'transparent', fg: on ? '#F7F6F3' : '#17171A', dis: off && (id === 'mood' || id === 'feeling') ? 'true' : undefined,
        pick: () => this.setState({ tab: id, page: 0, started: {} }) }; });
    const action = { mood: 'Andre forslag', feeling: 'Flere vibes', top: 'Flere playlister', recent: 'Se tidligere' }[tab];
    const label = { mood: 'Til eftermiddagen', feeling: 'Vibe', top: 'Din musik', recent: 'Hør igen' }[tab];
    return {
      off, example: true, tabs, cards, heading: label,
      count: waiting ? '' : tab === 'recent' ? 'Senest afspillet' : items.length + ' forslag',
      listMode, rows, cardMode: !listMode,
      artH: 270, showMore: true, moreLabel: waiting ? 'Henter forslag' : action, moreDis: waiting ? 'true' : undefined,
      fadeD: listMode ? 'block' : 'none',
      more: () => this.setState({ page: page + 1, started: {} })
    };
  }
}
</script>
</body>
</html>
