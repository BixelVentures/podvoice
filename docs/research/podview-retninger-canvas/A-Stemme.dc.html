<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Stemmegrillen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.g{position:absolute;border-radius:50%;animation:g var(--dur,1.8s) ease-in-out infinite}
.still .g{animation:none;transform:scale(.42)}
@keyframes g{0%,100%{transform:scale(.38)}50%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.g{animation:none;transform:scale(.6)}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 44px 48px; background: #E7E5E0; color: #17171A; font-family: 'Schibsted Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; gap: 28px">
  <div style="display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font: 500 13px 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: #5F5E5A">Svar · samtalefaser</span>
      <span style="font-size: 36px; font-weight: 700; letter-spacing: -0.025em">Stemmen er en højttalergrille</span>
    </div>
    <span style="max-width: 420px; font-size: 15px; line-height: 1.45; color: #4A4945">Bevægelse kun mens fasen faktisk varer. Ingen lydstyrke, ingen equalizer, ingen procent. Hvile er helt stille.</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 32px">
    <sc-for list="{{big}}" as="b" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: baseline; gap: 12px">
          <span style="font: 500 14px 'IBM Plex Mono', ui-monospace, monospace; color: #5F5E5A">{{b.ref}}</span>
          <span style="font-size: 20px; font-weight: 700">{{b.label}}</span>
          <span style="font-size: 14px; color: #5F5E5A">{{b.note}}</span>
        </div>
        <div style="position: relative; height: 196px; border-radius: 22px; background: {{plate}}; box-shadow: inset 0 0 0 1px rgba(23,23,26,.10), 0 3px 0 rgba(23,23,26,.10); overflow: hidden" aria-hidden="true">
          <div style="position: absolute; left: 22px; top: 18px; --dur: {{b.dur}}">
            <sc-for list="{{b.dots}}" as="d" hint-placeholder-count="300">
              <i class="g" style="left: {{d.x}}px; top: {{d.y}}px; width: 10px; height: 10px; background: #1E1D1A; animation-delay: {{d.dl}}ms"></i>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 14px">
    <span style="font: 500 13px 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; color: #5F5E5A; width: 130px">I topbaren</span>
    <sc-for list="{{pills}}" as="p" hint-placeholder-count="5">
      <div class="{{p.cls}}" style="height: 48px; padding: 0 20px 0 14px; border-radius: 24px; background: #F7F6F3; box-shadow: 0 2px 0 rgba(23,23,26,.10), inset 0 0 0 1px rgba(23,23,26,.06); display: flex; align-items: center; gap: 12px">
        <span style="position: relative; width: 46px; height: 22px; display: block; --dur: {{p.dur}}" aria-hidden="true">
          <sc-for list="{{p.dots}}" as="d" hint-placeholder-count="21">
            <i class="g" style="left: {{d.x}}px; top: {{d.y}}px; width: 5px; height: 5px; background: #17171A; animation-delay: {{d.dl}}ms"></i>
          </sc-for>
        </span>
        <span style="font-size: 17px; font-weight: 600">{{p.label}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"plate":{"editor":"color","default":"#D8B25A","options":["#D8B25A","#D9D8D4","#F7F6F3"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  grid(cols, rows, step, kind) {
    const out = [];
    const cx = (cols - 1) / 2, cy = (rows - 1) / 2;
    const rmax = Math.hypot(cx, cy);
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const x = i * step + (j % 2 ? step / 2 : 0), y = j * step * 0.9;
        let dl = 0;
        const r = Math.hypot((i - cx) * 0.8, (j - cy) * 1.6);
        if (kind === 'ripple') dl = -(r / rmax) * 1800;
        if (kind === 'sweep') dl = -(i / cols) * 1600;
        if (kind === 'voice') dl = -(Math.abs(j - cy) * 260 + Math.abs(i - cx) * 40);
        if (kind === 'chat') dl = -(((i * 37 + j * 91) % 23) / 23) * 2400;
        out.push({ x: x.toFixed(1), y: y.toFixed(1), dl: Math.round(dl) });
      }
    }
    return out;
  }
  renderVals() {
    const defs = [
      { kind: 'ripple', ref: 'Ripple', label: 'Lytter…', note: 'samler sig indad', dur: '1.8s' },
      { kind: 'sweep', ref: 'Sweep', label: 'Tænker…', note: 'roligt strøg på tværs', dur: '1.6s' },
      { kind: 'voice', ref: 'Voice', label: 'Svarer…', note: 'åbner sig udad fra midten', dur: '1.3s' },
      { kind: 'chat', ref: 'Chat', label: 'Spørg videre', note: 'spredt, venter på dig', dur: '2.4s' }
    ];
    const big = defs.map((d) => ({ ...d, dots: this.grid(40, 12, 13.6, d.kind) }));
    const mini = (kind) => this.grid(7, 3, 7, kind).map((d) => ({ ...d, x: (+d.x).toFixed(1), y: (+d.y * 1.1 + 1).toFixed(1) }));
    const pills = [
      { label: 'Svar', cls: 'still', dots: mini('none'), dur: '1s' },
      ...defs.map((d) => ({ label: d.label, cls: '', dots: mini(d.kind), dur: d.dur }))
    ];
    return { big, pills, plate: this.props.plate ?? '#D8B25A' };
  }
}
</script>
</body>
</html>
