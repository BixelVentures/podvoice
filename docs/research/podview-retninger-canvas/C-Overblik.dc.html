<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Overblik · Instrument</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@500;800&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.md{position:relative;overflow:hidden;border-radius:20px;background:#18181A;box-shadow:inset 0 0 0 1px #26262A, inset 0 1px 0 #2E2E33;transition:transform .14s ease, box-shadow .14s ease}
.md:active{transform:translateY(2px);box-shadow:inset 0 0 0 1px #3A3A40}
.led{position:absolute;border-radius:50%}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.lbl{font:500 11px 'Geist Mono', ui-monospace, monospace;letter-spacing:.12em;text-transform:uppercase;color:#8B8B92}
.dig{font-family:'Doto', 'Geist Mono', monospace;font-weight:800;letter-spacing:-0.02em}
.btn{border:0;cursor:pointer;transition:transform .1s ease, box-shadow .1s ease}
.btn:active{transform:translateY(3px);box-shadow:none!important}
.btn:focus-visible,a:focus-visible{outline:2px solid #FF6A2B;outline-offset:3px}
@media (prefers-reduced-motion: reduce){.pulse{animation:none;opacity:.8}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; background: #0E0E0F; color: #EDEDEF; font-family: 'Geist', system-ui, sans-serif; position: relative">
  <div style="height: 72px; padding: 0 28px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
    <span style="display: flex; align-items: center; gap: 10px"><i style="width: 8px; height: 8px; border-radius: 4px; background: #FF6A2B; display: block" aria-hidden="true"></i><span style="font-size: 20px; font-weight: 600">Hjem</span></span>
    <button class="btn" aria-label="Svar og historik" style="height: 48px; padding: 0 22px 0 14px; border-radius: 14px; background: #1E1E21; color: #EDEDEF; box-shadow: 0 3px 0 #000, inset 0 0 0 1px #2E2E33; display: flex; align-items: center; gap: 12px; font: 600 17px 'Geist', sans-serif">
      <span style="display: grid; grid-template-columns: repeat(5, 4px); gap: 3px" aria-hidden="true">
        <sc-for list="{{mark}}" as="m" hint-placeholder-count="15"><i style="width: 4px; height: 4px; border-radius: 2px; background: {{m}}; display: block"></i></sc-for>
      </span>
      Svar
    </button>
    <div style="display: flex; justify-content: flex-end; align-items: baseline; gap: 24px">
      <span class="lbl">Let skyet</span>
      <span class="dig" style="font-size: 28px">08.44</span>
    </div>
  </div>

  <div style="position: absolute; left: 24px; top: 88px; display: flex; gap: 16px">
    <div style="width: 844px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; height: 316px">
        <a href="C-Overblik.dc.html" class="md" style="padding: 20px 22px; box-sizing: border-box; display: flex; flex-direction: column" aria-label="Vejr, 15 grader, let skyet">
          <div style="display: flex; justify-content: space-between"><span class="lbl">Vejr · nu</span><span class="lbl">H 17 / L 9</span></div>
          <span class="dig" style="margin-top: 6px; font-size: 150px; line-height: .95; color: #EDEDEF">15°</span>
          <div style="margin-top: auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{hours}}" as="h" hint-placeholder-count="5">
              <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; border-radius: 10px; background: #111113">
                <span class="lbl" style="letter-spacing: .04em">{{h.t}}</span>
                <span style="display: grid; grid-template-columns: repeat(5, 3px); gap: 2px" aria-hidden="true">
                  <sc-for list="{{h.px}}" as="p" hint-placeholder-count="15"><i style="width: 3px; height: 3px; border-radius: 2px; background: {{p}}; display: block"></i></sc-for>
                </span>
                <span class="dig" style="font-size: 20px">{{h.v}}</span>
              </div>
            </sc-for>
          </div>
        </a>
        <a href="C-Robot.dc.html" class="md" style="padding: 20px 22px; box-sizing: border-box; display: flex; flex-direction: column" aria-label="Robotstøvsuger, rengør køkkenet">
          <div style="position: absolute; right: 18px; top: 18px; width: 200px; height: 200px" aria-hidden="true">
            <sc-for list="{{radar}}" as="d" hint-placeholder-count="120">
              <i class="led pulse" style="left: {{d.x}}px; top: {{d.y}}px; width: 5px; height: 5px; background: #F0457A; animation-delay: {{d.dl}}ms"></i>
            </sc-for>
            <i style="position: absolute; left: 86px; top: 86px; width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 2px #EDEDEF"></i>
          </div>
          <span class="lbl">Robot</span>
          <span style="margin-top: 8px; font-size: 26px; font-weight: 700; color: #F0457A">Rengør</span>
          <span style="font-size: 14px; color: #A3A3AA">Køkkenet</span>
          <div style="margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between">
            <div style="display: flex; flex-direction: column"><span class="lbl">Færdig</span><span class="dig" style="font-size: 52px; line-height: 1">38%</span></div>
            <div style="display: flex; flex-direction: column; align-items: flex-end"><span class="lbl">Batteri</span><span class="dig" style="font-size: 28px">76%</span></div>
          </div>
        </a>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; height: 190px">
        <a href="C-Overblik.dc.html" class="md" style="padding: 18px 20px; box-sizing: border-box; display: flex; flex-direction: column" aria-label="Lys, tændt">
          <div style="position: absolute; right: 16px; top: 16px; display: grid; grid-template-columns: repeat(9, 7px); gap: 4px" aria-hidden="true">
            <sc-for list="{{bulb}}" as="b" hint-placeholder-count="99"><i style="width: 7px; height: 7px; border-radius: 4px; background: {{b}}; display: block"></i></sc-for>
          </div>
          <span class="lbl">Lys</span>
          <span style="margin-top: auto; font-size: 26px; font-weight: 700; color: #F2B23A">Tændt</span>
        </a>
        <a href="C-Overblik.dc.html" class="md" style="padding: 18px 20px; box-sizing: border-box; display: flex; flex-direction: column" aria-label="Tesla, 72 procent, lader">
          <span class="lbl">Tesla · lader</span>
          <span class="dig" style="margin-top: 4px; font-size: 64px; line-height: 1; color: #43C08A">72%</span>
          <div style="margin-top: auto; display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px" role="img" aria-label="Batteri 72 procent">
            <sc-for list="{{bat}}" as="b" hint-placeholder-count="20"><i class="{{b.cls}}" style="height: 14px; border-radius: 3px; background: {{b.c}}; display: block; animation-delay: {{b.dl}}ms"></i></sc-for>
          </div>
        </a>
        <a href="C-Overblik.dc.html" class="md" style="padding: 18px 20px; box-sizing: border-box; display: flex; flex-direction: column; background: #FF6A2B; color: #120804; box-shadow: inset 0 0 0 1px #FF8B57" aria-label="Timer, 8 minutter 42 sekunder tilbage">
          <span class="lbl" style="color: #3B1607">Timer</span>
          <span class="dig" style="margin-top: auto; font-size: 76px; line-height: .9">8:42</span>
        </a>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; height: 158px">
        <a href="C-Overblik.dc.html" class="md" style="padding: 18px 20px; box-sizing: border-box; display: flex; flex-direction: column; box-shadow: inset 0 0 0 1px #26262A, 0 4px 0 #000">
          <span class="lbl">01</span>
          <span style="margin-top: auto; font-size: 22px; font-weight: 700">Find musik</span>
          <span style="font-size: 14px; color: #A3A3AA">Vælg musik</span>
        </a>
        <a href="C-Overblik.dc.html" class="md" style="padding: 18px 20px; box-sizing: border-box; display: flex; flex-direction: column; box-shadow: inset 0 0 0 1px #26262A, 0 4px 0 #000">
          <span class="lbl">02</span>
          <span style="margin-top: auto; font-size: 22px; font-weight: 700">Radio</span>
          <span style="font-size: 14px; color: #A3A3AA">Vælg station</span>
        </a>
        <a href="C-Overblik.dc.html" class="md" style="padding: 18px 20px; box-sizing: border-box; display: flex; flex-direction: column; box-shadow: inset 0 0 0 1px #26262A, 0 4px 0 #000">
          <span class="lbl">03</span>
          <span style="margin-top: auto; font-size: 22px; font-weight: 700">Opskrifter</span>
          <span style="font-size: 14px; color: #A3A3AA">Se katalog</span>
        </a>
      </div>
    </div>

    <div class="md" style="width: 372px; height: 696px; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; justify-content: space-between"><span class="lbl">Afspiller</span><span class="lbl" style="color: #EDEDEF">Stuen ▾</span></div>
      <div style="height: 300px; border-radius: 14px; background: #232326; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box"><span class="lbl">Cover fra kilden</span></div>
      <div style="display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 700">Heartless</span><span style="font-size: 15px; color: #A3A3AA">Kanye West</span></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span class="dig" style="font-size: 34px">1:24</span><span class="dig" style="font-size: 20px; color: #8B8B92">3:00</span></div>
      <div style="display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); gap: 2px" aria-hidden="true">
        <sc-for list="{{prog}}" as="p" hint-placeholder-count="30"><i style="height: 6px; border-radius: 2px; background: {{p}}; display: block"></i></sc-for>
      </div>
      <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button class="btn" aria-label="Forrige" style="height: 72px; border-radius: 14px; background: #232326; box-shadow: 0 4px 0 #000; color: #EDEDEF; font: 500 18px 'Geist Mono', monospace">|◀</button>
        <button class="btn" aria-label="Pause" style="height: 72px; border-radius: 14px; background: #EDEDEF; box-shadow: 0 4px 0 #6A6A70; color: #0E0E0F; font: 600 18px 'Geist Mono', monospace">▮▮</button>
        <button class="btn" aria-label="Næste" style="height: 72px; border-radius: 14px; background: #232326; box-shadow: 0 4px 0 #000; color: #EDEDEF; font: 500 18px 'Geist Mono', monospace">▶|</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const radar = [];
    for (let ring = 1; ring <= 6; ring++) {
      const r = ring * 15;
      const n = ring * 8;
      for (let k = 0; k < n; k++) {
        const a = (k / n) * Math.PI * 2;
        if (Math.sin(a * 3 + ring) < -0.2) continue;
        radar.push({ x: (100 + Math.cos(a) * r - 2.5).toFixed(1), y: (100 + Math.sin(a) * r - 2.5).toFixed(1), dl: Math.round(-(ring / 6) * 2400) });
      }
    }
    const on = '#EDEDEF', off = '#2A2A2E', amb = '#F2B23A';
    const icons = {
      sun: [off, amb, off, off, off, amb, amb, amb, on, on, off, on, on, on, on],
      rain: [off, on, on, on, off, on, on, on, on, on, '#5B8CFF', off, '#5B8CFF', off, '#5B8CFF'],
      cloud: [off, off, on, on, off, off, on, on, on, off, on, on, on, on, on]
    };
    const hours = [
      { t: '14', v: '16°', px: icons.sun }, { t: '15', v: '17°', px: icons.sun }, { t: '16', v: '15°', px: icons.rain },
      { t: '17', v: '14°', px: icons.rain }, { t: '18', v: '14°', px: icons.cloud }
    ];
    // Lys: pæresilhuet i et 9×11 LED-felt, tændt i okker.
    const shape = [
      '..XXXXX..', '.XXXXXXX.', 'XXXXXXXXX', 'XXXXXXXXX', 'XXXXXXXXX', '.XXXXXXX.',
      '..XXXXX..', '...XXX...', '...---...', '...---...', '....-....'
    ];
    const bulb = [];
    shape.forEach((row) => row.split('').forEach((c) => bulb.push(c === 'X' ? '#F2B23A' : c === '-' ? '#6A6A70' : '#212124')));
    const bat = [];
    for (let i = 0; i < 20; i++) {
      const lit = (i + 1) / 20 <= 0.72 + 0.01;
      bat.push({ c: lit ? '#43C08A' : '#2A2A2E', cls: lit ? 'pulse' : '', dl: i * 90 });
    }
    const prog = [];
    for (let i = 0; i < 30; i++) prog.push(i < 14 ? '#EDEDEF' : '#2A2A2E');
    const mark = [];
    for (let i = 0; i < 15; i++) mark.push(i % 2 ? '#5A5A60' : '#EDEDEF');
    return { radar, hours, bulb, bat, prog, mark };
  }
}
</script>
</body>
</html>
