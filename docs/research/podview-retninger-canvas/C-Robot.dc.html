<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Robot · Instrument</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@500;800&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.md{position:relative;overflow:hidden;border-radius:20px;background:#18181A;box-shadow:inset 0 0 0 1px #26262A, inset 0 1px 0 #2E2E33}
.led{position:absolute;border-radius:50%}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.halt .pulse{animation-play-state:paused}
@keyframes pulse{0%,100%{opacity:.18}50%{opacity:1}}
.lbl{font:500 11px 'Geist Mono', ui-monospace, monospace;letter-spacing:.12em;text-transform:uppercase;color:#8B8B92}
.dig{font-family:'Doto', 'Geist Mono', monospace;font-weight:800;letter-spacing:-0.02em}
.btn{border:0;cursor:pointer;transition:transform .1s ease, box-shadow .1s ease}
.btn:active{transform:translateY(3px);box-shadow:none!important}
.btn:focus-visible,a:focus-visible{outline:2px solid #FF6A2B;outline-offset:3px}
@media (prefers-reduced-motion: reduce){.pulse{animation:none;opacity:.8}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; background: #0E0E0F; color: #EDEDEF; font-family: 'Geist', system-ui, sans-serif; position: relative">
  <div style="height: 72px; padding: 0 28px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
    <a href="C-Overblik.dc.html" style="display: flex; align-items: center; gap: 12px" aria-label="Tilbage til overblik">
      <span style="width: 44px; height: 44px; border-radius: 12px; background: #1E1E21; box-shadow: 0 3px 0 #000; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EDEDEF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></span>
      <span style="font-size: 20px; font-weight: 600">Robotstøvsuger</span>
    </a>
    <span style="height: 48px; padding: 0 22px; border-radius: 14px; background: #1E1E21; box-shadow: 0 3px 0 #000, inset 0 0 0 1px #2E2E33; display: flex; align-items: center; font-weight: 600; font-size: 17px">Svar</span>
    <div style="display: flex; justify-content: flex-end; align-items: baseline; gap: 24px"><span class="lbl">Let skyet</span><span class="dig" style="font-size: 28px">08.44</span></div>
  </div>

  <div style="position: absolute; left: 24px; top: 88px; display: flex; gap: 16px">
    <div style="width: 844px; display: flex; flex-direction: column; gap: 16px">
      <div class="md {{haltCls}}" style="height: 440px; padding: 24px 26px; box-sizing: border-box; display: flex; flex-direction: column">
        <div style="position: absolute; right: 26px; top: 24px; width: 300px; height: 300px" aria-hidden="true">
          <sc-for list="{{radar}}" as="d" hint-placeholder-count="200">
            <i class="led pulse" style="left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.w}}px; background: {{d.c}}; animation-delay: {{d.dl}}ms"></i>
          </sc-for>
          <i style="position: absolute; left: 124px; top: 124px; width: 52px; height: 52px; border-radius: 50%; box-shadow: inset 0 0 0 3px #EDEDEF"></i>
          <i style="position: absolute; left: 143px; top: 131px; width: 14px; height: 6px; border-radius: 3px; background: #EDEDEF"></i>
        </div>
        <span class="lbl">Støvsug og vask · Køkkenet</span>
        <span style="margin-top: 6px; font-size: 34px; font-weight: 700; color: #F0457A">{{status}}</span>
        <span class="dig" style="margin-top: 8px; font-size: 132px; line-height: .9">38%</span>
        <span class="lbl" style="margin-top: 4px">færdig</span>
        <div style="margin-top: 18px; display: flex; gap: 28px">
          <div style="display: flex; flex-direction: column"><span class="dig" style="font-size: 28px">76%</span><span class="lbl">Batteri</span></div>
          <div style="display: flex; flex-direction: column"><span class="dig" style="font-size: 28px">12,5m²</span><span class="lbl">Areal</span></div>
          <div style="display: flex; flex-direction: column"><span class="dig" style="font-size: 28px">10min</span><span class="lbl">Tid</span></div>
        </div>
        <div style="margin-top: auto; display: flex; gap: 10px">
          <button class="btn" onClick="{{toggle}}" style="height: 64px; padding: 0 30px; border-radius: 14px; background: #EDEDEF; color: #0E0E0F; box-shadow: 0 4px 0 #6A6A70; font: 700 17px 'Geist', sans-serif">{{toggleLabel}}</button>
          <button class="btn" style="height: 64px; padding: 0 24px; border-radius: 14px; background: #1E1E21; color: #FF5A5F; box-shadow: 0 4px 0 #000, inset 0 0 0 1px #4A2326; font: 600 17px 'Geist', sans-serif">Afslut rengøring</button>
          <button class="btn" style="margin-left: auto; height: 64px; padding: 0 24px; border-radius: 14px; background: #1E1E21; color: #EDEDEF; box-shadow: 0 4px 0 #000, inset 0 0 0 1px #2E2E33; font: 600 17px 'Geist', sans-serif">Base ▾</button>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; height: 240px">
        <div class="md" style="padding: 22px; box-sizing: border-box; display: flex; flex-direction: column">
          <span class="lbl">Denne tur · Stueplan</span>
          <button class="btn" aria-pressed="true" style="margin-top: auto; align-self: flex-start; height: 60px; padding: 0 22px; border-radius: 14px; background: #F0457A; color: #1A0710; box-shadow: 0 4px 0 #7A1C3B; font: 700 17px 'Geist', sans-serif">Køkkenet</button>
        </div>
        <div class="md" style="padding: 22px; box-sizing: border-box; display: flex; flex-direction: column">
          <span class="lbl">Type · næste tur</span>
          <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
            <button class="btn" style="height: 76px; border-radius: 14px; background: #1E1E21; color: #EDEDEF; box-shadow: 0 4px 0 #000; font: 600 15px 'Geist', sans-serif">Støvsug</button>
            <button class="btn" style="height: 76px; border-radius: 14px; background: #1E1E21; color: #EDEDEF; box-shadow: 0 4px 0 #000; font: 600 15px 'Geist', sans-serif">Vask</button>
            <button class="btn" aria-pressed="true" style="height: 76px; border-radius: 14px; background: #EDEDEF; color: #0E0E0F; box-shadow: 0 4px 0 #6A6A70; font: 700 15px 'Geist', sans-serif">Begge</button>
          </div>
        </div>
      </div>
    </div>
    <div class="md" style="width: 372px; height: 696px; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; justify-content: space-between"><span class="lbl">Afspiller</span><span class="lbl" style="color: #EDEDEF">Stuen ▾</span></div>
      <div style="height: 300px; border-radius: 14px; background: #232326; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box"><span class="lbl">Cover fra kilden</span></div>
      <div style="display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 700">Heartless</span><span style="font-size: 15px; color: #A3A3AA">Kanye West</span></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span class="dig" style="font-size: 34px">1:24</span><span class="dig" style="font-size: 20px; color: #8B8B92">3:00</span></div>
      <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button class="btn" aria-label="Forrige" style="height: 72px; border-radius: 14px; background: #232326; box-shadow: 0 4px 0 #000; color: #EDEDEF; font: 500 18px 'Geist Mono', monospace">|◀</button>
        <button class="btn" aria-label="Pause" style="height: 72px; border-radius: 14px; background: #EDEDEF; box-shadow: 0 4px 0 #6A6A70; color: #0E0E0F; font: 600 18px 'Geist Mono', monospace">▮▮</button>
        <button class="btn" aria-label="Næste" style="height: 72px; border-radius: 14px; background: #232326; box-shadow: 0 4px 0 #000; color: #EDEDEF; font: 500 18px 'Geist Mono', monospace">▶|</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { running: true }; }
  renderVals() {
    const radar = [];
    // Luft (rosa ringe, indad) og vand (lyse vandrette celler) som to stabile LED-lag om robotkernen.
    for (let ring = 2; ring <= 9; ring++) {
      const r = ring * 15;
      const n = ring * 9;
      for (let k = 0; k < n; k++) {
        const a = (k / n) * Math.PI * 2;
        const wet = Math.abs(Math.sin(a)) < 0.16 && ring > 3;
        if (!wet && Math.sin(a * 3 + ring * 0.7) < -0.1) continue;
        radar.push({
          x: (150 + Math.cos(a) * r - 3).toFixed(1), y: (150 + Math.sin(a) * r - 3).toFixed(1),
          w: wet ? 6 : 5, c: wet ? '#9CC4FF' : '#F0457A',
          dl: Math.round(-(ring / 9) * 2400)
        });
      }
    }
    const running = this.state.running;
    return {
      radar,
      haltCls: running ? '' : 'halt',
      status: running ? 'Rengør' : 'På pause',
      toggleLabel: running ? 'Pause' : 'Fortsæt',
      toggle: () => this.setState({ running: !this.state.running })
    };
  }
}
</script>
</body>
</html>
