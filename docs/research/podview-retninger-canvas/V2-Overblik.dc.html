<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Overblik v2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#17171A;text-decoration:none}
.cd{position:relative;overflow:hidden;border-radius:26px;background:#F7F6F3;box-shadow:inset 0 0 0 1px rgba(23,23,26,.06), 0 2px 0 rgba(23,23,26,.05);transition:transform .14s ease, box-shadow .14s ease, background-color .6s ease}
a.cd:active,.cd:has(> a.hit:active){transform:scale(.985);box-shadow:inset 0 0 0 1px rgba(23,23,26,.10)}
.hit{position:absolute;inset:0;border-radius:inherit;z-index:1}
.btn{position:relative;z-index:2;border:0;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease}
.btn:active{transform:translateY(2px);box-shadow:none!important}
.btn:focus-visible,a:focus-visible{outline:2px solid #17171A;outline-offset:3px}
.sq{position:absolute;border-radius:1px}
.dt{position:absolute;border-radius:50%}
.an-in{animation:inward 2.6s ease-in-out infinite}
.an-flow{animation:flow 1.8s ease-in-out infinite}
@keyframes inward{0%,100%{transform:scale(.5);opacity:.5}50%{transform:scale(1);opacity:1}}
@keyframes flow{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.an-in,.an-flow{animation:none}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; background: #E7E5E0; color: #17171A; font-family: 'Schibsted Grotesk', system-ui, sans-serif; position: relative">
  <dc-import name="A-Topbar" heading="Hjem" hint-size="1280px,72px"></dc-import>
  <div style="position: absolute; left: 24px; top: 88px; display: flex; gap: 16px">
    <div style="display: grid; grid-template-columns: repeat(4, 199px); grid-template-rows: 244px 244px 176px; gap: 16px">

      <a href="Main.dc.html" class="cd" style="grid-column: 1 / span 2; grid-row: 1 / span 2; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; background: #D6E1FC" aria-label="Vejr, 15 grader, let skyet">
        <div style="position: absolute; left: 154px; top: 0; width: 260px; height: 250px" aria-hidden="true">
          <sc-for list="{{wx}}" as="d" hint-placeholder-count="200">
            <i class="sq" style="left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.w}}px; background: #1F55F0"></i>
          </sc-for>
        </div>
        <div style="position: relative; display: flex; align-items: center; gap: 10px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M7 19h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.5A3.3 3.3 0 0 0 7 19z" fill="#D6E1FC"/></svg>
          <span style="font-size: 18px; font-weight: 600">Vejr</span>
        </div>
        <span style="position: relative; margin-top: 18px; font-size: 112px; line-height: .9; font-weight: 500; letter-spacing: -0.055em; font-variant-numeric: tabular-nums">15°</span>
        <span style="position: relative; margin-top: 14px; font-size: 20px; font-weight: 600">Let skyet</span>
        <span style="position: relative; font-size: 15px; color: #3E4660">Højst 17° · Lavest 9°</span>
        <div style="margin-top: auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-top: 16px; border-top: 1px solid rgba(31,85,240,.18)">
          <sc-for list="{{hours}}" as="h" hint-placeholder-count="5">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
              <span style="font: 500 13px 'IBM Plex Mono', ui-monospace, monospace; color: #3E4660">{{h.t}}</span>
              <sc-if value="{{h.rain}}" hint-placeholder-val="{{ false }}">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M7 15h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.5A3.3 3.3 0 0 0 7 15z"/><path d="M9 18l-1 2.5M13 18l-1 2.5M17 18l-1 2.5"/></svg>
              </sc-if>
              <sc-if value="{{h.sun}}" hint-placeholder-val="{{ true }}">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M7 19h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.5A3.3 3.3 0 0 0 7 19z" fill="#D6E1FC"/></svg>
              </sc-if>
              <sc-if value="{{h.cloud}}" hint-placeholder-val="{{ false }}">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 18h11a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.5A3.3 3.3 0 0 0 6 18z"/></svg>
              </sc-if>
              <span style="font-size: 19px; font-weight: 600; color: #1A3FB8; font-variant-numeric: tabular-nums">{{h.v}}</span>
            </div>
          </sc-for>
        </div>
      </a>

      <div class="cd" style="grid-column: 3 / span 2; grid-row: 1; padding: 22px 24px; box-sizing: border-box; display: flex; flex-direction: column; background: {{robot.bg}}">
        <a href="A-Robot.dc.html" class="hit" aria-label="Robotstøvsuger, {{robot.status}}, åbn detalje"></a>
        <div style="position: absolute; right: 0; top: 0; width: 214px; height: 244px; opacity: {{robot.fieldOp}}" aria-hidden="true">
          <sc-for list="{{rb}}" as="d" hint-placeholder-count="200">
            <i class="dt {{robot.anim}}" style="left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.w}}px; background: #B23A62; animation-delay: {{d.dl}}ms"></i>
          </sc-for>
          <svg style="position: absolute; left: 75px; top: 80px" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#F7F6F3" stroke="#17171A" stroke-width="2"/><circle cx="32" cy="32" r="18" fill="none" stroke="#17171A" stroke-width="1.5"/><rect x="26" y="8" width="12" height="6" rx="3" fill="#17171A"/><circle cx="32" cy="32" r="4" fill="#B23A62"/></svg>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M10 4.5h4"/></svg>
          <span style="font-size: 18px; font-weight: 600">Robotstøvsuger</span>
        </div>
        <span style="margin-top: 14px; font-size: 24px; font-weight: 700; color: #9C2F53; letter-spacing: -0.01em">{{robot.status}}</span>
        <sc-if value="{{robot.active}}" hint-placeholder-val="{{ true }}">
          <span style="font-size: 15px; color: #5E4049">Batteri 76 % · Køkkenet</span>
        </sc-if>
        <sc-if value="{{robot.active}}" hint-placeholder-val="{{ true }}">
          <div style="margin-top: auto; display: flex; align-items: center; gap: 12px">
            <button class="btn" aria-label="Sæt rengøring på pause" style="height: 48px; padding: 0 20px; border-radius: 16px; background: #17171A; color: #F7F6F3; box-shadow: 0 3px 0 #000; display: flex; align-items: center; gap: 8px; font: 600 16px 'Schibsted Grotesk', system-ui, sans-serif">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="#F7F6F3" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
              Pause
            </button>
            <span style="font: 500 13px 'IBM Plex Mono', ui-monospace, monospace; color: #5E4049">38 % færdig</span>
          </div>
        </sc-if>
      </div>

      <a href="Main.dc.html" class="cd" style="grid-column: 3; grid-row: 2; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; background: {{lys.bg}}" aria-label="Lys, {{lys.status}}">
        <div style="position: absolute; right: 0; bottom: 0; width: 140px; height: 150px" aria-hidden="true">
          <sc-for list="{{lt}}" as="d" hint-placeholder-count="120">
            <i class="dt" style="left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.w}}px; background: {{lys.dot}}"></i>
          </sc-for>
        </div>
        <div style="position: relative; display: flex; align-items: center; justify-content: space-between">
          <span style="display: flex; align-items: center; gap: 10px">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/></svg>
            <span style="font-size: 18px; font-weight: 600">Lys</span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <span style="position: relative; margin-top: 14px; font-size: 24px; font-weight: 700; color: {{lys.fg}}">{{lys.status}}</span>
      </a>

      <a href="A-Tesla.dc.html" class="cd" style="grid-column: 4; grid-row: 2; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; background: {{tesla.bg}}" aria-label="Tesla, {{tesla.aria}}">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="display: flex; align-items: center; gap: 10px">
            <svg width="26" height="24" viewBox="0 0 26 24" fill="none" stroke="#17171A" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 15v-3l3-4h12l4 4h1v3H3z"/><circle cx="8" cy="16" r="2"/><circle cx="18" cy="16" r="2"/></svg>
            <span style="font-size: 18px; font-weight: 600">Tesla</span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <sc-if value="{{tesla.active}}" hint-placeholder-val="{{ true }}">
          <span style="margin-top: 12px; font: 500 40px/1 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: -0.04em; color: #1F5E40">72<span style="font-size: 22px"> %</span></span>
        </sc-if>
        <sc-if value="{{tesla.active}}" hint-placeholder-val="{{ true }}">
          <span style="font-size: 15px; color: #3C5A4A; margin-top: 4px">Lader · 312 km</span>
        </sc-if>
        <sc-if value="{{tesla.active}}" hint-placeholder-val="{{ true }}">
          <div style="margin-top: auto; position: relative; height: 34px" role="img" aria-label="Batteri 72 procent">
            <sc-for list="{{bat}}" as="d" hint-placeholder-count="36">
              <i class="sq {{d.cls}}" style="left: {{d.x}}px; top: {{d.y}}px; width: 9px; height: 9px; background: {{d.c}}; animation-delay: {{d.dl}}ms"></i>
            </sc-for>
            <i style="position: absolute; left: 156px; top: 9px; width: 3px; height: 15px; border-radius: 1px; background: rgba(23,23,26,.2)"></i>
          </div>
        </sc-if>
        <sc-if value="{{tesla.idle}}" hint-placeholder-val="{{ false }}">
          <span style="margin-top: 14px; font-size: 19px; font-weight: 600; color: #5F5E5A">Ikke forbundet</span>
        </sc-if>
      </a>

      <a href="A-Musik.dc.html" class="cd" style="grid-column: 1; grid-row: 3; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column" aria-label="Find musik">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.7" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <span style="margin-top: auto; font-size: 21px; font-weight: 700">Find musik</span>
        <span style="font-size: 15px; color: #5F5E5A">Vælg musik</span>
      </a>

      <a href="Main.dc.html" class="cd" style="grid-column: 2; grid-row: 3; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column" aria-label="Radio">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8l10-4"/><circle cx="15" cy="14" r="2.5"/><path d="M6 12h4M6 15h4"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <span style="margin-top: auto; font-size: 21px; font-weight: 700">Radio</span>
        <span style="font-size: 15px; color: #5F5E5A">Vælg station</span>
      </a>

      <a href="Main.dc.html" class="cd" style="grid-column: 3; grid-row: 3; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column" aria-label="Opskrifter">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v18M12 8h5M12 12h5"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <span style="margin-top: auto; font-size: 21px; font-weight: 700">Opskrifter</span>
        <span style="font-size: 15px; color: #5F5E5A">Se katalog</span>
      </a>

      <div class="cd" style="grid-column: 4; grid-row: 3; padding: 20px 22px; box-sizing: border-box; display: flex; flex-direction: column; background: #17171A; color: #F7F6F3; box-shadow: 0 3px 0 #000">
        <a href="Main.dc.html" class="hit" aria-label="Timer, {{timer.aria}}"></a>
        <sc-if value="{{timer.active}}" hint-placeholder-val="{{ true }}">
          <svg style="position: absolute; right: 18px; top: 18px" width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
            <circle cx="28" cy="28" r="23" fill="none" stroke="#2E2E33" stroke-width="5"/>
            <circle cx="28" cy="28" r="23" fill="none" stroke="#FF7A5C" stroke-width="5" stroke-linecap="round" stroke-dasharray="125.7 144.5" transform="rotate(-90 28 28)"/>
          </svg>
        </sc-if>
        <span style="font-size: 16px; font-weight: 600; color: #BDBBB5">Timer</span>
        <sc-if value="{{timer.active}}" hint-placeholder-val="{{ true }}">
          <span style="margin-top: 6px; font: 500 46px/1 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: -0.05em; font-variant-numeric: tabular-nums">8:42</span>
        </sc-if>
        <sc-if value="{{timer.active}}" hint-placeholder-val="{{ true }}">
          <button class="btn" style="margin-top: auto; height: 44px; border-radius: 14px; background: #2B2B30; color: #F7F6F3; box-shadow: 0 3px 0 #000; font: 600 15px 'Schibsted Grotesk', system-ui, sans-serif">Annuller</button>
        </sc-if>
        <sc-if value="{{timer.idle}}" hint-placeholder-val="{{ false }}">
          <span style="margin-top: auto; font-size: 19px; font-weight: 600">Start en timer</span>
        </sc-if>
      </div>
    </div>
    <dc-import name="A-Player" hint-size="372px,696px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"calm":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const calm = !!this.props.calm;
    const f = (n) => n.toFixed(1);
    // Farveregel: et domæne får sin flade, når det har en levende tilstand at vise. Genveje er neutrale.
    const neutral = '#F7F6F3';
    const robot = calm
      ? { bg: neutral, status: 'Ved basen', active: false, anim: '', fieldOp: 0.55 }
      : { bg: '#F6D3DE', status: 'Rengør', active: true, anim: 'an-in', fieldOp: 1 };
    const lys = calm
      ? { bg: neutral, status: 'Slukket', fg: '#5F5E5A', dot: 'rgba(23,23,26,.16)' }
      : { bg: '#FBE3A8', status: 'Tændt', fg: '#7A5205', dot: '#C08410' };
    const tesla = calm
      ? { bg: neutral, active: false, idle: true, aria: 'ikke forbundet' }
      : { bg: '#CDE8D8', active: true, idle: false, aria: '72 procent, lader' };
    const timer = calm
      ? { active: false, idle: true, aria: 'start en timer' }
      : { active: true, idle: false, aria: '8 minutter og 42 sekunder tilbage' };

    const wx = [];
    const blobs = [[110, 132, 40], [160, 104, 54], [208, 136, 36]];
    for (let j = 0; j < 25; j++) {
      for (let i = 0; i < 26; i++) {
        const x = i * 10 + 5, y = j * 10 + 5;
        let d = 999;
        for (const b of blobs) d = Math.min(d, Math.hypot(x - b[0], y - b[1]) - b[2]);
        if (x > 70 && x < 244 && y > 128 && y < 172) d = Math.min(d, -1);
        if (d < 5) continue;
        const fade = Math.min(1, x / 90) * Math.min(1, (250 - y) / 90);
        const w = Math.max(0, 5.4 - d * 0.05) * fade;
        if (w > 0.7) wx.push({ x: f(x - w / 2), y: f(y - w / 2), w: f(w) });
      }
    }
    const rb = [];
    const cx = 107, cy = 112;
    for (let j = 0; j < 25; j++) {
      for (let i = 0; i < 24; i++) {
        const x = i * 9 + 4.5, y = j * 9 + 4.5;
        const r = Math.hypot(x - cx, y - cy);
        if (r < 42 || r > 150) continue;
        const a = Math.atan2(y - cy, x - cx);
        const arc = Math.sin(a * 4 + r * 0.06);
        if (arc < 0.05) continue;
        const w = (1.5 + arc * 3.4) * Math.min(1, (150 - r) / 50) * Math.min(1, x / 40);
        if (w > 0.8) rb.push({ x: f(x - w / 2), y: f(y - w / 2), w: f(w), dl: Math.round(-(r / 150) * 2600) });
      }
    }
    const lt = [];
    for (let j = 0; j < 15; j++) {
      for (let i = 0; i < 14; i++) {
        const x = i * 10 + 5, y = j * 10 + 5;
        const dg = Math.hypot(x - 84, y - 64) - 30;
        const inNeck = x > 72 && x < 96 && y > 84 && y < 118;
        if (dg < 4 || inNeck) continue;
        const w = Math.max(0, 5 - dg * 0.05) * Math.min(1, x / 50);
        if (w > 0.7) lt.push({ x: f(x - w / 2), y: f(y - w / 2), w: f(w) });
      }
    }
    const bat = [];
    for (let i = 0; i < 12; i++) {
      for (let j = 0; j < 3; j++) {
        const on = (i + 0.5) / 12 <= 0.72;
        bat.push({ x: i * 13, y: j * 12, c: on ? '#2F7A55' : 'rgba(23,23,26,.13)', cls: on ? 'an-flow' : '', dl: i * 120 });
      }
    }
    const hours = [
      { t: '14.00', v: '16°', sun: true }, { t: '15.00', v: '17°', sun: true },
      { t: '16.00', v: '15°', rain: true }, { t: '17.00', v: '14°', rain: true },
      { t: '18.00', v: '14°', cloud: true }
    ].map((h) => ({ rain: false, sun: false, cloud: false, ...h }));
    return { wx, rb, lt, bat, hours, robot, lys, tesla, timer };
  }
}
</script>
</body>
</html>
