<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Tesla · Grille</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.cd{position:relative;overflow:hidden;border-radius:26px;background:#F7F6F3;box-shadow:inset 0 0 0 1px rgba(23,23,26,.06), 0 2px 0 rgba(23,23,26,.05)}
.btn{border:0;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease, background .2s ease}
.btn:active{transform:translateY(3px);box-shadow:none!important}
.btn:focus-visible{outline:2px solid #EF5B25;outline-offset:3px}
.cell{position:absolute;border-radius:2px}
.an-flow{animation:flow 2.4s linear infinite}
@keyframes flow{0%{opacity:1}12%{opacity:.4}24%,100%{opacity:1}}
.knob{transition:transform .28s cubic-bezier(.3,1.4,.5,1), background .2s ease}
@media (prefers-reduced-motion: reduce){.an-flow{animation:none}.knob{transition:none}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; background: #E7E5E0; color: #17171A; font-family: 'Schibsted Grotesk', system-ui, sans-serif; position: relative">
  <dc-import name="A-Topbar" heading="Tesla" back="{{ true }}" hint-size="1280px,72px"></dc-import>
  <div style="position: absolute; left: 24px; top: 88px; display: flex; gap: 16px">
    <div style="width: 844px; display: flex; flex-direction: column; gap: 16px">

      <div class="cd" style="height: 330px; padding: 28px 32px; background: #CDE8D8; box-sizing: border-box; display: flex; flex-direction: column">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <span style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Bilen lader</span>
          <span style="font: 500 13px 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; color: #5F5E5A">Model Y · 2023</span>
        </div>
        <span style="margin-top: 10px; font: 500 84px/1 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: -0.06em; color: #1F5E40">72<span style="font-size: 40px"> %</span></span>
        <div style="position: relative; margin-top: 16px; height: 56px" role="img" aria-label="Batteri 72 procent, lader">
          <sc-for list="{{cells}}" as="d" hint-placeholder-count="200">
            <i class="cell {{d.cls}}" style="left: {{d.x}}px; top: {{d.y}}px; width: 13px; height: 13px; background: {{d.c}}; animation-delay: {{d.dl}}ms"></i>
          </sc-for>
          <i style="position: absolute; left: 768px; top: 14px; width: 6px; height: 28px; border-radius: 3px; background: rgba(23,23,26,.2)"></i>
        </div>
        <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding-top: 16px; border-top: 1px solid rgba(31,94,64,.18)">
          <div style="display: flex; flex-direction: column"><span style="font: 500 28px 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: -0.03em">312 km</span><span style="font-size: 14px; color: #5F5E5A">Rækkevidde</span></div>
          <div style="display: flex; flex-direction: column"><span style="font: 500 28px 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: -0.03em">11 kW</span><span style="font-size: 14px; color: #5F5E5A">Ladeeffekt</span></div>
          <div style="display: flex; flex-direction: column"><span style="font: 500 28px 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: -0.03em">20.43</span><span style="font-size: 14px; color: #5F5E5A">Forventet færdig</span></div>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; height: 350px">
        <div class="cd" style="padding: 26px; box-sizing: border-box; display: flex; flex-direction: column">
          <span style="font-size: 20px; font-weight: 700">Adgang</span>
          <div style="margin-top: 18px; display: flex; align-items: center; gap: 16px">
            <svg width="56" height="56" viewBox="0 0 56 56" fill="none" aria-hidden="true"><rect x="10" y="24" width="36" height="26" rx="6" fill="#17171A"/><path d="M18 24v-6a10 10 0 0 1 20 0v6" stroke="#17171A" stroke-width="4"/><circle cx="28" cy="36" r="3" fill="#F7F6F3"/></svg>
            <div style="display: flex; flex-direction: column">
              <span style="font-size: 26px; font-weight: 700">Låst</span>
            </div>
          </div>
          <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
            <button class="btn" style="height: 60px; border-radius: 18px; background: #17171A; color: #F7F6F3; box-shadow: 0 4px 0 #000; display: flex; align-items: center; justify-content: center; gap: 10px; font: 600 17px 'Schibsted Grotesk', system-ui, sans-serif">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7F6F3" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>
              Lås op
            </button>
            <button class="btn" style="height: 60px; border-radius: 18px; background: #ECEAE5; color: #17171A; box-shadow: 0 4px 0 rgba(23,23,26,.14); display: flex; align-items: center; justify-content: center; gap: 10px; font: 600 17px 'Schibsted Grotesk', system-ui, sans-serif">
              <svg width="22" height="18" viewBox="0 0 26 24" fill="none" stroke="#17171A" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 15v-3l3-4h12l4 4h1v3H3z"/><path d="M18 8l3-4"/></svg>
              Åbn bagagerum
            </button>
          </div>
        </div>

        <div class="cd" style="padding: 26px; box-sizing: border-box; display: flex; flex-direction: column">
          <div style="display: flex; justify-content: space-between; align-items: flex-start">
            <div style="display: flex; flex-direction: column">
              <span style="font-size: 20px; font-weight: 700">Klima</span>
              <span style="font-size: 14px; color: #5F5E5A">{{climateLabel}}</span>
            </div>
            <button class="btn" role="switch" aria-checked="{{climateAria}}" aria-label="Klima" onClick="{{toggleClimate}}" style="position: relative; width: 92px; height: 48px; border-radius: 16px; background: {{switchBg}}; box-shadow: inset 0 2px 3px rgba(23,23,26,.18)">
              <span class="knob" style="position: absolute; left: 4px; top: 4px; width: 40px; height: 40px; border-radius: 12px; background: #F7F6F3; box-shadow: 0 3px 0 rgba(23,23,26,.25); transform: translateX({{knobX}}px); display: flex; align-items: center; justify-content: center">
                <i style="width: 6px; height: 6px; border-radius: 3px; background: {{ledC}}; display: block"></i>
              </span>
            </button>
          </div>
          <div style="margin-top: 22px; display: grid; grid-template-columns: 60px 1fr 60px; align-items: center; gap: 8px; padding: 6px; border-radius: 22px; background: #E9E7E2; box-shadow: inset 0 1px 2px rgba(23,23,26,.10)">
            <button class="btn" aria-label="Sænk temperatur" onClick="{{down}}" style="height: 60px; border-radius: 16px; background: #F7F6F3; box-shadow: 0 3px 0 rgba(23,23,26,.14); font: 500 26px 'IBM Plex Mono', ui-monospace, monospace; color: #17171A">−</button>
            <span style="text-align: center; font: 500 34px 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: -0.04em; color: {{tempC}}">{{temp}}<span style="font-size: 18px"> °C</span></span>
            <button class="btn" aria-label="Hæv temperatur" onClick="{{up}}" style="height: 60px; border-radius: 16px; background: #F7F6F3; box-shadow: 0 3px 0 rgba(23,23,26,.14); font: 500 26px 'IBM Plex Mono', ui-monospace, monospace; color: #17171A">+</button>
          </div>
          <button class="btn" style="margin-top: auto; height: 60px; border-radius: 18px; background: #ECEAE5; color: #17171A; box-shadow: 0 4px 0 rgba(23,23,26,.14); display: flex; align-items: center; justify-content: center; gap: 10px; font: 600 17px 'Schibsted Grotesk', system-ui, sans-serif">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8c3-2 5 2 8 0s5-2 8 0M4 13c3-2 5 2 8 0s5-2 8 0M4 18c3-2 5 2 8 0s5-2 8 0"/></svg>
            Afrim ruder
          </button>
        </div>
      </div>
    </div>
    <dc-import name="A-Player" hint-size="372px,696px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { climate: false, temp: 21 }; }
  renderVals() {
    // Batteri: 46 × 7 celler. Fyldt bredde = kendt niveau; ladestrømmen løber kun gennem det fyldte.
    const cells = [];
    const cols = 46, rows = 3, level = 0.72;
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const on = (i + 0.5) / cols <= level;
        cells.push({
          x: i * 16.6, y: j * 16.6,
          c: on ? '#2F7A55' : 'rgba(23,23,26,.13)',
          cls: on ? 'an-flow' : '',
          dl: on ? Math.round(i * 52 + Math.abs(j - 1) * 40) : 0
        });
      }
    }
    const on = this.state.climate;
    return {
      cells,
      climateLabel: on ? 'Tændt' : 'Slukket',
      climateAria: on ? 'true' : 'false',
      switchBg: on ? '#2F7A55' : '#D6D3CC',
      knobX: on ? 44 : 0,
      ledC: on ? '#2F7A55' : '#B5B2AB',
      temp: this.state.temp,
      tempC: on ? '#17171A' : '#8C8A85',
      toggleClimate: () => this.setState({ climate: !this.state.climate }),
      down: () => this.setState({ temp: Math.max(15, this.state.temp - 1) }),
      up: () => this.setState({ temp: Math.min(28, this.state.temp + 1) })
    };
  }
}
</script>
</body>
</html>
