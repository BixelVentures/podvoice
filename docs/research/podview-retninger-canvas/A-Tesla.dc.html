<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Tesla</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.cd{position:relative;overflow:hidden;border-radius:24px;background:#F7F6F3;box-shadow:inset 0 0 0 1px rgba(23,23,26,.06)}
.btn{border:0;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease, background .2s ease}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn:focus-visible{outline:2px solid #17171A;outline-offset:3px}
.dt{position:absolute;border-radius:50%}
.lbl{font:600 15px 'Schibsted Grotesk', system-ui, sans-serif;color:#5F5E5A}
.an-flow{animation:flow 2.2s linear infinite}
.an-warm{animation:warm 2.6s ease-in-out infinite}
@keyframes flow{0%{opacity:1}14%{opacity:.35}28%,100%{opacity:1}}
@keyframes warm{0%,100%{transform:scale(.5);opacity:.4}50%{transform:scale(1.1);opacity:1}}
.knob{transition:transform .28s cubic-bezier(.3,1.4,.5,1)}
@media (prefers-reduced-motion: reduce){.an-flow,.an-warm{animation:none}.knob{transition:none}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; background: #E9E7E2; color: #17171A; font-family: 'Schibsted Grotesk', system-ui, sans-serif; position: relative">
  <dc-import name="A-Topbar" heading="Tesla" back="{{ true }}" scenario="green" hint-size="1280px,72px"></dc-import>
  <div style="position: absolute; left: 24px; top: 88px; display: flex; gap: 16px">
    <div style="width: 844px; height: 696px; display: flex; flex-direction: column; gap: 16px">
      <div class="cd" style="height: {{heroH}}px; flex: none; padding: 24px 28px; box-sizing: border-box; display: flex; flex-direction: column; background: {{s.surface}}">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <span class="lbl">{{s.mode}}</span>
          <sc-if value="{{noFresh}}" hint-placeholder-val="{{ true }}"><span class="lbl">Model Y</span></sc-if>
          <sc-if value="{{fresh}}" hint-placeholder-val="{{ false }}"><dc-import name="K-Fresh" text="{{fresh}}" hint-size="220px,32px"></dc-import></sc-if>
        </div>
        <div style="position: relative; z-index: 1; margin-top: 8px; display: flex; flex-direction: column; max-width: 470px">
          <span style="font-size: 40px; line-height: 1.05; font-weight: 800; letter-spacing: -0.03em; color: {{s.titleC}}">{{s.title}}</span>
          <span style="margin-top: 6px; font-size: 17px; font-weight: 600; color: #3F3E3B">{{s.sub}}</span>
        </div>
        <sc-if value="{{nb.on}}" hint-placeholder-val="{{ false }}"><span style="position: relative; z-index: 1; margin-top: 12px; display: block; height: 40px"><dc-import name="K-Notice" compact="true" level="{{nb.lvl}}" title="{{nb.t}}" text="{{nb.d}}" w="470px" hint-size="470px,40px"></dc-import></span></sc-if>
        <span style="position: absolute; right: 28px; top: 60px; font: 500 64px/0.85 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: -0.07em; color: {{s.bigC}}">{{s.big}}<span style="font-size: 32px"> %</span></span>
        <div style="position: absolute; right: 20px; bottom: 16px; width: 540px; height: 168px; transform: scale({{carScale}}); transform-origin: right bottom" role="img" aria-label="{{s.carLabel}}">
          <sc-for list="{{car}}" as="d" hint-placeholder-count="600">
            <i class="dt {{d.cls}}" style="left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.w}}px; background: {{d.c}}; animation-delay: {{d.dl}}ms"></i>
          </sc-for>
        </div>
        <sc-if value="{{s.metricsOn}}" hint-placeholder-val="{{ true }}">
          <div style="position: relative; z-index: 1; margin-top: auto; display: flex; gap: 28px">
            <sc-for list="{{s.metrics}}" as="m" hint-placeholder-count="3">
              <div style="display: flex; align-items: baseline; gap: 8px">
                <span style="font: 500 22px 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: -0.04em">{{m.v}}</span>
                <span style="font-size: 15px; color: #5F5E5A">{{m.k}}</span>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 1; min-height: 308px">
        <div class="cd" style="padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: center; height: 44px">
            <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.01em">Adgang</span>
          </div>
          <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: stretch">
            <sc-for list="{{tiles}}" as="t" hint-placeholder-count="2">
              <dc-import name="K-ActionTile" label="{{t.label}}" value="{{t.value}}" hint="{{t.hint}}" icon="{{t.icon}}" tone="{{t.tone}}" h="196" hint-size="170px,196px"></dc-import>
            </sc-for>
          </div>
        </div>
        <div class="cd" style="padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; align-items: center; height: 44px; margin-bottom: 8px">
            <span style="display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 800; letter-spacing: -0.01em; line-height: 28px">Klima</span><span style="font-size: 15px; color: #5F5E5A; line-height: 18px">{{climateLabel}}</span></span>
            <span style="display: flex; align-items: center; gap: 8px">
              <button class="btn" aria-label="Afrim ruder" title="Afrim ruder" style="width: 44px; height: 44px; border-radius: 999px; background: #EFEDE8; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9c3-3 15-3 18 0M5 13c2.5-2 11.5-2 14 0M8 17c1.5-1 6.5-1 8 0M12 3v18"/></svg></button>
              <button class="btn" role="switch" aria-checked="{{climateAria}}" aria-label="Klima" onClick="{{toggle}}" style="background: transparent; padding: 0"><dc-import name="K-Switch" on="{{climateAria}}" hint-size="56px,44px"></dc-import></button>
            </span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid rgba(23,23,26,.07)">
            <span style="font-size: 17px; font-weight: 600">Måltemperatur</span>
            <div style="display: grid; grid-template-columns: 56px 92px 56px; align-items: center; padding: 4px; border-radius: 18px; background: #E9E7E2">
              <button class="btn" aria-label="Sænk temperatur" onClick="{{down}}" style="height: 48px; border-radius: 999px; background: #F7F6F3; font: 500 24px 'IBM Plex Mono', monospace; color: #17171A">−</button>
              <span style="text-align: center; font: 500 28px 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: -0.05em; color: {{tempC}}">{{temp}}°</span>
              <button class="btn" aria-label="Hæv temperatur" onClick="{{up}}" style="height: 48px; border-radius: 999px; background: #F7F6F3; font: 500 24px 'IBM Plex Mono', monospace; color: #17171A">+</button>
            </div>
          </div>
          <sc-for list="{{seats}}" as="r" hint-placeholder-count="2">
            <div style="display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid rgba(23,23,26,.07)">
              <span style="font-size: 15px; font-weight: 600; color: #3F3E3B">{{r.k}}</span>
              <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #E9E7E2">
                <sc-for list="{{r.opts}}" as="o" hint-placeholder-count="4">
                  <button class="btn" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: 44px; border-radius: 999px; background: {{o.bg}}; color: {{o.fg}}; font: 600 16px 'Schibsted Grotesk', sans-serif">{{o.l}}</button>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
    <dc-import name="A-Player" speaker="Køkkenalrum HomePod" hint-size="372px,696px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"adgang":{"editor":"enum","default":"idle","options":["idle","laaser","laast","laaserop","ulaast","ukendt"]},"hero":{"editor":"enum","default":"221","options":["221","458","372"]},"state":{"editor":"enum","default":"ukendt","options":["ukendt","lader","parkeret","klima"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const st = props.state || 'ukendt';
    this.state = { climate: st === 'klima', temp: 21, seat: { f: st === 'klima' ? 3 : 0, p: 0 } };
  }
  inPoly(x, y, P) {
    let c = false;
    for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
      if ((P[i][1] > y) !== (P[j][1] > y) && x < ((P[j][0] - P[i][0]) * (y - P[i][1])) / (P[j][1] - P[i][1]) + P[i][0]) c = !c;
    }
    return c;
  }
  renderVals() {
    // Forslag: heroen låses til overblikkets rækker. S 221 (én række), L 458 (to rækker).
    const heroH = Number(this.props.hero) || 221, heroS = heroH <= 221;
    const st = this.props.state || 'ukendt';
    // Roller fra Green-bilmodellen: batteryPercent, rangeKm, charging, powerKw, endsAt, locked, climate,
    // temperatureC, defrost, driverSeat, passengerSeat, trunk. Modellen vækker aldrig bilen.
    const S = {
      ukendt: {
        surface: '#D5EADD', mode: 'Model Y', title: 'Ulåst', titleC: '#3F3E3B', sub: '313 km rækkevidde · kabine 12,2°', big: '81',
        bigC: '#5F5E5A', level: 0.81, fill: '#8C918D', empty: 'rgba(23,23,26,.08)', flow: false, warm: false,
        lock: 'Ulåst', carLabel: 'Bil 81 procent', nb: ['handling', 'Bagagerum åbent', 'Se til bilen, og hold området ved bagagerummet frit.'], metrics: []
      },
      lader: {
        surface: '#CDE8D8', mode: 'Tilsluttet', title: 'Lader', titleC: '#17442F', sub: '312 km rækkevidde', big: '72',
        bigC: '#17442F', level: 0.72, fill: '#2F7A55', empty: 'rgba(23,23,26,.12)', flow: true, warm: false,
        lock: 'Låst', carLabel: 'Bil fyldt 72 procent, lader',
        metrics: [{ v: '11 kW', k: 'ladeeffekt' }, { v: '20.43', k: 'forventet færdig' }]
      },
      parkeret: {
        surface: '#D5EADD', mode: 'Ikke tilsluttet', title: 'Parkeret', titleC: '#17171A', sub: '286 km rækkevidde', big: '64',
        bigC: '#17171A', level: 0.64, fill: '#5E6B63', empty: 'rgba(23,23,26,.10)', flow: false, warm: false,
        lock: 'Låst', carLabel: 'Bil fyldt 64 procent, parkeret',
        metrics: [{ v: 'Låst', k: 'adgang' }, { v: 'Slukket', k: 'klima' }]
      },
      klima: {
        surface: '#CDE8D8', mode: 'Ikke tilsluttet', title: 'Klimaet kører', titleC: '#17442F', sub: 'Varmer kabinen til 21 °C', big: '64',
        bigC: '#17442F', level: 0.64, fill: '#2F7A55', empty: 'rgba(23,23,26,.12)', flow: false, warm: true,
        lock: 'Låst', carLabel: 'Bil fyldt 64 procent, klima kører',
        metrics: [{ v: '14 °C', k: 'inde nu' }, { v: '21 °C', k: 'mål' }, { v: 'Høj', k: 'førersæde' }]
      }
    };
    // Fælles beskedmønster (K-Kit): friskhed som mærke øverst til højre i heroen; problemer og handlinger
    // i én beskedlinje lige under heroen i tre niveauer: fejl (rød), handling (rav), info (grå). Kun produktets egen tekst.
    const NB = { fejl: { bg: '#F8DCDC', fg: '#5E1416', ic: '#B0262A', glyph: '!' }, handling: { bg: '#FBE7B9', fg: '#4A3205', ic: '#B07A06', glyph: '!' }, info: { bg: '#E2E0DB', fg: '#3F3E3B', ic: '#7A7873', glyph: 'i' } };
    const nbOf = (a) => a && a[0] ? { on: true, lvl: a[0], t: a[1], d: a[2] || '' } : { on: false, t: '', d: '' };
    const s = { nb: [], fresh: '', ...(S[st] || S.ukendt) };
    s.metricsOn = true;
    // Bilen som prikfelt: karrosseriet fyldes op til det kendte batteriniveau; kabinen lever, når klimaet kører.
    const k = 0.54;
    const body = [[30, 300], [44, 236], [128, 208], [300, 124], [430, 92], [612, 90], [738, 122], [878, 190], [958, 212], [988, 258], [982, 300]];
    const cabin = [[330, 136], [440, 108], [600, 106], [702, 134], [740, 186], [318, 186]];
    const wheels = [[236, 300], [804, 300]];
    const car = [];
    for (let y = 80; y < 362; y += 15) {
      for (let x = 20; x < 1000; x += 15) {
        const near = wheels.some(([wx, wy]) => Math.hypot(x - wx, y - wy) < 70);
        const tire = wheels.some(([wx, wy]) => { const r = Math.hypot(x - wx, y - wy); return r > 40 && r < 62; });
        const inBody = this.inPoly(x, y, body) && !near;
        const inCabin = this.inPoly(x, y, cabin);
        let c = null, w = 6.5, cls = '', dl = 0;
        if (tire) { c = '#17171A'; w = 6.5; }
        else if (inCabin) {
          if (s.warm) { c = '#FF7A5C'; cls = 'an-warm'; w = 6; dl = Math.round(-((x + y) % 300) * 8); }
          else { c = 'rgba(23,23,26,.16)'; w = 3.5; }
        } else if (inBody) {
          const filled = (x - 30) / 958 <= s.level;
          c = filled ? s.fill : s.empty;
          w = filled ? 7 : 5.5;
          if (filled && s.flow) { cls = 'an-flow'; dl = Math.round(x * 2.2); }
        }
        if (c) car.push({ x: ((x - 20) * k - w / 2).toFixed(1), y: ((y - 80) * k * 1.1 - w / 2).toFixed(1), w, c, cls, dl });
      }
    }
    const on = this.state.climate;
    const lv = ['Fra', 'Lav', 'Mellem', 'Høj'];
    const seat = (key, label) => ({
      k: label,
      opts: lv.map((l, i) => {
        const sel = this.state.seat[key] === i;
        return { l, on: sel ? 'true' : 'false', bg: sel ? '#17171A' : 'transparent', fg: sel ? '#F7F6F3' : '#17171A',
          pick: () => this.setState({ seat: { ...this.state.seat, [key]: i } }) };
      })
    });
    // Adgang som to handlingsflader (K-ActionTile): status og handling er én flade; feedback sker i fladen.
    const ad = this.props.adgang || 'idle', locked = s.lock !== 'Ulåst', trunkOpen = st === 'ukendt';
    const lockIc = 'M7 11V7a5 5 0 0 1 10 0v4M5 11h14v10H5z', openIc = 'M7 11V7a5 5 0 0 1 9.6-2M5 11h14v10H5z', trunkIc = 'M3 13l3-6h12l3 6v5H3zM3 13h18M7 18v2M17 18v2';
    const doorT = { idle: locked ? { tone: 'calm', value: 'Låst', hint: 'Tryk for at låse op', icon: lockIc } : { tone: 'attention', value: 'Ulåst', hint: 'Tryk for at låse', icon: openIc },
      laaser: { tone: 'busy', value: 'Låser…', hint: 'Anmodning modtaget.', icon: lockIc }, laast: { tone: 'done', value: 'Låst', hint: 'Bekræftet', icon: lockIc },
      laaserop: { tone: 'busy', value: 'Låser op…', hint: 'Anmodning modtaget.', icon: openIc }, ulaast: { tone: 'done', value: 'Ulåst', hint: 'Bekræftet', icon: openIc },
      ukendt: { tone: 'error', value: 'Ukendt', hint: 'Kontrollér bilen.', icon: lockIc } }[ad];
    const tiles = [{ label: 'Døre', ...doorT }, trunkOpen ? { label: 'Bagagerum', tone: 'attention', value: 'Åbent', hint: 'Tryk for at lukke', icon: trunkIc } : { label: 'Bagagerum', tone: 'calm', value: 'Lukket', hint: 'Tryk for at åbne', icon: trunkIc }];
    const lockBtnTxt = s.lock === 'Ulåst' ? 'Lås bilen' : 'Lås op', trunkBtnTxt = st === 'ukendt' ? 'Luk bagagerum' : 'Åbn bagagerum';
    return {
      tiles, lockBtn: lockBtnTxt, trunkBtn: trunkBtnTxt,
      // Adgangsknapper følger bilens tilstand (vehicle-view.js): Ulåst → "Lås bilen", Låst → "Lås op"; bagagerum åbent → "Luk bagagerum".

      // Beskedlinjen er den generiske K-Notice (fejl/handling/info) som på alle sider. Bekræftelser vises kun i handlingsfladen.
      nb: nbOf(ad === 'ukendt' ? ['fejl', 'Udfald ukendt · kontrollér bilen.', 'Svar mangler · Kontrollér bilen før en ny kommando.'] : s.nb), fresh: s.fresh, noFresh: !s.fresh, carScale: heroS ? 0.5 : 1,
      heroH, heroPad: heroS ? 24 : 32, heroTitle: heroS ? 40 : 56,
      s, car,
      climateLabel: on ? 'Tændt · ' + this.state.temp + ' °C' : 'Slukket',
      climateAria: on ? 'true' : 'false', swBg: on ? '#2F7A55' : 'rgba(23,23,26,.18)', knobX: on ? 28 : 0,
      // Adgang som to statusfelter (døre, bagagerum) over handlingerne. Rav kant = noget at gøre.
      // Adgang: status og handling i samme række (Døre → Lås bilen/Lås op, Bagagerum → Luk/Åbn). Kort i neutral flade; kun headeren er grøn.
      access: [
        { k: 'Døre', v: s.lock, btn: lockBtnTxt, i: s.lock === 'Ulåst' ? 'M7 11V7a5 5 0 0 1 9.6-2M5 11h14v10H5z' : 'M7 11V7a5 5 0 0 1 10 0v4M5 11h14v10H5z', c: s.lock === 'Ulåst' ? '#7A4A06' : '#17171A', icBg: s.lock === 'Ulåst' ? '#FBE7B9' : '#EFEDE8', bt: 'none', bBg: '#17171A', bFg: '#F7F6F3', bSh: 'none' },
        { k: 'Bagagerum', v: st === 'ukendt' ? 'Åbent' : 'Lukket', btn: trunkBtnTxt, i: 'M3 13l3-6h12l3 6v5H3zM3 13h18M7 18v2M17 18v2', c: st === 'ukendt' ? '#7A4A06' : '#17171A', icBg: st === 'ukendt' ? '#FBE7B9' : '#EFEDE8', bt: '1px solid rgba(23,23,26,.08)', bBg: '#EFEDE8', bFg: '#17171A', bSh: 'none' }
      ],
      temp: this.state.temp, tempC: on ? '#17171A' : '#5F5E5A',
      seats: [seat('f', 'Førersæde'), seat('p', 'Passager')],
      climBg: on ? '#D5EADD' : '#F7F6F3', climBtn: on ? 'Sluk klima' : 'Tænd klima', climBtnBg: on ? '#EFEDE8' : '#17171A', climBtnFg: on ? '#17171A' : '#F7F6F3',
      toggle: () => this.setState({ climate: !this.state.climate }),
      down: () => this.setState({ temp: Math.max(15, this.state.temp - 1) }),
      up: () => this.setState({ temp: Math.min(28, this.state.temp + 1) })
    };
  }
}
</script>
</body>
</html>
