<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Robot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.cd{position:relative;overflow:hidden;border-radius:24px;background:#F7F6F3;box-shadow:inset 0 0 0 1px rgba(23,23,26,.06)}
.btn{border:0;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease, background .2s ease}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn:focus-visible{outline:2px solid #17171A;outline-offset:3px}
.dt{position:absolute;border-radius:50%}
.lbl{font:600 15px 'Schibsted Grotesk', system-ui, sans-serif;color:#5F5E5A}
.an-in{animation:inward 2.4s ease-in-out infinite}
@keyframes inward{0%,100%{transform:scale(.45);opacity:.45}50%{transform:scale(1);opacity:1}}
.base-in{animation:basein .28s cubic-bezier(.2,.9,.3,1) both}@keyframes basein{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.an-in{animation:none}}
</style>
</helmet>
<div style="width: 1280px; height: 1400px; background: #E9E7E2; color: #17171A; font-family: 'Schibsted Grotesk', system-ui, sans-serif; position: relative; overflow: hidden">
  <dc-import name="A-Topbar" heading="Robotstøvsuger" back="{{ true }}" scenario="green" hint-size="1280px,72px"></dc-import>
  <div style="position: absolute; left: 24px; top: 752px; width: 844px; height: 48px; background: linear-gradient(180deg, rgba(233,231,226,0), #E9E7E2); z-index: 4; pointer-events: none" aria-hidden="true"></div>
  <div style="position: absolute; left: 0; right: 0; top: 800px; border-top: 2px dashed rgba(23,23,26,.35); z-index: 5; pointer-events: none" aria-hidden="true">
    <span style="position: absolute; right: 12px; top: 6px; padding: 4px 10px; border-radius: 8px; background: #17171A; color: #F7F6F3; font: 600 15px 'Schibsted Grotesk', sans-serif">Fold · 800 px · næste sektion kigger frem og fader ud · afspilleren står fast</span>
  </div>
  <div style="position: absolute; left: 24px; top: 88px; display: flex; gap: 16px; align-items: flex-start">
    <div style="width: 844px; display: flex; flex-direction: column; gap: 32px">
      <div class="cd" style="height: {{heroH}}px; flex: none; padding: {{heroPad}}px; box-sizing: border-box; display: flex; flex-direction: column; background: {{s.surface}}">
        <div style="position: absolute; right: 0; top: 0; width: 420px; height: {{heroH}}px; opacity: {{s.ringOp}}; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 160px); mask-image: linear-gradient(90deg, transparent 0, #000 160px)" aria-hidden="true">
          <sc-for list="{{rings}}" as="d" hint-placeholder-count="300">
            <i class="sq {{s.anim}}" style="position: absolute; border-radius: 1px; left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.w}}px; background: {{s.ring}}; animation-delay: {{d.dl}}ms"></i>
          </sc-for>
          <span style="position: absolute; left: 170px; top: 70px; font: 500 16px/1 'IBM Plex Mono', monospace; color: {{s.ring}}" aria-hidden="true">+</span>
          <span style="position: absolute; left: 110px; top: 220px; font: 500 16px/1 'IBM Plex Mono', monospace; color: {{s.ring}}" aria-hidden="true">+</span>
        </div>
        <div style="position: relative; display: flex; justify-content: space-between; align-items: center; height: 32px; margin-top: -6px">
          <span class="lbl">{{s.mode}}</span>
          <sc-if value="{{fresh}}" hint-placeholder-val="{{ false }}"><dc-import name="K-Fresh" text="{{fresh}}" hint-size="220px,32px"></dc-import></sc-if>
        </div>
        <span style="position: relative; margin-top: 8px; font-size: {{heroTitle}}px; line-height: 1; font-weight: 800; letter-spacing: -0.035em; color: {{s.titleC}}">{{s.title}}</span>
        <span style="position: relative; margin-top: 12px; font-size: 19px; font-weight: 600; color: #3F3E3B">{{s.sub}}</span>
        <div style="position: relative; margin-top: auto; display: flex; align-items: center; gap: 12px; justify-content: flex-start; flex-direction: row-reverse">
          <sc-for list="{{s.actions}}" as="a" hint-placeholder-count="2">
            <button class="btn" style="height: 56px; padding: 0 26px; border-radius: 999px; background: {{a.bg}}; color: {{a.fg}}; box-shadow: {{a.sh}}; font: 600 17px 'Schibsted Grotesk', system-ui, sans-serif">{{a.label}}</button>
          </sc-for>
          <button class="btn" onClick="{{toggleBase}}" aria-expanded="{{baseAria}}" aria-controls="robot-base" style="height: 56px; padding: 0 18px 0 22px; border-radius: 999px; background: {{baseBtnBg}}; color: #17171A; box-shadow: inset 0 0 0 1.5px rgba(23,23,26,.14); display: flex; align-items: center; gap: 8px; font: 600 17px 'Schibsted Grotesk', system-ui, sans-serif">Basen<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="transform: rotate({{baseChev}}deg); transition: transform .24s ease"><path d="M6 9l6 6 6-6"/></svg></button>
          <sc-if value="{{s.progress}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; align-items: center; gap: 12px; margin-left: 12px">
              <div style="width: 220px; display: grid; grid-template-columns: repeat(25, minmax(0, 1fr)); gap: 2px" role="img" aria-label="{{s.progress}}">
                <sc-for list="{{s.seg}}" as="c" hint-placeholder-count="25"><i style="height: 8px; border-radius: 2px; background: {{c}}; display: block"></i></sc-for>
              </div>
              <span style="font: 500 16px 'IBM Plex Mono', ui-monospace, monospace">{{s.progress}}</span>
            </div>
          </sc-if>
        </div>
      </div>
      <sc-if value="{{baseOpen}}" hint-placeholder-val="{{ false }}">
        <div id="robot-base" class="base-in" style="margin-top: -20px; padding: 16px; border-radius: 20px; background: #F7F6F3; box-shadow: inset 0 0 0 1px rgba(23,23,26,.06); display: flex; flex-direction: column; gap: 12px">
          <span style="font-size: 15px; font-weight: 600; color: #5F5E5A">{{baseLabel}}</span>
          <div style="display: flex; gap: 8px; flex-wrap: wrap">
            <sc-for list="{{dock}}" as="d" hint-placeholder-count="3">
              <button class="btn" style="height: 56px; padding: 0 22px 0 16px; border-radius: 999px; background: {{d.bg}}; color: {{d.fg}}; box-shadow: {{d.sh}}; display: flex; align-items: center; gap: 10px; font: 600 16px 'Schibsted Grotesk', sans-serif">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.i}}"/></svg>{{d.l}}
              </button>
            </sc-for>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{nb.on}}" hint-placeholder-val="{{ false }}">
        <div style="margin-top: -20px"><dc-import name="K-Notice" level="{{nb.lvl}}" title="{{nb.t}}" text="{{nb.d}}" hint-size="844px,72px"></dc-import></div>
      </sc-if>

      <section style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 0 4px">
          <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 24px; font-weight: 800; letter-spacing: -0.01em">Rum</span><span style="font-size: 16px; color: #5F5E5A">Stueplan (2025) · {{roomCount}} af 8 valgt</span></div>
          <button class="btn" onClick="{{all}}" style="height: 44px; padding: 0 18px; border-radius: 999px; background: #F7F6F3; font: 600 16px 'Schibsted Grotesk', sans-serif; color: #17171A">Vælg alle</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{rooms}}" as="r" hint-placeholder-count="8">
            <button class="btn" aria-pressed="{{r.on}}" onClick="{{r.pick}}" style="height: 64px; padding: 0 18px; border-radius: 20px; background: {{r.bg}}; color: {{r.fg}}; box-shadow: {{r.sh}}; display: flex; align-items: center; gap: 10px; font: 600 16px 'Schibsted Grotesk', sans-serif; text-align: left">
              <i style="width: 10px; height: 10px; border-radius: 5px; background: {{r.dot}}; display: block; flex: none"></i>{{r.label}}
            </button>
          </sc-for>
        </div>
      </section>


      <section style="display: flex; flex-direction: column; gap: 16px">
        <span style="padding: 0 4px; font-size: 24px; font-weight: 800; letter-spacing: -0.01em">Rengøringsvalg</span>      </section>

      <section style="display: flex; flex-direction: column; gap: 16px">
        <div class="cd" style="padding: 12px 24px; box-sizing: border-box; display: flex; flex-direction: column">
          <sc-for list="{{opts}}" as="g" hint-placeholder-count="5">
            <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid rgba(23,23,26,.07)">
              <span style="font-size: {{g.ks}}px; font-weight: {{g.kw}}; color: {{g.kc}}">{{g.k}}</span>
              <div style="display: grid; grid-template-columns: {{g.cols}}; gap: 4px; padding: 4px; border-radius: 999px; background: #E9E7E2">
                <sc-for list="{{g.o}}" as="o" hint-placeholder-count="4">
                  <button class="btn" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: {{g.bh}}px; border-radius: 999px; background: {{o.bg}}; color: {{o.fg}}; font: 600 {{g.bf}}px 'Schibsted Grotesk', sans-serif">{{o.l}}</button>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>
      </section>

      <section style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px">
        <div class="cd" style="padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
          <span style="font-size: 24px; font-weight: 800">Seneste hændelser</span>
          <sc-for list="{{events}}" as="e" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid rgba(23,23,26,.07)">
              <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
                <span style="font: 500 15px 'IBM Plex Mono', ui-monospace, monospace; color: #5F5E5A">{{e.t}}</span>
                <span style="font-size: 17px; font-weight: 700">{{e.h}}</span>
                <span style="font-size: 15px; color: #5F5E5A">{{e.d}}</span>
              </div>
              <sc-if value="{{e.again}}" hint-placeholder-val="{{ false }}">
                <button class="btn" style="height: 44px; padding: 0 16px; border-radius: 999px; background: #EFEDE8; font: 600 15px 'Schibsted Grotesk', sans-serif; color: #17171A">Vælg igen</button>
              </sc-if>
            </div>
          </sc-for>
        </div>
        <div class="cd" style="padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 24px; font-weight: 800">Vedligehold</span><span style="display: flex; gap: 10px; align-items: center"><span style="font-size: 15px; color: #5F5E5A">4 påmindelser</span></span></div>
          <sc-for list="{{care}}" as="c" hint-placeholder-count="4">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; justify-content: space-between"><span style="font-size: 16px">{{c.k}}</span><span style="font: 500 15px 'IBM Plex Mono', monospace; color: {{c.c}}">{{c.v}}</span></div>
              <div style="height: 6px; border-radius: 3px; background: #E9E7E2"><div style="width: {{c.p}}%; height: 6px; border-radius: 3px; background: {{c.c}}"></div></div>
            </div>
          </sc-for>
        </div>
      </section>
    </div>
    <dc-import name="A-Player" speaker="Køkkenalrum HomePod" hint-size="372px,696px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"hero":{"editor":"enum","default":"221","options":["221","458","300"]},"base":{"editor":"enum","default":"lukket","options":["lukket","aaben","vasker"]},"state":{"editor":"enum","default":"oplader","options":["oplader","rengoer","pause","tilbasen","fejl","ukendt"]},"player":{"editor":"enum","default":"full","options":["full","mini"]},"$preview":{"width":1280,"height":1400}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // Rum og valg som på Green 9. nov.: 6 af 8 rum, Støvsug og vask, Maks., Extreme, Standard, 2×.
    this.state = {
      rooms: { 'Køkkenalrum': 1, "Frida's Værelse": 0, 'Entré': 1, 'Gang': 1, 'Soveværelse': 1, "Svend's Værelse": 0, 'Bryggers': 1, 'Badeværelse': 1 },
      o: { type: 0, suc: 3, vand: 3, rute: 0, gange: 1 }
    };
  }
  renderVals() {
    // Forslag: heroen låses til overblikkets rækker. S 221 (én række), L 458 (to rækker).
    const heroH = Number(this.props.hero) || 221, heroS = heroH <= 221;
    const st = this.props.state || 'oplader';
    const n = Object.values(this.state.rooms).filter(Boolean).length;
    const dark = { bg: '#17171A', fg: '#F7F6F3', sh: 'none' };
    const light = { bg: '#F7F6F3', fg: '#17171A', sh: 'none' };
    const danger = { bg: '#FFFFFF', fg: '#B0262A', sh: 'inset 0 0 0 2px #B0262A' };
    const segs = (p) => Array.from({ length: 25 }, (_, i) => (i < Math.round(p / 4) ? '#7E2242' : 'rgba(126,34,66,.16)'));
    const S = {
      oplader: { surface: '#F6D8E1', ring: '#B23A62', core: '#F7F6F3', anim: '', ringOp: 0.55, mode: 'Ved basen', title: 'Oplader', titleC: '#17171A',
        sub: 'Batteri 100 % · senest 0,2 m² · 1,1 min', actions: [{ ...dark, label: 'Start · ' + n + ' rum' }] },
      rengoer: { surface: '#F6D3DE', ring: '#B23A62', core: '#B23A62', anim: 'an-in', ringOp: 1, mode: 'Støvsugning og gulvvask', title: 'Rengør', titleC: '#17171A',
        sub: 'Stueplan (2025) · ' + n + ' områder',
        actions: [{ ...dark, label: 'Pause' }, { ...danger, label: 'Afslut' }] },
      pause: { surface: '#F6D3DE', ring: '#B23A62', core: '#B23A62', anim: '', ringOp: 0.7, mode: 'Støvsugning og gulvvask', title: 'På pause', titleC: '#17171A',
        sub: 'Brug Pause, hvis du vil fortsætte senere.', nb: ['handling', 'Robotten mangler vand'],
        actions: [{ ...dark, label: 'Fortsæt' }, { ...danger, label: 'Afslut' }] },
      tilbasen: { surface: '#F6D3DE', ring: '#B23A62', core: '#17171A', anim: 'an-in', ringOp: 0.8, mode: 'Kør til basen', title: 'Til basen', titleC: '#17171A',
        sub: 'Robotten sendes til basen.', actions: [{ ...dark, label: 'Pause' }] },
      fejl: { surface: '#F6D8E1', ring: '#8C8A85', core: '#B0262A', anim: '', ringOp: 0.45, broken: true, mode: 'Robotfejl', title: 'Hovedbørsten sidder fast', titleC: '#B0262A',
        sub: 'Robotten melder en fejl', nb: ['fejl', 'Sluk robotten før du fjerner hår og genstande fra hovedbørsten, dens ender og holderne.'],
        actions: [{ ...dark, label: 'Fortsæt' }, { ...light, label: 'Send til basen' }] },
      ukendt: { surface: '#F6D8E1', ring: '#8C8A85', core: '#8C8A85', anim: '', ringOp: 0.35, mode: 'Robotstøvsuger', title: 'Status ukendt', titleC: '#5F5E5A',
        sub: 'Senest ved basen · batteri 100 %', nb: ['info', 'Effekten af en kommando kan ikke bekræftes, før robotten svarer'],
        actions: [{ ...light, label: 'Start · ' + n + ' rum' }] }
    };
    // Fælles beskedmønster (K-Kit): friskhed som mærke øverst til højre i heroen; problemer og handlinger
    // i én beskedlinje lige under heroen i tre niveauer: fejl (rød), handling (rav), info (grå). Kun produktets egen tekst.
    const NB = { fejl: { bg: '#F8DCDC', fg: '#5E1416', ic: '#B0262A', glyph: '!' }, handling: { bg: '#FBE7B9', fg: '#4A3205', ic: '#B07A06', glyph: '!' }, info: { bg: '#E2E0DB', fg: '#3F3E3B', ic: '#7A7873', glyph: 'i' } };
    const nbOf = (a) => a && a[0] ? { on: true, lvl: a[0], t: a[1], d: a[2] || '' } : { on: false, t: '', d: '' };
    const s = { nb: [], fresh: '', progress: '', seg: [], broken: false, ...(S[st] || S.oplader) };
    // Samme hjørnebuer som på overblikket: bånd af kvadratiske celler, der stråler fra nederste højre hjørne.
    // Ved fejl er buerne brudt; i ro står de stille.
    const rings = [];
    for (let y = 4.5; y < 300; y += 9) {
      for (let x = 4.5; x < 420; x += 9) {
        const rr = Math.hypot(x - 440, y - 330);
        if (rr < 30 || rr > 420) continue;
        const ph = (rr % 24) / 24;
        if (ph > 0.55) continue;
        if (s.broken && Math.sin(Math.atan2(y - 262, x - 400) * 7 + rr * 0.05) > 0.45) continue;
        const w = (7 - rr * 0.012) * Math.min(1, x / 150) * Math.min(1, (y + 30) / 60) * (1 - Math.abs(ph - 0.27) * 1.4);
        if (w > 0.9) rings.push({ x: (x - w / 2).toFixed(1), y: (y - w / 2).toFixed(1), w: w.toFixed(1), dl: Math.round(-(rr / 420) * 2400) });
      }
    }
    const rooms = Object.entries(this.state.rooms).map(([label, on]) => ({
      label, on: on ? 'true' : 'false',
      bg: on ? '#F6D8E1' : '#F7F6F3', fg: '#17171A', sh: on ? 'inset 0 0 0 2px #B23A62' : 'none', dot: on ? '#B23A62' : 'rgba(23,23,26,.2)',
      pick: () => this.setState({ rooms: { ...this.state.rooms, [label]: on ? 0 : 1 } })
    }));
    const groups = [
      ['type', 'Type', ['Støvsug og vask', 'Støvsug', 'Vask'], '1.6fr 1fr 1fr'],
      ['suc', 'Sugeevne', ['Stille', 'Balanceret', 'Turbo', 'Maks.'], 'repeat(4, minmax(0, 1fr))'],
      ['vand', 'Vandmængde', ['Lav', 'Mellem', 'Høj', 'Extreme'], 'repeat(4, minmax(0, 1fr))'],
      ['rute', 'Rute', ['Standard', 'Hurtig', 'Tilpasset'], 'repeat(3, minmax(0, 1fr))'],
      ['gange', 'Antal gange', ['1×', '2×'], 'repeat(2, minmax(0, 1fr))']
    ];
    // Hierarki: Type er hovedvalget (56 høj, 20 px label); resten er finjustering (44 høj, 15 px grå label). Fuld bredde.
    const opts = groups.map(([key, k, labels, cols], gi) => ({
      k, cols, ks: gi === 0 ? 20 : 15, kw: gi === 0 ? 800 : 600, kc: gi === 0 ? '#17171A' : '#5F5E5A', bh: gi === 0 ? 56 : 44, bf: gi === 0 ? 17 : 16,
      o: labels.map((l, i) => {
        const on = this.state.o[key] === i;
        return { l, on: on ? 'true' : 'false', bg: on ? '#17171A' : 'transparent', fg: on ? '#F7F6F3' : '#17171A', sh: 'none',
          pick: () => this.setState({ o: { ...this.state.o, [key]: i } }) };
      })
    }));
    // Basen (produktets baseDisclosure i robot-control-panel.js): fold-ud fra headeren med de base-handlinger,
    // basen tilbyder lige nu. Oplader: Tøm støvbeholder, Vask moppe, Tør moppe. Vasker: Stop moppevask (rav) + Tøm støvbeholder.
    // Kør til basen ligger som transporthandling i heroen under rengøring (med bekræftelse "Kør til basen?").
    const baseMode = this.props.base || 'lukket';
    const baseOpen = this.state.baseOpen !== undefined ? this.state.baseOpen : baseMode !== 'lukket';
    const I = { empty: 'M5 7h14l-1.5 12h-11zM9 7V4h6v3', wash: 'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z', dry: 'M4 12h10M4 8h14M4 16h8M18 14l3 3-3 3' };
    const plain = { bg: '#FFFFFF', fg: '#17171A', sh: 'inset 0 0 0 1.5px rgba(23,23,26,.14)' };
    const dock = baseMode === 'vasker'
      ? [{ l: 'Stop moppevask', i: I.wash, bg: '#FBE7B9', fg: '#4A3205', sh: 'inset 0 0 0 2px #E2B04A' }, { l: 'Tøm støvbeholder', i: I.empty, ...plain }]
      : [{ l: 'Tøm støvbeholder', i: I.empty, ...plain }, { l: 'Vask moppe', i: I.wash, ...plain }, { l: 'Tør moppe', i: I.dry, ...plain }];
    const events = [
      { t: '9. nov. · 14.18', h: 'Senest afsluttet', d: 'Stueplan (2025) · 0,2 m² · 1,1 min', again: false },
      { t: '8. nov. · 11.22', h: 'Start anmodet', d: 'Stueplan (2025) · 6 områder · 2 gange', again: true },
      { t: '8. nov. · 11.22', h: 'Senest startet', d: 'Robotten bekræftede start', again: false }
    ];
    const care = [
      { k: 'Hovedbørste', v: '142 t', p: 47, c: '#17171A' }, { k: 'Sidebørste', v: '64 t', p: 32, c: '#17171A' },
      { k: 'Filter', v: '12 t', p: 8, c: '#B0262A' }, { k: 'Sensorer', v: '6 t', p: 4, c: '#B0262A' }
    ];
    const full = true;
    return {
      nb: nbOf(s.nb), fresh: s.fresh,
      heroH, heroPad: heroS ? 24 : 32, heroTitle: heroS ? 40 : 56,
      s, rings, rooms, roomCount: n, opts, events, care, dock, baseOpen, baseAria: baseOpen ? 'true' : 'false', baseChev: baseOpen ? 180 : 0, baseBtnBg: baseOpen ? '#FFFFFF' : 'transparent',
      baseLabel: baseMode === 'vasker' ? 'Basen · vasker moppen' : 'Basen', toggleBase: () => this.setState({ baseOpen: !baseOpen }), full, mini: false,
      all: () => this.setState({ rooms: Object.fromEntries(Object.keys(this.state.rooms).map((k) => [k, 1])) })
    };
  }
}
</script>
</body>
</html>
