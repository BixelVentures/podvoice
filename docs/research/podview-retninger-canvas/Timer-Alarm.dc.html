<!doctype html>
<html lang="da">
<head><meta charset="utf-8"><title>Timer · færdig, fuldskærm</title><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.p{animation:p 1.6s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.in{animation:in .36s cubic-bezier(.2,.9,.3,1) both}
@keyframes in{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.b{border:0;cursor:pointer;transition:transform .12s ease}.b:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){.p,.in{animation:none}}
</style>
</helmet>
<div class="in" role="alertdialog" aria-labelledby="ta" style="width: 1280px; height: 800px; position: relative; overflow: hidden; background: #17171A; color: #F7F6F3; font-family: 'Schibsted Grotesk', system-ui, sans-serif">
  <div style="position: absolute; inset: 0" aria-hidden="true">
    <sc-for list="{{mat}}" as="d" hint-placeholder-count="600"><i class="p" style="position: absolute; left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.w}}px; border-radius: 1px; background: #FF7A5C; animation-delay: {{d.dl}}ms; display: block"></i></sc-for>
  </div>
  <i style="position: absolute; inset: 0; background: radial-gradient(60% 70% at 50% 46%, rgba(23,23,26,.92) 30%, rgba(23,23,26,.2) 100%); display: block"></i>
  <div style="position: absolute; left: 0; right: 0; top: 150px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
    <span style="font-size: 20px; font-weight: 600; color: #BDBBB5">Timer · 10 min · ringede 14.39</span>
    <span id="ta" style="font-size: 88px; line-height: 1; font-weight: 800; letter-spacing: -0.04em; color: #FF7A5C">Timeren er færdig</span>
    <span style="font: 500 64px/1 'IBM Plex Mono', monospace; letter-spacing: -0.04em; margin-top: 8px">0:00</span>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 120px; display: flex; justify-content: center; gap: 16px">
    <button class="b" style="height: 88px; min-width: 280px; padding: 0 40px; border-radius: 999px; background: #FF7A5C; color: #17171A; font: 800 26px 'Schibsted Grotesk', sans-serif">Stop</button>
    <button class="b" style="height: 88px; min-width: 200px; padding: 0 32px; border-radius: 999px; background: #2B2B30; color: #F7F6F3; font: 700 24px 'Schibsted Grotesk', sans-serif">+1 min</button>
  </div>
  <button class="b" style="position: absolute; left: 50%; bottom: 48px; transform: translateX(-50%); height: 44px; padding: 0 20px; border-radius: 999px; background: transparent; color: #BDBBB5; font: 600 16px 'Schibsted Grotesk', sans-serif">Luk visning</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    // Produktets færdig-visning (timer-notice.js): "Timeren er færdig", Stop, +1 min, Luk visning.
    // Fuldskærm over alt, også Foto-Ro. Det orange materiale stråler fra midten og blinker med alarmen.
    // Ind: 360 ms skala 1.04 → 1 og fade. Ud ved Stop: samme baglæns. Luk visning stopper ikke alarmen (som i produktet).
    const mat = [];
    for (let y = 6; y < 800; y += 12) for (let x = 6; x < 1280; x += 12) {
      const d = Math.hypot(x - 640, (y - 370) * 1.3);
      const band = Math.abs(Math.sin(d / 34));
      const w = Math.max(0, 7 - Math.abs(d - 360) * 0.012) * band;
      if (w > 1) mat.push({ x: (x - w / 2).toFixed(1), y: (y - w / 2).toFixed(1), w: w.toFixed(1), dl: Math.round(d * 2) });
    }
    return { mat };
  }
}
</script>
</body>
</html>
