<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Topbar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#17171A;text-decoration:none}
.tb-key{transition:transform .12s ease, box-shadow .12s ease}
.tb-key:active{transform:translateY(2px) scale(.98);box-shadow:0 0 0 rgba(0,0,0,0)!important}
.tb-dot{position:absolute;border-radius:50%;background:#17171A}
@keyframes tbin{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width: 1280px; height: 72px; box-sizing: border-box; padding: 0 28px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: #E7E5E0; color: #17171A; font-family: 'Schibsted Grotesk', system-ui, sans-serif">
  <div style="display: flex; align-items: center; gap: 14px">
    <sc-if value="{{back}}" hint-placeholder-val="{{ false }}">
      <a href="Main.dc.html" class="tb-key" aria-label="Tilbage til overblik" style="width: 44px; height: 44px; border-radius: 14px; background: #F7F6F3; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 rgba(23,23,26,.10)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </a>
    </sc-if>
    <sc-if value="{{home}}" hint-placeholder-val="{{ true }}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6 8 6v9h-5v-6H9v6H4z"/></svg>
    </sc-if>
    <span style="font-size: 22px; font-weight: 600; letter-spacing: -0.01em">{{heading}}</span>
  </div>
  <a href="A-Stemme.dc.html" class="tb-key" aria-label="Svar og historik" style="height: 48px; padding: 0 22px 0 16px; border-radius: 24px; background: #F7F6F3; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 0 rgba(23,23,26,.10), inset 0 0 0 1px rgba(23,23,26,.06)">
    <span style="position: relative; width: 46px; height: 22px; display: block" aria-hidden="true">
      <sc-for list="{{grille}}" as="d" hint-placeholder-count="21">
        <i class="tb-dot" style="left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.w}}px"></i>
      </sc-for>
    </span>
    <span style="font-size: 18px; font-weight: 600">Svar</span>
  </a>
  <div style="display: flex; justify-content: flex-end; align-items: center; gap: 28px">
    <sc-if value="{{alert}}" hint-placeholder-val="{{ false }}">
    <a href="{{alertHref}}" class="tb-key" aria-label="{{alert}}. Gå til {{alertDomain}}" style="height: 44px; padding: 0 14px 0 10px; border-radius: 22px; background: #F8DCDC; color: #5E1416; display: flex; align-items: center; gap: 8px; box-shadow: inset 0 0 0 1.5px rgba(176,38,42,.35); animation: tbin .32s cubic-bezier(.2,.9,.3,1) both">
      <span style="width: 22px; height: 22px; border-radius: 50%; background: #B0262A; color: #FFF; display: flex; align-items: center; justify-content: center; font: 800 13px 'Schibsted Grotesk', sans-serif">!</span>
      <span style="font-size: 15px; font-weight: 700; white-space: nowrap">{{alert}}</span>
    </a>
    </sc-if>
    <sc-if value="{{timer}}" hint-placeholder-val="{{ false }}">
    <a href="A-Timer.dc.html" class="tb-key" aria-label="Timer {{timer}}, {{timerName}}" style="height: 44px; padding: 0 14px 0 10px; border-radius: 22px; background: #17171A; color: #F7F6F3; display: flex; align-items: center; gap: 10px; animation: tbin .32s cubic-bezier(.2,.9,.3,1) both">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#2E2E33" stroke-width="3"/><circle cx="12" cy="12" r="9" fill="none" stroke="#FF7A5C" stroke-width="3" stroke-linecap="round" stroke-dasharray="{{timerDash}}" transform="rotate(-90 12 12)"/></svg>
      <span style="font: 500 18px 'IBM Plex Mono', monospace; letter-spacing: -0.03em">{{timer}}</span>
    </a>
    </sc-if>
    <sc-if value="{{showWeather}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M7 19h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.5A3.3 3.3 0 0 0 7 19z" fill="#E7E5E0"/></svg>
      <div style="display: flex; flex-direction: column; line-height: 1.1">
        <span style="font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums">{{temp}}</span>
        <span style="font-size: 15px; color: #5F5E5A">{{cond}}</span>
      </div>
    </div>
    </sc-if>
    <div style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 20px; font-weight: 500; letter-spacing: -0.02em">{{clock}}</span>
      <span style="font-size: 15px; color: #5F5E5A">Man. 9. nov.</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"heading":{"editor":null,"default":"Hjem"},"back":{"editor":"boolean","default":false},"noWeather":{"editor":"boolean","default":false},"timer":{"editor":"text","default":""},"alert":{"editor":"text","default":""},"alertHref":{"editor":"text","default":"A-Robot.dc.html"},"alertDomain":{"editor":"text","default":"Robot"},"timerName":{"editor":"text","default":""},"$preview":{"width":1280,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const back = !!this.props.back;
    const grille = [];
    // Hvile: tre rækker, rolig og ens; kanten aftager let som en højttalergrille.
    for (let j = 0; j < 3; j++) {
      for (let i = 0; i < 7; i++) {
        const edge = (i === 0 || i === 6) ? 0.7 : 1;
        const w = 4.2 * edge;
        grille.push({ x: (i * 7 + 3.5 - w / 2).toFixed(1), y: (j * 7.5 + 3.5 - w / 2).toFixed(1), w: w.toFixed(1) });
      }
    }
    const green = this.props.scenario === 'green';
    return {
      back, home: !back, heading: this.props.heading ?? 'Hjem', grille, showWeather: !this.props.noWeather,
      // Kørende timer vises som chip i topbaren på alle andre sider end Timer (forslag, ny funktion).
      // Hændelse fra et andet domæne (fx robotfejl mens man står på Tesla): rødt mærke ved uret; tryk går til domænet.
      alert: this.props.alert || '', alertHref: this.props.alertHref || 'A-Robot.dc.html', alertDomain: this.props.alertDomain || 'Robot',
      timer: this.props.timer || '', timerName: this.props.timerName || '', timerDash: (2 * Math.PI * 9 * 0.97).toFixed(1) + ' ' + (2 * Math.PI * 9).toFixed(1),
      temp: '8°', cond: 'Skyet', clock: '14.30'
    };
  }
}
</script>
</body>
</html>
