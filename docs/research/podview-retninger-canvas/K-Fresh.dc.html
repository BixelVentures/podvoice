<!doctype html>
<html lang="da">
<head><meta charset="utf-8"><title>Friskhedsmærke</title><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<span style="height: 32px; padding: 0 12px; border-radius: 999px; background: {{bg}}; box-shadow: {{sh}}; display: inline-flex; align-items: center; gap: 8px; font: 600 15px 'Schibsted Grotesk', sans-serif; color: #3F3E3B; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3F3E3B" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>{{text}}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"solid":{"editor":"enum","default":"false","options":["true","false"]},"text":{"editor":"text","default":"Opdateret 9. nov., 11.02"},"$preview":{"width":260,"height":32}}'>
class Component extends DCLogic {
  renderVals() {
    // Friskhedsregel: data under 30 min vises uden mærke. Ældre data får tidspunktet, aldrig ordet "Sidst kendt".
    const solid = String(this.props.solid) === 'true';
    return { text: this.props.text || 'Opdateret 9. nov., 11.02', bg: solid ? '#F7F6F3' : 'rgba(23,23,26,.08)', sh: solid ? '0 4px 12px -6px rgba(23,23,26,.35)' : 'none' };
  }
}
</script>
</body>
</html>
