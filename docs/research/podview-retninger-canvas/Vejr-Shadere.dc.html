<!doctype html>
<html lang="da">
<head><meta charset="utf-8"><title>Vejr · materiale pr. vejrtype</title><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
.sq{position:absolute;border-radius:1px;background:#1F55F0}
.drift{animation:drift 6s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.fall{animation:fall 1.2s linear infinite}@keyframes fall{from{transform:translateY(-10px);opacity:0}30%{opacity:1}to{transform:translateY(18px);opacity:0}}
.slow{animation:fall 3.2s linear infinite}
.glow{animation:glow 3s ease-in-out infinite}@keyframes glow{0%,100%{opacity:.7;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
.flash{animation:flash 4s steps(1) infinite}@keyframes flash{0%,88%,100%{opacity:.35}90%,94%{opacity:1}}
.mist{animation:mist 7s ease-in-out infinite alternate}@keyframes mist{from{opacity:.35}to{opacity:.85}}
@media (prefers-reduced-motion: reduce){.drift,.fall,.slow,.glow,.flash,.mist{animation:none}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; background: #E9E7E2; font-family: 'Schibsted Grotesk', system-ui, sans-serif; color: #17171A; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 26px; font-weight: 800">Vejrmateriale følger det faktiske vejr</span><span style="font-size: 15px; color: #5F5E5A">Samme blå og samme prikker · formen og bevægelsen skifter med Met.no-tilstanden</span></div>
  <div style="flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 16px">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
      <div style="position: relative; border-radius: 24px; background: #DDE6FB; overflow: hidden">
        <div class="{{t.anim}}" style="position: absolute; right: 0; top: 0; width: 380px; height: 300px; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 120px); mask-image: linear-gradient(90deg, transparent 0, #000 120px)" aria-hidden="true">
          <sc-for list="{{t.d}}" as="d" hint-placeholder-count="200"><i class="sq" style="left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.w}}px; animation-delay: {{d.dl}}ms"></i></sc-for>
        </div>
        <div style="position: absolute; left: 24px; bottom: 20px; display: flex; flex-direction: column"><span style="font-size: 22px; font-weight: 800">{{t.n}}</span><span style="font-size: 15px; color: #3E4660">{{t.m}}</span></div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const f = (n) => n.toFixed(1);
    const field = (fn, step = 9) => { const o = []; for (let y = 4.5; y < 300; y += step) for (let x = 4.5; x < 380; x += step) { const w = fn(x, y); if (w > 0.8) o.push({ x: f(x - w / 2), y: f(y - w / 2), w: f(w), dl: Math.round((x * 7 + y * 13) % 1200) }); } return o; };
    const cloud = (x, y) => { let d = 999; for (const [cx, cy, r] of [[200, 120, 52], [262, 92, 70], [326, 128, 46]]) d = Math.min(d, Math.hypot(x - cx, y - cy) - r); if (x > 150 && x < 372 && y > 120 && y < 176) d = Math.min(d, -1); return d < 4 ? 0 : Math.max(0, 7 - d * 0.04) * Math.min(1, (300 - y) / 90); };
    const tiles = [
      { n: 'Sol', m: 'Klart · stråler roligt', anim: 'glow', d: field((x, y) => { const d = Math.hypot(x - 270, y - 110); const ring = Math.abs(Math.sin(d / 18)); return d < 50 ? 6.5 : Math.max(0, 6 - d * 0.025) * ring; }) },
      { n: 'Skyet', m: 'Skyen driver langsomt', anim: 'drift', d: field(cloud) },
      { n: 'Regn', m: 'Sky + faldende dråber', anim: '', d: [...field((x, y) => cloud(x, y + 40)), ...field((x, y) => (y > 170 && (x + y * 0.3) % 36 < 4 && x > 170) ? 3.4 : 0, 9).map((p) => ({ ...p, rain: true }))] },
      { n: 'Sne', m: 'Store, langsomme flager', anim: '', d: field((x, y) => (y > 40 && ((x * 13 + y * 7) % 53) < 6) ? 4.5 : 0, 12) },
      { n: 'Tåge', m: 'Vandrette bånd, pulserer svagt', anim: 'mist', d: field((x, y) => (Math.floor(y / 30) % 2 === 0) ? Math.max(0, 5 - Math.abs((y % 30) - 8) * 0.8) : 0) },
      { n: 'Torden', m: 'Mørk sky + kort lyn', anim: 'flash', d: field((x, y) => { const c = cloud(x, y + 30); const bolt = Math.abs(x - (250 - (y - 180) * 0.4 + (y > 230 ? 30 : 0))) < 6 && y > 170 && y < 290 ? 6 : 0; return Math.max(c, bolt); }) }
    ];
    return { tiles };
  }
}
</script>
</body>
</html>
