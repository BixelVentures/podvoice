<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Opskrifter · udforsk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=Fraunces:opsz,wght@9..144,600;9..144,800&amp;display=swap">
<style>
body{margin:0}
a{color:#17171A;text-decoration:none}
.btn{border:0;cursor:pointer;transition:transform .12s ease, filter .12s ease}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn:focus-visible{outline:2px solid #17171A;outline-offset:3px}
.cf{position:absolute;left:50%;top:0;width:720px;height:460px;margin-left:-360px;border-radius:22px;overflow:hidden;background:#C9B79F;transition:transform .6s cubic-bezier(.2,.9,.3,1), opacity .5s ease, filter .5s ease;transform-style:preserve-3d}
.cf img{width:100%;height:100%;object-fit:cover;display:block}
.info{transition:opacity .25s ease}
@media (prefers-reduced-motion: reduce){.cf{transition:none}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; background: #E9E7E2; color: #17171A; font-family: 'Schibsted Grotesk', system-ui, sans-serif; position: relative; overflow: hidden">
  <dc-import name="A-Topbar" heading="Opskrifter" back="{{ true }}" scenario="green" hint-size="1280px,72px"></dc-import>
  <div style="position: absolute; left: 24px; right: 24px; top: 88px; height: 52px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #DCDAD4">
      <a href="A-Opskrifter.dc.html" class="btn" style="height: 44px; padding: 0 20px; border-radius: 999px; display: flex; align-items: center; font: 600 16px 'Schibsted Grotesk', sans-serif">Katalog</a>
      <span style="height: 44px; padding: 0 20px; border-radius: 999px; background: #17171A; color: #F7F6F3; display: flex; align-items: center; font: 600 16px 'Schibsted Grotesk', sans-serif">Udforsk</span>
    </div>
    <span style="font: 500 16px 'Schibsted Grotesk', sans-serif; color: #5F5E5A">{{pos}} af {{total}}</span>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 152px; height: 470px; perspective: 1600px" aria-roledescription="karrusel">
    <sc-for list="{{covers}}" as="c" hint-placeholder-count="5">
      <a href="A-Opskrift.dc.html" class="cf" aria-hidden="{{c.hid}}" aria-label="{{c.t}}" onClick="{{c.go}}" style="transform: translateX({{c.x}}px) translateZ({{c.z}}px) rotateY({{c.r}}deg); opacity: {{c.o}}; z-index: {{c.zi}}; filter: brightness({{c.b}}); box-shadow: {{c.sh}}">
        <img src="{{c.img}}" alt="">
        <sc-if value="{{c.active}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 16px; top: 16px; height: 32px; padding: 0 14px; border-radius: 999px; background: #F7F6F3; display: flex; align-items: center; font: 700 15px 'Schibsted Grotesk', sans-serif">I gang · trin 2 af 5</span></sc-if>
      </a>
    </sc-for>
  </div>

  <div class="info" style="position: absolute; left: 0; right: 0; top: 636px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
    <span style="font: 600 15px 'Schibsted Grotesk', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #7A4A22; height: 20px">{{cur.c}}</span>
    <span style="font: 800 36px/44px 'Fraunces', Georgia, serif; letter-spacing: -0.02em; height: 44px; max-width: 900px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{cur.t}}</span>
    <span style="font-size: 17px; line-height: 24px; color: #5F5E5A; height: 24px">{{cur.m}}</span>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 752px; display: flex; justify-content: center; gap: 8px" aria-hidden="true"><sc-for list="{{dots}}" as="d" hint-placeholder-count="9"><i style="width: {{d.w}}px; height: 6px; border-radius: 3px; background: {{d.c}}; display: block; transition: width .3s ease"></i></sc-for></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    // Udforsk som moderne Cover Flow i liggende format: det valgte billede står fladt og stort (560×360),
    // naboerne vinkles 55° til siderne og falder tilbage. Swipe vandret; tryk på en nabo vælger den, tryk på midten åbner opskriften. Ingen knapbjælke, så billederne får højden (720×460).
    // Titel og info står fast under det valgte billede (kategori 20, titel 44, meta 24), så intet hopper.
    // Alle billeder og data er fra HA Green (api/recipes, recipe.image).
    const R = [
      { t: 'Burgerboller', c: 'Brød og bagværk', m: '15 stk. · 2–3 timer hævning', img: '/_blob/aea2f371059ce6329c9ddf1518ef4f68' },
      { t: 'Kylling i karry', c: 'Aftensmad', m: '4 personer · 45 min. i alt', img: '/_blob/446c15015f8b510807a4d60ce1219a99' },
      { t: 'Protein bagels med hytteost', c: 'Brød og bagværk', m: '4 bagels · ingen hævetid', img: '/_blob/79ee96ed4833dd4bf138089192f6ce60' },
      { t: 'Nem chokoladekage i bradepande', c: 'Desserter', m: '1 kage · 120 min.', img: '/_blob/37ebec566f2c94a27014f2c91f556039' },
      { t: 'Scones med hytteost og blåbær', c: 'Brød og bagværk', m: '9 stk. · 30 min. i alt', img: '/_blob/85550edf710012597ef8a830ccf3dfcc' },
      { t: 'Pizzaboller med hytteost', c: 'Madpakker', m: '8–10 stk. · 35 min. i alt', img: '/_blob/610f9440135805c410ede74dfe79a38e' },
      { t: 'Chokoladegranola', c: 'Morgenmad', m: '1 stort glas · 20–30 min. bagetid', img: '/_blob/5019153462fa1d16bd03e804b1ffd218' },
      { t: 'Koldhævede hytteostboller', c: 'Brød og bagværk', m: '15 stk. · hæver natten over', img: '/_blob/adfaa46c293017c790075a0f01aa4ec4' },
      { t: 'Hjemmelavede müslibarer', c: 'Madpakker', m: 'Ca. 15 stk. · 1 time i alt', img: '/_blob/c0dfbc2fca630c92a7f9ce0ce6ea9dfe' }
    ];
    const i = this.state.i;
    const covers = R.map((r, k) => {
      const d = k - i, a = Math.abs(d), sgn = Math.sign(d);
      return { ...r, active: k === 0, x: d === 0 ? 0 : sgn * (430 + (a - 1) * 110), z: d === 0 ? 0 : -260 - (a - 1) * 60, r: d === 0 ? 0 : -sgn * 55,
        o: a > 3 ? 0 : 1, zi: 20 - a, b: d === 0 ? 1 : 0.82, hid: d === 0 ? 'false' : 'true',
        sh: d === 0 ? '0 40px 70px -30px rgba(23,23,26,.6)' : '0 20px 40px -24px rgba(23,23,26,.5)',
        go: (e) => { if (d !== 0) { e.preventDefault(); this.setState({ i: k }); } } };
    });
    const dots = R.map((_, k) => ({ w: k === i ? 28 : 8, c: k === i ? '#17171A' : 'rgba(23,23,26,.22)' }));
    return { covers, dots, cur: R[i], pos: i + 1, total: R.length,
      prev: () => this.setState({ i: Math.max(0, i - 1) }), next: () => this.setState({ i: Math.min(R.length - 1, i + 1) }) };
  }
}
</script>
</body>
</html>
