<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Robot · Grille</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.cd{position:relative;overflow:hidden;border-radius:26px;background:#F7F6F3;box-shadow:inset 0 0 0 1px rgba(23,23,26,.06), 0 2px 0 rgba(23,23,26,.05)}
.btn{border:0;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease, background .2s ease}
.btn:active{transform:translateY(3px);box-shadow:none!important}
.btn:focus-visible{outline:2px solid #EF5B25;outline-offset:3px}
.dt{position:absolute;border-radius:50%}
.ds{position:absolute;border-radius:2px}
.an-in{animation:inward 2.6s ease-in-out infinite}
.an-wet{animation:wet 2.2s ease-in-out infinite}
.frozen .an-in,.frozen .an-wet{animation-play-state:paused}
@keyframes inward{0%,100%{transform:scale(.5);opacity:.5}50%{transform:scale(1);opacity:1}}
@keyframes wet{0%,100%{transform:translateX(0);opacity:.35}50%{transform:translateX(4px);opacity:1}}
@media (prefers-reduced-motion: reduce){.an-in,.an-wet{animation:none}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; background: #E7E5E0; color: #17171A; font-family: 'Schibsted Grotesk', system-ui, sans-serif; position: relative">
  <dc-import name="A-Topbar" heading="Robotstøvsuger" back="{{ true }}" hint-size="1280px,72px"></dc-import>
  <div style="position: absolute; left: 24px; top: 88px; display: flex; gap: 16px">
    <div style="width: 844px; display: flex; flex-direction: column; gap: 16px">

      <div class="cd {{frozenCls}}" style="height: 456px; padding: 30px 32px; background: #F6D3DE; box-sizing: border-box; display: flex; flex-direction: column">
        <div style="position: absolute; right: 0; top: 0; width: 400px; height: 300px" aria-hidden="true">
          <sc-for list="{{air}}" as="d" hint-placeholder-count="300">
            <i class="dt an-in" style="left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.w}}px; background: #B23A62; animation-delay: {{d.dl}}ms"></i>
          </sc-for>
          <sc-for list="{{water}}" as="d" hint-placeholder-count="60">
            <i class="ds an-wet" style="left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: 3px; background: #6E1F3B; animation-delay: {{d.dl}}ms"></i>
          </sc-for>
          <svg style="position: absolute; left: 156px; top: 106px" width="88" height="88" viewBox="0 0 88 88" aria-hidden="true"><circle cx="44" cy="44" r="40" fill="#F7F6F3" stroke="#17171A" stroke-width="2.5"/><circle cx="44" cy="44" r="25" fill="none" stroke="#17171A" stroke-width="1.8"/><rect x="36" y="10" width="16" height="8" rx="4" fill="#17171A"/><circle cx="44" cy="44" r="6" fill="#B23A62"/></svg>
        </div>
        <span style="font: 500 13px 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: #5F5E5A">Støvsug og vask</span>
        <span style="margin-top: 10px; font-size: 44px; line-height: 1.05; font-weight: 700; letter-spacing: -0.03em; color: #9C2F53">{{statusTitle}}</span>
        <span style="margin-top: 4px; font-size: 44px; line-height: 1.05; font-weight: 700; letter-spacing: -0.03em">Køkkenet</span>
        <div style="margin-top: 22px; display: flex; gap: 28px">
          <div style="display: flex; flex-direction: column"><span style="font: 500 26px 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: -0.03em">76 %</span><span style="font-size: 14px; color: #5F5E5A">Batteri</span></div>
          <div style="display: flex; flex-direction: column"><span style="font: 500 26px 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: -0.03em">12,5 m²</span><span style="font-size: 14px; color: #5F5E5A">Rengjort</span></div>
          <div style="display: flex; flex-direction: column"><span style="font: 500 26px 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: -0.03em">10 min</span><span style="font-size: 14px; color: #5F5E5A">Tid</span></div>
        </div>
        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; align-items: center; gap: 14px">
            <div style="flex: 1; display: grid; grid-template-columns: repeat(50, minmax(0, 1fr)); gap: 3px" role="img" aria-label="38 procent færdig">
              <sc-for list="{{seg}}" as="s" hint-placeholder-count="50">
                <i style="height: 10px; border-radius: 2px; background: {{s}}; display: block"></i>
              </sc-for>
            </div>
            <span style="font: 500 14px 'IBM Plex Mono', ui-monospace, monospace">38 % færdig</span>
          </div>
          <div style="display: flex; gap: 12px">
            <button class="btn" onClick="{{toggle}}" style="height: 60px; padding: 0 28px; border-radius: 18px; background: #17171A; color: #F7F6F3; box-shadow: 0 4px 0 #000; display: flex; align-items: center; gap: 10px; font: 600 18px 'Schibsted Grotesk', system-ui, sans-serif">
              <sc-if value="{{running}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="#F7F6F3" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></sc-if>
              <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="#F7F6F3" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg></sc-if>
              {{toggleLabel}}
            </button>
            <button class="btn" style="height: 60px; padding: 0 24px; border-radius: 18px; background: transparent; color: #B0262A; box-shadow: inset 0 0 0 1.5px rgba(176,38,42,.45); display: flex; align-items: center; gap: 10px; font: 600 18px 'Schibsted Grotesk', system-ui, sans-serif">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B0262A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
              Afslut rengøring
            </button>
            <button class="btn" style="margin-left: auto; height: 60px; padding: 0 22px; border-radius: 18px; background: #ECEAE5; color: #17171A; box-shadow: 0 4px 0 rgba(23,23,26,.14); display: flex; align-items: center; gap: 10px; font: 600 18px 'Schibsted Grotesk', system-ui, sans-serif">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6 8 6v9H4z"/></svg>
              Base
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; height: 224px">
        <div class="cd" style="padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 20px; font-weight: 700">Denne tur</span>
          <span style="font-size: 15px; color: #5F5E5A">Stueplan</span>
          <div style="margin-top: auto; display: flex; gap: 10px; flex-wrap: wrap">
            <button class="btn" aria-pressed="true" style="height: 56px; padding: 0 20px; border-radius: 16px; background: #17171A; color: #F7F6F3; box-shadow: 0 3px 0 #000; display: flex; align-items: center; gap: 10px; font: 600 16px 'Schibsted Grotesk', system-ui, sans-serif">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7F6F3" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1-3 4-3 7h3"/></svg>
              Køkkenet
            </button>
          </div>
        </div>
        <div class="cd" style="padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 20px; font-weight: 700">Rengøringsvalg</span>
          <span style="font-size: 15px; color: #5F5E5A">Gælder næste tur</span>
          <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 6px; border-radius: 20px; background: #E9E7E2; box-shadow: inset 0 1px 2px rgba(23,23,26,.10)" role="radiogroup" aria-label="Type">
            <sc-for list="{{types}}" as="t" hint-placeholder-count="3">
              <button class="btn" role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="height: 76px; border-radius: 15px; background: {{t.bg}}; color: {{t.fg}}; box-shadow: {{t.sh}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 600 15px 'Schibsted Grotesk', system-ui, sans-serif">
                <span style="display: flex; gap: 3px; height: 14px; align-items: center" aria-hidden="true">
                  <sc-for list="{{t.glyph}}" as="g" hint-placeholder-count="4">
                    <i style="width: {{g.w}}px; height: {{g.h}}px; border-radius: 2px; background: {{t.fg}}; display: block"></i>
                  </sc-for>
                </span>
                {{t.label}}
              </button>
            </sc-for>
          </div>
        </div>
      </div>
    </div>
    <dc-import name="A-Player" hint-size="372px,696px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { running: true, type: 'begge' }; }
  renderVals() {
    const f = (n) => n.toFixed(1);
    const cx = 200, cy = 150;
    const air = [], water = [];
    // Luftlag: indadgående buer om robotkernen.
    for (let j = 0; j < 30; j++) {
      for (let i = 0; i < 40; i++) {
        const x = i * 10 + 5, y = j * 10 + 5;
        const r = Math.hypot(x - cx, y - cy);
        if (r < 58 || r > 200) continue;
        if (Math.abs(y - cy) < 26 && r > 70) continue;
        const a = Math.atan2(y - cy, x - cx);
        const arc = Math.sin(a * 5 + r * 0.05);
        if (arc < 0) continue;
        const w = (1.6 + arc * 3.8) * Math.min(1, (200 - r) / 60) * Math.min(1, x / 70);
        if (w > 0.8) air.push({ x: f(x - w / 2), y: f(y - w / 2), w: f(w), dl: Math.round(-(r / 200) * 2600) });
      }
    }
    // Vandlag: vandrette celler i et bånd gennem kernen (kun fordi typen er støvsug og vask).
    for (let j = 0; j < 4; j++) {
      for (let i = 0; i < 26; i++) {
        const x = i * 15 + 6, y = cy - 18 + j * 12;
        const r = Math.abs(x - cx);
        if (r < 62 || x < 60) continue;
        const w = Math.max(3, 11 - r * 0.04);
        water.push({ x: f(x), y: f(y), w: f(w), dl: Math.round((x < cx ? -1 : 1) * r * 8) });
      }
    }
    const seg = [];
    for (let k = 0; k < 50; k++) seg.push(k < 19 ? '#17171A' : 'rgba(23,23,26,.13)');
    const defs = [
      { id: 'stoevsug', label: 'Støvsug', glyph: [{ w: 4, h: 4 }, { w: 4, h: 8 }, { w: 4, h: 12 }, { w: 4, h: 8 }] },
      { id: 'vask', label: 'Vask', glyph: [{ w: 10, h: 3 }, { w: 10, h: 3 }] },
      { id: 'begge', label: 'Begge', glyph: [{ w: 4, h: 8 }, { w: 4, h: 12 }, { w: 10, h: 3 }] }
    ];
    const types = defs.map((d) => {
      const on = this.state.type === d.id;
      return {
        ...d, on: on ? 'true' : 'false',
        bg: on ? '#17171A' : '#F7F6F3', fg: on ? '#F7F6F3' : '#17171A',
        sh: on ? '0 3px 0 #000' : '0 3px 0 rgba(23,23,26,.12)',
        pick: () => this.setState({ type: d.id })
      };
    });
    const running = this.state.running;
    return {
      air, water, seg, types, running, paused: !running,
      frozenCls: running ? '' : 'frozen',
      statusTitle: running ? 'Rengør' : 'På pause',
      toggleLabel: running ? 'Pause' : 'Fortsæt',
      toggle: () => this.setState({ running: !this.state.running })
    };
  }
}
</script>
</body>
</html>
