\"cd\" style=\"padding: 20px 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px\">\n          \u003cdiv style=\"display: flex; justify-content: space-between; align-items: center\">\n            \u003cdiv style=\"display: flex; flex-direction: column\">\u003cspan style=\"font-size: 18px; font-weight: 700\">Klima\u003c/span>\u003cspan style=\"font-size: 13px; color: #5F5E5A\">{{climateLabel}}\u003c/span>\u003c/div>\n            \u003cbutton class=\"btn\" role=\"switch\" aria-checked=\"{{climateAria}}\" aria-label=\"Klima\" onClick=\"{{toggle}}\" style=\"position: relative; width: 80px; height: 44px; border-radius: 999px; background: {{swBg}}\">\n              \u003cspan class=\"knob\" style=\"position: absolute; left: 4px; top: 4px; width: 34px; height: 34px; border-radius: 10px; background: #F7F6F3; box-shadow: 0 3px 0 rgba(23,23,26,.25); transform: translateX({{knobX}}px)\">\u003c/span>\n            \u003c/button>\n          \u003c/div>\n          \u003cdiv style=\"display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 6px; padding: 3px; border-radius: 15px; background: #E9E7E2\">\n            \u003cbutton class=\"btn\" aria-label=\"Sænk temperatur\" onClick=\"{{down}}\" style=\"height: 44px; border-radius: 999px; background: #F7F6F3; font: 500 20px 'IBM Plex Mono', monospace\">−\u003c/button>\n            \u003cspan style=\"text-align: center; font: 500 24px 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: -0.04em; color: {{tempC}}\">{{temp}} °C\u003c/span>\n            \u003cbutton class=\"btn\" aria-label=\"Hæv temperatur\" onClick=\"{{up}}\" style=\"height: 44px; border-radius: 999px; background: #F7F6F3; font: 500 20px 'IBM Plex Mono', monospace\">+\u003c/button>\n          \u003c/div>\n          \u003csc-for list=\"{{seats}}\" as=\"r\" hint-placeholder-count=\"2\">\n            \u003cdiv style=\"display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 8px\">\n              \u003cspa dsAt, locked, climate,\n    // temperatureC, defrost, driverSeat, passengerSeat, trunk. Modellen vækker aldrig bilen.\n    const S = {\n      ukendt: {\n        surface: '#E7EEE9', mode: 'Ældste observation 8. nov. · 17.09', title: 'Sidst kendt: Låst', titleC: '#3F3E3B', sub: '365 km rækkevidde · kabine 12,2 °C', big: '94',\n        bigC: '#5F5E5A', level: 0.94, fill: '#8C918D', empty: 'rgba(23,23,26,.08)', flow: false, warm: false,\n        lock: 'Sidst kendt: Låst', carLabel: 'Bil sidst kendt 94 procent', notice: 'Bilen sover. PodView vækker den aldrig, så værdierne er sidst kendte.', metrics: []\n      },\n      lader: {\n        surface: '#CDE8D8', mode: 'Tilsluttet', title: 'Lader', titleC: '#17442F', sub: '312 km rækkevidde', big: '72',\n        bigC: '#17442F', level: 0.72, fill: '#2F7A55', empty: 'rgba(23,23,26,.12)', flow: true, warm: false,\n        lock: 'Låst', carLabel: 'Bil fyldt 72 procent, lader',\n        metrics: [{ v: '11 kW', k: 'ladeeffekt' }, { v: '20.43', k: 'forventet færdig' }]\n      },\n      parkeret: {\n        surface: '#E4EFE8', mode: 'Ikke tilsluttet', title: 'Parkeret', titleC: '#17171A', sub: '286 km rækkevidde', big: '64',\n        bigC: '#17171A', level: 0.64, fill: '#5E6B63', empty: 'rgba(23,23,26,.10)', flow: false, warm: false,\n        lock: 'Låst', carLabel: 'Bil fyldt 64 procent, parkeret',\n        metrics: [{ v: 'Låst', k: 'adgang' }, { v: 'Slukket', k: 'klima' }]\n      },\n      klima: {\n        surface: '#CDE8D8', mode: 'Ikke tilsluttet', title: 'Klimaet kører', titleC: '#17442F', sub: 'Varmer kabinen til 21 °C', big: '64',\n        bigC: '#17442F', level: 0.64, fill: '#2F7A55', empty: 'rgba(23,23,26,.12)', flow: false, warm: true,\n        lock: 'Låst', carLabel: 'Bil fyldt 64 procent, klima kører',\n        metrics: [{ v: '14 °C', k: 'inde nu' }, { v: '21 °C', k: 'mål' }, { v: 'Høj', k: 'førersæde' }]\n      }\n    };\n    const s = { notice: '', ...(S[st] || S.ukendt) };\n    s.metricsOn = !s.notice;\n    // Bilen som prikfelt: karrosseriet fyldes op til det kendte batteriniveau; kabinen lever, når klimaet kører.\n    const k = 0.6;\n    const body = [[30, 300], [44, 236], [128, 208], [300, 124], [430, 92], [612, 90], [738, 122], [878, 190], [958, 212], [988, 258], [982, 300]];\n    const cabin = [[330, 136], [440, 108], [600, 106], [702, 134], [740, 186], [318, 186]];\n    const wheels = [[236, 300], [804, 300]];\n    const car = [];\n    for (let y = 80; y \u003c 362; y += 15) {\n      for (let x = 20; x \u003c 1000; x += 15) {\n        const near = wheels.some(([wx, wy]) => Math.hypot(x - wx, y - wy) \u003c 70);\n        const tire = wheels.some(([wx, wy]) => { const r = Math.hypot(x - wx, y - wy); return r > 40 && r \u003c 62; });\n        const inBody = this.inPoly(x, y, body) && !near;\n        const inCabin = this.inPoly(x, y, cabin);\n        let c = null, w = 6.5, cls = '', dl = 0;\n        if (tire) { c = '#17171A'; w = 6.5; }\n        else if (inCabin) {\n          if (s.warm) { c = '#FF7A5C'; cls = 'an-warm'; w = 6; dl = Math.round(-((x + y) % 300) * 8); }\n          else { c = 'rgba(23,23,26,.16)'; w = 3.5; }\n        } else if (inBody) {\n          const filled = (x - 30) / 958 \u003c= s.level;\n          c = filled ? s.fill : s.empty;\n          w = filled ? 7 : 5.5;\n          if (filled && s.flow) { cls = 'an-flow'; dl = Math.round(x * 2.2); }\n        }\n        if (c) car.push({ x: ((x - 20) * k - w / 2).toFixed(1), y: ((y - 80) * k * 1.1 - w / 2).toFixed(1), w, c, cls, dl });\n      }\n    }\n    const on = this.state.climate;\n    const lv = ['Fra', 'Lav', 'Mellem', 'Høj'];\n    const seat = (key, label) => ({\n      k: label,\n      opts: lv.map((l, i) => {\n        const sel = this.state.seat[key] === i;\n        return { l, on: sel ? 'true' : 'false', bg: sel ? '#17171A' : 'transparent', fg: sel ? '#F7F6F3' : '#17171A',\n          pick: () => this.setState({ seat: { ...this.state.seat, [key]: i } }) };\n      })\n    });\n    return {\n      s, car,\n      climateLabel: on ? 'Tændt · ' + this.state.temp + ' °C' : (st === 'ukendt' ? 'Sidst kendt: Slukket' : 'Slukket'),\n      climateAria: on ? 'true' : 'false', swBg: on ? '#2F7A55' : '#D6D3CC', knobX: on ? 38 : 0,\n      temp: this.state.temp, tempC: on ? '#17171A' : '#8C8A85',\n      seats: [seat('f', 'Førersæde'), seat('p', 'Passager')],\n      toggle: () => this.setState({ climate: !this.state.climate }),\n      down: () => this.setState({ temp: Math.max(15, this.state.temp - 1) }),\n      up: () => this.setState({ temp: Math.min(28, this.state.temp + 1) })\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}; window.__dcRootPath = "A-Tesla.dc.html";</script>

        surface: '#CDE8D8', mode: 'Ikke tilsluttet', title: 'Klimaet kører', titleC: '#17442F', sub: 'Varmer kabinen til 21 °C', big: '64',
        bigC: '#17442F', level: 0.64, fill: '#2F7A55', empty: 'rgba(23,23,26,.12)', flow: false, warm: true,
        lock: 'Låst', carLabel: 'Bil fyldt 64 procent, klima kører',
        metrics: [{ v: '14 °C', k: 'inde nu' }, { v: '21 °C', k: 'mål' }, { v: 'Høj', k: 'førersæde' }]
      }
    };
    const s = { notice: '', ...(S[st] || S.ukendt) };
    s.metricsOn = !s.notice;
    // Bilen som prikfelt: karrosseriet fyldes op til det kendte batteriniveau; kabinen lever, når klimaet kører.
    const k = 0.6;
    const body = [[30, 300], [44, 236], [128, 208], [300, 124], [430, 92], [612, 90], [738, 122], [878, 190], [958, 212], [988, 258], [982, 300]];
    const cabin = [[330, 136], [440, 108], [600, 106], [702, 134], [740, 186], [318, 186]];
    const wheels = [[236, 300], [804, 300]];
    const car = [];
    for (let y = 80; y < 362; y += 15) {
      for (let x = 20; x < 1000; x += 15) {
        const near = wheels.some(([wx, wy]) => Math.hypot(x - wx, y - wy) < 70);
        const tire = wheels.some(([wx, wy]) => { const r = Math.hypot(x - wx, y - wy); return r > 40 && r < 62; });
        const inBody = this.inPoly(x, y, body) && !near;
        const inCabin = this.inPoly(x, y, cabin);
        let c = null, w = 6.5, cls = '', dl = 0;
        if (tire) { c = '#17171A'; w = 6.5; }
        else if (inCabin) {
          if (s.warm) { c = '#FF7A5C'; cls = 'an-warm'; w = 6; dl = Math.round(-((x + y) % 300) * 8); }
          else { c = 'rgba(23,23,26,.16)'; w = 3.5; }
        } else if (inBody) {
          const filled = (x - 30) / 958 <= s.level;
          c = filled ? s.fill : s.empty;
          w = filled ? 7 : 5.5;
          if (filled && s.flow) { cls = 'an-flow'; dl = Math.round(x * 2.2); }
        }
        if (c) car.push({ x: ((x - 20) * k - w / 2).toFixed(1), y: ((y - 80) * k * 1.1 - w / 2).toFixed(1), w, c, cls, dl });
      }
    }
    const on = this.state.climate;
    const lv = ['Fra', 'Lav', 'Mellem', 'Høj'];
    const seat = (key, label) => ({
      k: label,
      opts: lv.map((l, i) => {
        const sel = this.state.seat[key] === i;
        return { l, on: sel ? 'true' : 'false', bg: sel ? '#17171A' : 'transparent', fg: sel ? '#F7F6F3' : '#17171A',
          pick: () => this.setState({ seat: { ...this.state.seat, [key]: i } }) };
      })
    });
    return {
      s, car,
      climateLabel: on ? 'Tændt · ' + this.state.temp + ' °C' : (st === 'ukendt' ? 'Sidst kendt: Slukket' : 'Slukket'),
      climateAria: on ? 'true' : 'false', swBg: on ? '#2F7A55' : '#D6D3CC', knobX: on ? 38 : 0,
      temp: this.state.temp, tempC: on ? '#17171A' : '#8C8A85',
      seats: [seat('f', 'Førersæde'), seat('p', 'Passager')],
      toggle: () => this.setState({ climate: !this.state.climate }),
      down: () => this.setState({ temp: Math.max(15, this.state.temp - 1) }),
      up: () => this.setState({ temp: Math.min(28, this.state.temp + 1) })
    };
  }
}
</script>
