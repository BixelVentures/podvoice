<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Overblik</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#17171A;text-decoration:none}
.cd{position:relative;overflow:hidden;border-radius:24px;background:#F7F6F3;box-shadow:inset 0 0 0 1px rgba(23,23,26,.06);transition:transform .14s ease, background-color .6s ease}
a.cd:active,.cd:has(> a.hit:active){transform:scale(.985)}
.hit{position:absolute;inset:0;border-radius:inherit;z-index:1}
.btn{position:relative;z-index:2;border:0;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn:focus-visible,a:focus-visible{outline:2px solid #17171A;outline-offset:3px}
.sq{position:absolute;border-radius:1px}
.dt{position:absolute;border-radius:50%}
.chev{position:absolute;right:20px;top:22px;z-index:2}
.tag{font:500 11px 'IBM Plex Mono', ui-monospace, monospace;letter-spacing:.06em;text-transform:uppercase}
.an-in{animation:inward 2.4s ease-in-out infinite}
.an-flow{animation:flow 2s linear infinite}
@keyframes inward{0%,100%{transform:scale(.45);opacity:.45}50%{transform:scale(1);opacity:1}}
@keyframes flow{0%{opacity:1}14%{opacity:.35}28%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.an-in,.an-flow{animation:none}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; background: #E9E7E2; color: #17171A; font-family: 'Schibsted Grotesk', system-ui, sans-serif; position: relative">
  <dc-import name="A-Topbar" heading="Hjem" scenario="{{scenario}}" hint-size="1280px,72px"></dc-import>
  <div style="position: absolute; left: 24px; top: 88px; display: flex; gap: 16px">
    <div style="display: grid; grid-template-columns: repeat(4, 199px); grid-template-rows: repeat(3, 221px); gap: 16px">

      <a href="Main.dc.html" class="cd" style="grid-column: 1 / span 2; grid-row: 1 / span 2; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; background: {{w.bg}}" aria-label="Vejr, {{w.temp}}, {{w.cond}}">
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        <div style="position: absolute; left: 150px; top: 0; width: 264px; height: 300px" aria-hidden="true">
          <sc-for list="{{wx}}" as="d" hint-placeholder-count="300">
            <i class="sq" style="left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.w}}px; background: {{w.field}}"></i>
          </sc-for>
          <sc-for list="{{wplus}}" as="p" hint-placeholder-count="3">
            <span style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; font: 500 14px/1 'IBM Plex Mono', monospace; color: {{w.field}}">+</span>
          </sc-for>
        </div>
        <div style="position: relative; display: flex; align-items: center; gap: 10px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M6 18h11a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.5A3.3 3.3 0 0 0 6 18z"/></svg>
          <span style="font-size: 18px; font-weight: 600">Vejr</span>
        </div>
        <span style="position: relative; margin-top: 18px; font-size: 112px; line-height: .9; font-weight: 500; letter-spacing: -0.055em; color: {{w.tempC}}">{{w.temp}}</span>
        <span style="position: relative; margin-top: 14px; font-size: 20px; font-weight: 700">{{w.cond}}</span>
        <span style="position: relative; font-size: 15px; color: #3E4660">{{w.range}}</span>
        <sc-if value="{{w.stale}}" hint-placeholder-val="{{ false }}">
          <span class="tag" style="position: relative; margin-top: 10px; align-self: flex-start; padding: 5px 9px; border-radius: 8px; background: rgba(23,23,26,.07); color: #4A4945">{{w.stale}}</span>
        </sc-if>
        <div style="margin-top: auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-top: 16px; border-top: 1px solid rgba(31,85,240,.16)">
          <sc-for list="{{w.hours}}" as="h" hint-placeholder-count="5">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
              <span style="font: 500 13px 'IBM Plex Mono', ui-monospace, monospace; color: #3E4660">{{h.t}}</span>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{h.d}}"/></svg>
              <span style="font-size: 19px; font-weight: 700; color: {{w.hourC}}">{{h.v}}</span>
            </div>
          </sc-for>
        </div>
      </a>

      <div class="cd" style="grid-column: 3 / span 2; grid-row: 1; padding: 22px 24px; box-sizing: border-box; display: flex; flex-direction: column; background: {{r.bg}}">
        <a href="A-Robot.dc.html" class="hit" aria-label="Robotstøvsuger, {{r.status}}, åbn detalje"></a>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        <div style="position: absolute; right: 0; top: 0; width: 250px; height: 221px; opacity: {{r.fieldOp}}" aria-hidden="true">
          <sc-for list="{{rings}}" as="d" hint-placeholder-count="200">
            <i class="sq {{r.anim}}" style="left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.w}}px; background: #B23A62; animation-delay: {{d.dl}}ms"></i>
          </sc-for>
          <sc-for list="{{rplus}}" as="p" hint-placeholder-count="2">
            <span style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; font: 500 14px/1 'IBM Plex Mono', monospace; color: #B23A62">+</span>
          </sc-for>
        </div>
        <div style="position: relative; display: flex; align-items: center; gap: 10px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M10 4.5h4"/></svg>
          <span style="font-size: 18px; font-weight: 600">Robotstøvsuger</span>
        </div>
        <span style="position: relative; margin-top: 14px; font-size: 26px; font-weight: 800; letter-spacing: -0.015em; color: #8A2A4C">{{r.status}}</span>
        <span style="position: relative; font-size: 15px; color: #5E4049; max-width: 200px">{{r.sub}}</span>
        <sc-if value="{{r.active}}" hint-placeholder-val="{{ false }}">
          <div style="position: relative; margin-top: 10px; display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); gap: 2px; width: 180px" role="img" aria-label="38 procent færdig">
            <sc-for list="{{seg}}" as="s" hint-placeholder-count="30"><i style="height: 7px; border-radius: 2px; background: {{s}}; display: block"></i></sc-for>
          </div>
          <button class="btn" aria-label="Sæt rengøring på pause" style="margin-top: auto; align-self: flex-start; height: 44px; padding: 0 20px; border-radius: 999px; background: #17171A; color: #F7F6F3; font: 600 16px 'Schibsted Grotesk', system-ui, sans-serif">Pause</button>
        </sc-if>
      </div>

      <a href="Main.dc.html" class="cd" style="grid-column: 3; grid-row: 2; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; background: {{l.bg}}" aria-label="Lys, {{l.status}}">
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        <div style="position: absolute; right: 0; bottom: 0; width: 160px; height: 150px; opacity: {{l.op}}" aria-hidden="true">
          <sc-for list="{{lt}}" as="d" hint-placeholder-count="160">
            <i class="sq" style="left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.w}}px; background: {{l.dot}}"></i>
          </sc-for>
          <sc-for list="{{lplus}}" as="p" hint-placeholder-count="1">
            <span style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; font: 500 14px/1 'IBM Plex Mono', monospace; color: {{l.dot}}">+</span>
          </sc-for>
        </div>
        <div style="position: relative; display: flex; align-items: center; gap: 10px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/></svg>
          <span style="font-size: 18px; font-weight: 600">Lys</span>
        </div>
        <span style="position: relative; margin-top: 14px; font-size: 22px; font-weight: 800; color: {{l.fg}}; line-height: 1.15">{{l.status}}</span>
      </a>

      <a href="A-Tesla.dc.html" class="cd" style="grid-column: 4; grid-row: 2; padding: 22px 20px 18px; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.bg}}" aria-label="Tesla, {{t.big}} procent, {{t.sub}}">
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        <div style="display: flex; align-items: center; gap: 10px">
          <svg width="26" height="24" viewBox="0 0 26 24" fill="none" stroke="#17171A" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 15v-3l3-4h12l4 4h1v3H3z"/><circle cx="8" cy="16" r="2"/><circle cx="18" cy="16" r="2"/></svg>
          <span style="font-size: 18px; font-weight: 600">Tesla</span>
        </div>
        <span style="margin-top: 12px; font: 500 38px/1 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: -0.05em; color: {{t.bigC}}">{{t.big}}<span style="font-size: 20px"> %</span></span>
        <span style="font-size: 14px; color: #3C4A42; margin-top: 4px">{{t.sub}}</span>
        <div style="margin-top: auto; position: relative; height: 50px" role="img" aria-label="Bil fyldt til {{t.big}} procent">
          <sc-for list="{{car}}" as="d" hint-placeholder-count="200">
            <i class="dt {{d.cls}}" style="left: {{d.x}}px; top: {{d.y}}px; width: {{d.w}}px; height: {{d.w}}px; background: {{d.c}}; animation-delay: {{d.dl}}ms"></i>
          </sc-for>
        </div>
      </a>

      <a href="A-Musik.dc.html" class="cd" style="grid-column: 1; grid-row: 3; padding: 20px 22px; box-sizing: border-box; display: flex; flex-direction: column" aria-label="Find musik, {{fm.l1}}">
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="1.7" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
        <span style="margin-top: auto; font-size: 20px; font-weight: 800">Find musik</span>
        <span style="font-size: 15px; color: #3F3E3B">{{fm.l1}}</span>
        <span style="font-size: 14px; color: #5F5E5A">{{fm.l2}}</span>
      </a>

      <a href="Main.dc.html" class="cd" style="grid-column: 2; grid-row: 3; padding: 20px 22px; box-sizing: border-box; display: flex; flex-direction: column" aria-label="Radio, {{radio.sub}}">
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{radio.ic}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{radio.ic}}" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8l10-4"/><circle cx="15" cy="14" r="2.5"/><path d="M6 12h4M6 15h4"/></svg>
        <span style="margin-top: auto; font-size: 20px; font-weight: 800; color: {{radio.fg}}">Radio</span>
        <span style="font-size: 14px; color: #5F5E5A">{{radio.sub}}</span>
      </a>

      <a href="A-Opskrift.dc.html" class="cd" style="grid-column: 3; grid-row: 3; padding: 18px 20px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2E4D3" aria-label="Opskrifter, Burgerboller, trin 2 af 5">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-size: 14px; font-weight: 600; color: #7A4A22">Opskrift i gang</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17171A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <span style="margin-top: auto; font-size: 20px; font-weight: 800; letter-spacing: -0.01em">Burgerboller</span>
        <span style="font-size: 14px; color: #6B4A2E">Trin 2 af 5 · hævning</span>
        <div style="margin-top: 10px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px" role="img" aria-label="Trin 2 af 5">
          <sc-for list="{{steps}}" as="s" hint-placeholder-count="5"><i style="height: 6px; border-radius: 3px; background: {{s}}; display: block"></i></sc-for>
        </div>
      </a>

      <div class="cd" style="grid-column: 4; grid-row: 3; padding: 18px 20px; box-sizing: border-box; display: flex; flex-direction: column; background: #17171A; color: #F7F6F3">
        <a href="Main.dc.html" class="hit" aria-label="Timer, {{tm.aria}}"></a>
        <sc-if value="{{tm.active}}" hint-placeholder-val="{{ false }}">
          <svg style="position: absolute; right: 16px; top: 16px" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
            <circle cx="22" cy="22" r="18" fill="none" stroke="#2E2E33" stroke-width="5"/>
            <circle cx="22" cy="22" r="18" fill="none" stroke="#FF7A5C" stroke-width="5" stroke-linecap="round" stroke-dasharray="98.4 113.1" transform="rotate(-90 22 22)"/>
          </svg>
          <span style="font-size: 15px; font-weight: 600; color: #BDBBB5">Timer</span>
          <span style="margin-top: 4px; font: 500 40px/1 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: -0.05em">8:42</span>
          <button class="btn" style="margin-top: auto; height: 44px; border-radius: 999px; background: #2B2B30; color: #F7F6F3; font: 600 15px 'Schibsted Grotesk', system-ui, sans-serif">Annuller</button>
        </sc-if>
        <sc-if value="{{tm.idle}}" hint-placeholder-val="{{ true }}">
          <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F7F6F3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F7F6F3" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/></svg>
          <span style="margin-top: auto; font-size: 20px; font-weight: 800">Timer</span>
          <span style="font-size: 14px; color: #BDBBB5">Start en timer</span>
        </sc-if>
      </div>
    </div>
    <dc-import name="A-Player" idle="{{p.idle}}" speaker="Køkkenalrum HomePod" hint-size="372px,696px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scenario":{"editor":"enum","default":"green","options":["green","aktiv"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  inPoly(x, y, P) {
    let c = false;
    for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
      if ((P[i][1] > y) !== (P[j][1] > y) && x < ((P[j][0] - P[i][0]) * (y - P[i][1])) / (P[j][1] - P[i][1]) + P[i][0]) c = !c;
    }
    return c;
  }
  renderVals() {
    const green = (this.props.scenario || 'green') === 'green';
    const f = (n) => n.toFixed(1);
    const I = {
      cloud: 'M6 18h11a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.5A3.3 3.3 0 0 0 6 18z',
      sun: 'M7 19h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.5A3.3 3.3 0 0 0 7 19zM11 8a3 3 0 1 0-5.5 1.7',
      rain: 'M7 15h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.5A3.3 3.3 0 0 0 7 15zM9 18l-1 2.5M13 18l-1 2.5M17 18l-1 2.5'
    };
    // green = de faktiske tilstande på Green 9. nov. kl. 10.20. aktiv = samme pladser, alt i gang.
    // Domænetoningen er identitet og er der altid; tilstand vises som intensitet (live stærkere og levende, sidst kendt/utilgængelig dæmpet).
    const w = green
      ? { bg: '#E4EAF4', field: '#8D9CBC', tempC: '#3A4560', temp: '7°', cond: 'Skyet', range: 'Højst 9° · Lavest 6°', stale: 'Sidst kendt · hentet 10.17', hourC: '#3A4560',
          hours: ['11.00', '12.00', '13.00', '14.00', '15.00'].map((t) => ({ t, v: '9°', d: I.cloud })) }
      : { bg: '#DDE6FB', field: '#1F55F0', tempC: '#17171A', temp: '15°', cond: 'Let skyet', range: 'Højst 17° · Lavest 9°', stale: '', hourC: '#1A3FB8',
          hours: [{ t: '14.00', v: '16°', d: I.sun }, { t: '15.00', v: '17°', d: I.sun }, { t: '16.00', v: '15°', d: I.rain }, { t: '17.00', v: '14°', d: I.rain }, { t: '18.00', v: '14°', d: I.cloud }] };
    const r = green
      ? { bg: '#F6E6EA', status: 'Oplader', sub: 'Batteri 100 % · senest 45,1 m²', active: false, anim: '', fieldOp: 0.6 }
      : { bg: '#F6D8E1', status: 'Rengør', sub: 'Køkkenalrum · 38 %', active: true, anim: 'an-in', fieldOp: 1 };
    const l = green
      ? { bg: '#F6F0E2', status: 'Ikke forbundet', fg: '#6F6A5E', dot: '#B9AE93', op: 0.5 }
      : { bg: '#FBEBC6', status: 'Tændt', fg: '#7A5205', dot: '#C08410', op: 1 };
    const t = green
      ? { bg: '#E7EEE9', big: '94', bigC: '#2E4A3B', sub: 'Sidst kendt · låst', level: 0.94, fill: '#6F7A73', empty: 'rgba(23,23,26,.1)', flow: false }
      : { bg: '#D5EADD', big: '72', bigC: '#17442F', sub: 'Lader · 312 km', level: 0.72, fill: '#2F7A55', empty: 'rgba(23,23,26,.12)', flow: true };
    const radio = green
      ? { sub: 'Ikke tilgængelig', fg: '#8C8A85', ic: '#8C8A85', op: 0.25 }
      : { sub: 'Vælg station', fg: '#17171A', ic: '#17171A', op: 0.55 };
    const tm = green ? { active: false, idle: true, aria: 'start en timer' } : { active: true, idle: false, aria: '8 minutter og 42 sekunder tilbage' };

    // Hjørnemateriale som i ankeret: tætte kvadratiske celler mod kanten, der tynder ud mod teksten, med få plustegn.
    const wx = [];
    const blobs = [[134, 136, 40], [182, 104, 54], [230, 142, 36]];
    for (let y = 4.5; y < 300; y += 9) {
      for (let x = 4.5; x < 264; x += 9) {
        let d = 999;
        for (const b of blobs) d = Math.min(d, Math.hypot(x - b[0], y - b[1]) - b[2]);
        if (x > 96 && x < 266 && y > 132 && y < 178) d = Math.min(d, -1);
        if (d < 4) continue;
        const fade = Math.min(1, x / 90) * Math.min(1, (300 - y) / 110) * Math.min(1, (y + 20) / 40);
        const wd = Math.max(0, 6.4 - d * 0.045) * fade;
        if (wd > 0.8) wx.push({ x: f(x - wd / 2), y: f(y - wd / 2), w: f(wd) });
      }
    }
    const wplus = [{ x: 30, y: 46 }, { x: 14, y: 196 }, { x: 214, y: 262 }];
    const rings = [];
    for (let y = 4.5; y < 221; y += 9) {
      for (let x = 4.5; x < 250; x += 9) {
        const rr = Math.hypot(x - 262, y - 236);
        if (rr < 26 || rr > 300) continue;
        const ph = (rr % 22) / 22;
        if (ph > 0.55) continue;
        const wd = (6.6 - rr * 0.015) * Math.min(1, x / 110) * Math.min(1, (y + 30) / 60) * (1 - Math.abs(ph - 0.27) * 1.4);
        if (wd > 0.9) rings.push({ x: f(x - wd / 2), y: f(y - wd / 2), w: f(wd), dl: Math.round(-(rr / 300) * 2400) });
      }
    }
    const rplus = [{ x: 110, y: 64 }, { x: 52, y: 150 }];
    const seg = Array.from({ length: 30 }, (_, i) => (i < 11 ? '#7E2242' : 'rgba(126,34,66,.16)'));
    const lt = [];
    for (let y = 4.5; y < 150; y += 9) {
      for (let x = 4.5; x < 160; x += 9) {
        const dg = Math.hypot(x - 108, y - 70) - 30;
        const inNeck = x > 96 && x < 120 && y > 90 && y < 124;
        if (dg < 4 || inNeck) continue;
        const wd = Math.max(0, 6 - dg * 0.04) * Math.min(1, x / 70) * Math.min(1, y / 40);
        if (wd > 0.8) lt.push({ x: f(x - wd / 2), y: f(y - wd / 2), w: f(wd) });
      }
    }
    const lplus = [{ x: 30, y: 96 }];
    // Bilen som prikfelt: karrosseriet er batteriet.
    const body = [[30, 300], [44, 236], [128, 208], [300, 124], [430, 92], [612, 90], [738, 122], [878, 190], [958, 212], [988, 258], [982, 300]];
    const wheels = [[236, 300], [804, 300]];
    const car = [];
    const k = 0.135;
    for (let y = 84; y < 362; y += 34) {
      for (let x = 24; x < 1000; x += 34) {
        const tire = wheels.some(([a, b]) => { const rr = Math.hypot(x - a, y - b); return rr > 34 && rr < 62; });
        const near = wheels.some(([a, b]) => Math.hypot(x - a, y - b) < 70);
        const inBody = this.inPoly(x, y, body) && !near;
        let c = null, wd = 4.6, cls = '', dl = 0;
        if (tire) { c = '#17171A'; wd = 4.4; }
        else if (inBody) {
          const on = (x - 30) / 958 <= t.level;
          c = on ? t.fill : t.empty;
          if (on && t.flow) { cls = 'an-flow'; dl = Math.round(x * 2); }
        }
        if (c) car.push({ x: f((x - 24) * k - wd / 2), y: f((y - 84) * k * 1.3 - wd / 2), w: wd, c, cls, dl });
      }
    }
    const minis = [{ bg: '#232655', fg: '#8E95F2' }, { bg: '#3A1B31', fg: '#F07A4A' }, { bg: '#1E4A38', fg: '#D9E7B0' }];
    const dial = Array.from({ length: 16 }, (_, i) => (i % 5 === 0 ? 18 : 9));
    const steps = ['#7A4A22', '#C98A4E', 'rgba(122,74,34,.18)', 'rgba(122,74,34,.18)', 'rgba(122,74,34,.18)'];
    const fm = green ? { l1: 'Vælg musik', l2: '' } : { l1: 'Heartless', l2: 'Kanye West' };
    return { scenario: green ? 'green' : 'aktiv', fm, w, r, l, t, radio, tm, p: { idle: green }, wx, wplus, rplus, lplus, rings, seg, lt, car, minis, dial, steps };
  }
}
