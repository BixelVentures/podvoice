<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PodView panel host (test)</title>
<style>html,body{margin:0;height:100%;background:#f7f5f0}iframe{border:0;display:block;width:100%;height:100vh}</style>
</head>
<body>
<!-- Stands in for HA's ha-panel-custom with embed_iframe and handle_safe_area: an iframe written with only the
     loader, a registerIframe handshake, and the safe-area insets copied onto the iframe's root. -->
<script type="module">
import {addonAnswers, createFakeHass, FAKE_PANEL, fakeSpeakers} from './fixture.js';
const params = new URLSearchParams(location.search);
const panel = {...FAKE_PANEL, config: {...FAKE_PANEL.config, bundle: '0123456789ab',
  _panel_custom: {name: 'podview-panel', embed_iframe: true, handle_safe_area: true,
    module_url: '/podvoice_static/frontend/0123456789ab/podview-loader.js'}}};
let setProperties = null;
const fake = createFakeHass({confirmMs: Number(params.get('confirm') ?? 150), onChange: hass => setProperties?.({hass})});
// ?connected=0: HA's websocket is down when the panel starts (a reload while disconnected).
if (params.get('connected') === '0') fake.setConnected(false);
window.fakeHass = fake;
// The add-on's answer state (fixtures/addon.ts): the journey makes GPT-Live give an answer.
window.addonAnswers = addonAnswers;
// PodConnect rooms that are not ready or whose start fails (fixtures/music.ts): the journey makes a start fail.
window.fakeSpeakers = fakeSpeakers;
const iframe = document.createElement('iframe');
iframe.title = 'PodView';
document.body.append(iframe);
window.customPanel = {
  registerIframe(initialize, set) {
    setProperties = set;
    const root = iframe.contentDocument.documentElement;
    root.style.setProperty('--safe-area-inset-top', params.get('safeTop') ?? '24px');
    root.style.setProperty('--safe-area-inset-bottom', params.get('safeBottom') ?? '20px');
    initialize(panel, {hass: fake.hass, narrow: false,
      route: {prefix: '/podview', path: params.get('kit') ? '/_kit'
      : params.get('area') ? `/${params.get('area')}` : ''}});
  },
};
const doc = iframe.contentWindow.document;
doc.open();
doc.write("<!doctype html><script type='module' src='/ha_panel/custom-panel.js'><\/script>");
doc.close();
</script>
</body>
</html>
